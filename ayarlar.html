<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurra Motor ERP — Ayarlar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .ay-wrap {
      flex:1;overflow-y:auto;
      display:flex;gap:0;
    }
    /* Sol nav */
    .ay-nav {
      width:200px;
      background:var(--s);
      border-right:1px solid var(--bd);
      padding:12px 8px;
      flex-shrink:0;
    }
    .ay-nav-btn {
      display:flex;align-items:center;gap:8px;
      width:100%;background:none;border:none;
      padding:8px 10px;border-radius:var(--Rs);
      font-family:var(--fn);font-size:12px;font-weight:500;
      color:var(--t2);cursor:pointer;text-align:left;
      transition:all .1s;margin-bottom:2px;
    }
    .ay-nav-btn:hover{background:var(--s2);color:var(--t)}
    .ay-nav-btn.on{background:var(--bld);color:var(--bl);font-weight:600}
    .ay-nav-btn .ni{font-size:15px}

    /* İçerik */
    .ay-content {
      flex:1;overflow-y:auto;padding:20px;
      max-width:720px;
    }
    .ay-content::-webkit-scrollbar{width:4px}
    .ay-content::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

    .ay-sec {
      background:var(--s);
      border:1px solid var(--bd);
      border-radius:var(--R);
      padding:16px;
      margin-bottom:12px;
    }
    .ay-sec h3 {
      font-size:13px;font-weight:600;
      margin-bottom:12px;
      padding-bottom:8px;
      border-bottom:1px solid var(--bd);
    }

    /* Renk seçici */
    .renk-grid{display:flex;gap:8px;flex-wrap:wrap}
    .renk-opt{
      width:26px;height:26px;border-radius:50%;
      cursor:pointer;border:2px solid transparent;
      transition:all .15s;
    }
    .renk-opt.on{border-color:var(--t);transform:scale(1.25)}

    /* Depolama bar */
    .storage-bar{
      background:var(--s2);border:1px solid var(--bd);
      border-radius:var(--Rs);padding:10px 12px;
      font-size:12px;color:var(--t2);
      display:flex;align-items:center;justify-content:space-between;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <a href="dashboard.html" class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <span class="brand-nm" id="brand-nm">Hurra Motor</span>
  </a>
  <div class="vsep"></div>
  <nav id="main-nav" style="display:flex;gap:2px"></nav>
  <div class="hdr-right">
    <div id="live-clock"></div>
    <div class="vsep"></div>
    <div class="kur-strip">
      <div class="ki"><span class="kl">USD</span><span class="kd" id="kd-usd"></span><span class="kv" id="kv-usd">—</span></div>
      <div class="ki"><span class="kl">EUR</span><span class="kd" id="kd-eur"></span><span class="kv" id="kv-eur">—</span></div>
      <div class="ki"><span class="kl">CNY</span><span class="kd" id="kd-cny"></span><span class="kv" id="kv-cny">—</span></div>
    </div>
    <div class="vsep"></div>
    <button id="dark-toggle" onclick="toggleDark()">🌙</button>
    <button class="btn-logout" onclick="cikisYap()">Çıkış</button>
  </div>
</header>

<div class="ay-wrap">

  <!-- Sol nav -->
  <div class="ay-nav">
    <div style="font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;margin-bottom:6px">Ayarlar</div>
    <button class="ay-nav-btn on" onclick="ayNavSec('firma',this)"><span class="ni">🏢</span> Firma</button>
    <button class="ay-nav-btn" onclick="ayNavSec('muhasebe',this)"><span class="ni">💰</span> Muhasebe</button>
    <button class="ay-nav-btn" onclick="ayNavSec('gorunum',this)"><span class="ni">🎨</span> Görünüm</button>
    <button class="ay-nav-btn" onclick="ayNavSec('uyari',this)"><span class="ni">🔔</span> Uyarılar</button>
    <button class="ay-nav-btn" onclick="ayNavSec('guvenlik',this)"><span class="ni">🔒</span> Güvenlik</button>
    <button class="ay-nav-btn" onclick="ayNavSec('veri',this)"><span class="ni">🗄️</span> Veri</button>
    <button class="ay-nav-btn" onclick="ayNavSec('hakkinda',this)"><span class="ni">ℹ️</span> Hakkında</button>
  </div>

  <!-- İçerik -->
  <div class="ay-content" id="ay-content"></div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="core.js?v=33"></script>
<script>
if(!sessionKontrol()) location.href='index.html';

let aktifAy = 'firma';

function ayNavSec(id, btn){
  aktifAy = id;
  document.querySelectorAll('.ay-nav-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  ayRender(id);
}

function ayRender(id){
  const el = document.getElementById('ay-content');
  if(id==='firma') el.innerHTML = firmaHTML();
  else if(id==='muhasebe') el.innerHTML = muhasebeHTML();
  else if(id==='gorunum') el.innerHTML = gorununHTML();
  else if(id==='uyari') el.innerHTML = uyariHTML();
  else if(id==='guvenlik') el.innerHTML = guvenlikHTML();
  else if(id==='veri') el.innerHTML = veriHTML();
  else if(id==='hakkinda') el.innerHTML = hakkindaHTML();
}

// ─────────────────────────────────────────
// FİRMA
// ─────────────────────────────────────────
function firmaHTML(){
  const ay = ldObj('ay', AYAR_DEF);
  const markalar = JSON.parse(localStorage.getItem('hm_markalar')||'[]');
  const logoData = localStorage.getItem('hm_logo')||'';

  return `
  <!-- KAYDET BUTONU -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="font-size:15px;font-weight:600">Firma & Marka Bilgileri</div>
    <button class="btn btn-pri btn-sm" onclick="firmaKaydet()">💾 Kaydet</button>
  </div>

  <!-- ── 1. FİRMA ÜNVANı ──────────────────────────── -->
  <div class="ay-sec">
    <h3>🏢 Firma Bilgileri <span style="font-size:10px;font-weight:400;color:var(--t3)">— Hukuki kimlik, resmi belgeler ve faturalar için</span></h3>
    <div class="fg">
      <div class="field fg-full">
        <label>Firma Ünvanı * <span style="color:var(--t3);font-weight:400">(tam hukuki ad)</span></label>
        <input type="text" id="ay-unvan" value="${ay.unvan||''}" placeholder="Hurra Motor Teknoloji San. ve Tic. Ltd. Şti.">
      </div>
      <div class="field">
        <label>Vergi Kimlik No</label>
        <input type="text" id="ay-vno" value="${ay.vno||''}" placeholder="1234567890">
      </div>
      <div class="field">
        <label>Vergi Dairesi</label>
        <input type="text" id="ay-vd" value="${ay.vd||''}" placeholder="Antalya VD">
      </div>
      <div class="field">
        <label>MERSİS No</label>
        <input type="text" id="ay-mersis" value="${ay.mersis||''}" placeholder="0123456789000001" style="font-family:var(--mn)">
      </div>
      <div class="field">
        <label>Ticaret Sicil No</label>
        <input type="text" id="ay-ticaret" value="${ay.ticaret||''}" placeholder="123456">
      </div>
      <div class="field">
        <label>Telefon</label>
        <input type="tel" id="ay-tel" value="${ay.tel||''}" placeholder="+90 242 000 00 00">
      </div>
      <div class="field">
        <label>E-posta</label>
        <input type="email" id="ay-email" value="${ay.email||''}" placeholder="info@hurramotor.com">
      </div>
      <div class="field">
        <label>Web Sitesi</label>
        <input type="text" id="ay-web" value="${ay.web||''}" placeholder="www.hurramotor.com">
      </div>
      <div class="field fg-full">
        <label>Adres</label>
        <textarea id="ay-adres" rows="2">${ay.adres||''}</textarea>
      </div>
      <div class="field">
        <label>Şehir</label>
        <input type="text" id="ay-sehir" value="${ay.sehir||''}" placeholder="Antalya">
      </div>
      <div class="field">
        <label>Posta Kodu</label>
        <input type="text" id="ay-posta" value="${ay.posta||''}" placeholder="07000">
      </div>
    </div>
    <!-- Belgede nasıl görünür -->
    <div style="margin-top:12px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--Rs);padding:10px 14px">
      <div style="font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">📄 Fatura / Resmi Belgede Görünüm</div>
      <div style="font-size:13px;font-weight:700">${ay.unvan||'Firma ünvanı girilmemiş'}</div>
      <div style="font-size:11px;color:var(--t3)">${ay.vno?'VKN: '+ay.vno:''} ${ay.vd?'— '+ay.vd:''}</div>
      <div style="font-size:11px;color:var(--t3)">${ay.adres||''} ${ay.sehir?'/ '+ay.sehir:''}</div>
    </div>
  </div>

  <!-- ── 2. MARKA BİLGİLERİ ────────────────────────── -->
  <div class="ay-sec">
    <h3>™ Marka Bilgileri <span style="font-size:10px;font-weight:400;color:var(--t3)">— Header, arayüz, pazarlama için</span></h3>
    <div style="background:var(--bld);border:1px solid var(--blb);border-radius:var(--Rs);padding:8px 12px;font-size:12px;color:var(--bl);margin-bottom:12px">
      ℹ Marka adı header ve arayüzde gösterilir. Firma ünvanı resmi belgelerde kullanılır.
    </div>
    <div class="fg">
      <div class="field">
        <label>Birincil Marka Adı * <span style="color:var(--t3);font-weight:400">(büyük harf önerilir)</span></label>
        <input type="text" id="ay-marka" value="${ay.marka||''}" placeholder="HURRA">
      </div>
      <div class="field">
        <label>Kısa / Tablo Adı</label>
        <input type="text" id="ay-markakisa" value="${ay.markaKisa||''}" placeholder="HURRA">
      </div>
      <div class="field">
        <label>Marka Sloganı</label>
        <input type="text" id="ay-slogan" value="${ay.slogan||''}" placeholder="Move Smart">
      </div>
      <div class="field">
        <label>Marka Yılı</label>
        <input type="number" id="ay-markayil" value="${ay.markaYil||new Date().getFullYear()}" placeholder="2024">
      </div>
    </div>
    <!-- Header önizleme -->
    <div style="margin-top:12px;background:var(--s);border:1px solid var(--bd);border-radius:var(--Rs);padding:10px 14px;display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;background:var(--bl);border-radius:7px;display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div style="font-size:14px;font-weight:700;letter-spacing:-.02em">${ay.marka||'Marka Adı'}<span style="color:var(--bl)">${ay.markaKisa&&ay.markaKisa!==ay.marka?' '+ay.markaKisa:''}</span></div>
        ${ay.slogan?`<div style="font-size:10px;color:var(--t3)">${ay.slogan}</div>`:''}
      </div>
      <div style="margin-left:auto;font-size:10px;color:var(--t3)">← Header önizleme</div>
    </div>
  </div>

  <!-- ── 3. EK MARKALAR ─────────────────────────────── -->
  <div class="ay-sec">
    <h3>™ Ek Markalar / Alt Markalar <span style="font-size:10px;font-weight:400;color:var(--t3)">— Çok marka desteği</span></h3>
    <div id="marka-listesi">
      ${markalar.length
        ? markalar.map((m,i)=>`
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)">
            <input type="text" value="${m.ad}" placeholder="Marka Adı" style="background:var(--s);border:1px solid var(--bd);border-radius:var(--Rs);font-family:var(--fn);font-size:12px;padding:5px 8px;outline:none;color:var(--t)" onchange="markaGuncelle(${i},'ad',this.value)">
            <input type="text" value="${m.slogan||''}" placeholder="Slogan" style="background:var(--s);border:1px solid var(--bd);border-radius:var(--Rs);font-family:var(--fn);font-size:12px;padding:5px 8px;outline:none;color:var(--t)" onchange="markaGuncelle(${i},'slogan',this.value)">
            <input type="text" value="${m.kisa||''}" placeholder="Kısa ad" style="background:var(--s);border:1px solid var(--bd);border-radius:var(--Rs);font-family:var(--fn);font-size:12px;padding:5px 8px;outline:none;color:var(--t)" onchange="markaGuncelle(${i},'kisa',this.value)">
            <button class="btn btn-ghost btn-xs" style="color:var(--rd)" onclick="markaSil(${i})">✕</button>
          </div>`).join('')
        : '<div class="text-dim" style="padding:8px 0;font-size:12px">Henüz ek marka eklenmedi</div>'
      }
    </div>
    <button class="btn btn-sec btn-sm" style="margin-top:10px" onclick="markaEkle()">+ Alt Marka Ekle</button>
    <div style="margin-top:10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--Rs);padding:8px 12px;font-size:11px;color:var(--t3)">
      Örnek: <strong>HURRA</strong> (ana) · <strong>HURRA PRO</strong> · <strong>HURRA E-MOBILITY</strong> · <strong>HURRA DELIVERY</strong>
    </div>
  </div>

  <!-- ── 4. LOGO YÖNETİMİ ───────────────────────────── -->
  <div class="ay-sec">
    <h3>🖼 Logo Yönetimi</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <!-- Logo yükleme -->
      <div>
        <div style="font-size:12px;font-weight:500;color:var(--t2);margin-bottom:8px">Ana Logo (PNG/SVG önerilir)</div>
        <div class="dropzone" onclick="document.getElementById('logo-input').click()" id="logo-dz">
          ${logoData
            ? `<img src="${logoData}" style="max-height:60px;max-width:160px;object-fit:contain">`
            : `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
               <div class="dropzone-title">Logo Yükle</div>
               <div class="dropzone-sub">PNG, SVG, JPG — max 500KB</div>`
          }
        </div>
        <input type="file" id="logo-input" accept="image/*" style="display:none" onchange="logoYukle(this)">
        ${logoData?`<button class="btn btn-ghost btn-xs" style="color:var(--rd);margin-top:6px" onclick="logoSil()">✕ Logoyu Kaldır</button>`:''}
      </div>
      <!-- Önizleme -->
      <div>
        <div style="font-size:12px;font-weight:500;color:var(--t2);margin-bottom:8px">Header Önizleme</div>
        <div style="background:var(--s);border:1px solid var(--bd);border-radius:var(--Rs);padding:10px 14px;display:flex;align-items:center;gap:8px">
          ${logoData
            ? `<img src="${logoData}" style="height:28px;object-fit:contain">`
            : `<div style="width:30px;height:30px;background:var(--bl);border-radius:7px;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>`
          }
          <span style="font-size:14px;font-weight:700">${ay.marka||'HURRA'}<span style="color:var(--bl)">Motor</span></span>
        </div>
        <div style="font-size:10px;color:var(--t3);margin-top:6px">Logo yüklendiğinde header'da ikonik logo yerine bu görünür</div>
      </div>
    </div>
  </div>
  `;
}

function firmaKaydet(){
  // Firma bilgilerini kaydet
  setAy('unvan',  document.getElementById('ay-unvan')?.value.trim()||'');
  setAy('vno',    document.getElementById('ay-vno')?.value.trim()||'');
  setAy('vd',     document.getElementById('ay-vd')?.value.trim()||'');
  setAy('mersis', document.getElementById('ay-mersis')?.value.trim()||'');
  setAy('ticaret',document.getElementById('ay-ticaret')?.value.trim()||'');
  setAy('tel',    document.getElementById('ay-tel')?.value.trim()||'');
  setAy('email',  document.getElementById('ay-email')?.value.trim()||'');
  setAy('web',    document.getElementById('ay-web')?.value.trim()||'');
  setAy('adres',  document.getElementById('ay-adres')?.value.trim()||'');
  setAy('sehir',  document.getElementById('ay-sehir')?.value.trim()||'');
  setAy('posta',  document.getElementById('ay-posta')?.value.trim()||'');
  // Marka bilgilerini kaydet
  setAy('marka',     document.getElementById('ay-marka')?.value.trim()||'');
  setAy('markaKisa', document.getElementById('ay-markakisa')?.value.trim()||'');
  setAy('slogan',    document.getElementById('ay-slogan')?.value.trim()||'');
  setAy('markaYil',  parseInt(document.getElementById('ay-markayil')?.value)||new Date().getFullYear());
  // firma: geriye uyumluluk için marka adını da sakla
  const markaAd = document.getElementById('ay-marka')?.value.trim()||'Hurra Motor';
  setAy('firma', markaAd);
  // Header'ı güncelle
  const nm = document.getElementById('brand-nm');
  if(nm) nm.textContent = markaAd;
  toast('Firma & marka bilgileri kaydedildi');
  // Önizlemeyi güncelle
  ayRender('firma');
}

// ─────────────────────────────────────────
// MUHASEBE
// ─────────────────────────────────────────
function muhasebeHTML(){
  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="font-size:15px;font-weight:600">Muhasebe Ayarları</div>
    <button class="btn btn-pri btn-sm" onclick="muhasebeKaydet()">💾 Kaydet</button>
  </div>
  <div class="ay-sec">
    <h3>💰 Para & Dönem</h3>
    <div class="fg">
      <div class="field"><label>Ana Para Birimi</label>
        <select id="ay-para">
          <option value="TRY" ${getAy('para')==='TRY'?'selected':''}>TRY — Türk Lirası</option>
          <option value="USD" ${getAy('para')==='USD'?'selected':''}>USD — Dolar</option>
          <option value="EUR" ${getAy('para')==='EUR'?'selected':''}>EUR — Euro</option>
        </select>
      </div>
      <div class="field"><label>Mali Yıl Başlangıcı</label>
        <select id="ay-yil">
          <option value="01" ${getAy('yil')==='01'?'selected':''}>Ocak</option>
          <option value="04" ${getAy('yil')==='04'?'selected':''}>Nisan</option>
          <option value="07" ${getAy('yil')==='07'?'selected':''}>Temmuz</option>
          <option value="10" ${getAy('yil')==='10'?'selected':''}>Ekim</option>
        </select>
      </div>
      <div class="field"><label>Varsayılan Vade (gün)</label><input type="number" id="ay-vade" value="${getAy('vade')||30}" min="0"></div>
      <div class="field"><label>KDV Oranı (%)</label><input type="number" id="ay-kdv" value="${getAy('kdv')||20}" step="1"></div>
      <div class="field"><label>ÖTV Oranı (%)</label><input type="number" id="ay-otv" value="${getAy('otv')||0}" step="1"></div>
    </div>
  </div>
  <div class="ay-sec">
    <h3>📄 Ekstre Ayarları</h3>
    <div class="fg">
      <div class="field"><label>Varsayılan Ekstre Dönemi</label>
        <select id="ay-eks-don">
          <option value="bu_ay" ${getAy('eksDon')==='bu_ay'?'selected':''}>Bu Ay</option>
          <option value="3ay" ${getAy('eksDon')==='3ay'?'selected':''}>Son 3 Ay</option>
          <option value="yil" ${getAy('eksDon')==='yil'?'selected':''}>Bu Yıl</option>
        </select>
      </div>
      <div class="field"><label>Ekstre Para Birimi</label>
        <select id="ay-eks-par">
          <option value="TRY" ${getAy('eksPar')==='TRY'?'selected':''}>TRY</option>
          <option value="USD" ${getAy('eksPar')==='USD'?'selected':''}>USD</option>
          <option value="EUR" ${getAy('eksPar')==='EUR'?'selected':''}>EUR</option>
        </select>
      </div>
    </div>
  </div>`;
}

function muhasebeKaydet(){
  setAy('para',   document.getElementById('ay-para').value);
  setAy('yil',    document.getElementById('ay-yil').value);
  setAy('vade',   parseInt(document.getElementById('ay-vade').value)||30);
  setAy('kdv',    parseInt(document.getElementById('ay-kdv').value)||20);
  setAy('otv',    parseInt(document.getElementById('ay-otv').value)||0);
  setAy('eksDon', document.getElementById('ay-eks-don').value);
  setAy('eksPar', document.getElementById('ay-eks-par').value);
  toast('Muhasebe ayarları kaydedildi');
}

// ─────────────────────────────────────────
// GÖRÜNÜM
// ─────────────────────────────────────────
function gorununHTML(){
  const renkler = ['#2563eb','#7c3aed','#0891b2','#059669','#d97706','#dc2626','#db2777'];
  const curRenk = getAy('renk')||'#2563eb';
  const dark = getAy('dark');
  return `
  <div style="font-size:15px;font-weight:600;margin-bottom:16px">Görünüm Ayarları</div>
  <div class="ay-sec">
    <h3>🎨 Tema</h3>
    <div class="set-row">
      <div><div class="set-lbl">Karanlık Mod</div><div class="set-sub">Koyu renk teması</div></div>
      <button class="toggle ${dark?'on':''}" id="tog-dark" onclick="darkToggle()"></button>

async function sifreDegistirAsync(){
  const eski  = document.getElementById('sp-eski').value;
  const user  = document.getElementById('sp-user').value.trim();
  const yeni  = document.getElementById('sp-yeni').value;
  const yeni2 = document.getElementById('sp-yeni2').value;
  const msg   = document.getElementById('sp-mesaj');
  if(yeni !== yeni2){
    msg.style.cssText='display:block;background:var(--rdd);border:1px solid var(--rdb);color:var(--rd)';
    msg.textContent='⚠ Yeni şifreler eşleşmiyor';
    return;
  }
  const sonuc = await sifreDegistir(eski, user, yeni);
  if(sonuc.ok){
    msg.style.cssText='display:block;background:var(--gnd);border:1px solid var(--gnb);color:var(--gn)';
    msg.textContent='✓ Şifre güncellendi.';
    document.getElementById('sp-eski').value='';
    document.getElementById('sp-yeni').value='';
    document.getElementById('sp-yeni2').value='';
    setTimeout(()=>ayRender('guvenlik'), 1500);
  } else {
    msg.style.cssText='display:block;background:var(--rdd);border:1px solid var(--rdb);color:var(--rd)';
    msg.textContent='⚠ ' + sonuc.msg;
  }
}

function veriExport(){
  const data={
    meta:{versiyon:'1.0',tarih:new Date().toISOString(),firma:getAy('firma')},
    cariler:ld('c'),
    hareketler:ld('h'),
    bankalar:ld('b'),
    bankaHareketler:ld('bh'),
    kasaHareketler:ld('kh'),
    gruplar:ld('gr'),
    ayarlar:ldObj('ay',{}),
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`hurra-erp-yedek-${today()}.json`;
  a.click();
  toast('Veri indirildi');
}

function veriImport(inp){
  if(!inp.files[0]) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.cariler) sv('c',d.cariler);
      if(d.hareketler) sv('h',d.hareketler);
      if(d.bankalar) sv('b',d.bankalar);
      if(d.bankaHareketler) sv('bh',d.bankaHareketler);
      if(d.kasaHareketler) sv('kh',d.kasaHareketler);
      if(d.gruplar) sv('gr',d.gruplar);
      // Ayarları da geri yükle
      if(d.ayarlar && typeof d.ayarlar === 'object'){
        const mevcut = ldObj('ay', {});
        // Şifre hash'ini koruyarak geri yükle
        const korunan = {};
        if(mevcut.__pwHash) korunan.__pwHash = mevcut.__pwHash;
        sv('ay', {...d.ayarlar, ...korunan});
      }
      toast('Veriler yüklendi — sayfa yenileniyor');
      setTimeout(()=>location.reload(),1200);
    }catch{toast('Geçersiz dosya formatı','err');}
  };
  r.readAsText(inp.files[0]);
}

function veriSifirla(){
  if(!confirm('TÜM VERİLER SİLİNECEK!\n\nBu işlem geri alınamaz. Devam etmek istiyor musunuz?')) return;

  });
  localStorage.removeItem(DB.kasa);
  toast('Sıfırlandı — yenileniyor','inf');
  setTimeout(()=>location.reload(),1200);
}

function logoYukle(inp){
  if(!inp.files[0]) return;

  r.onload=e=>{
    localStorage.setItem('hm_logo', e.target.result);
