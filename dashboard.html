<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Hurra Motor ERP — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    /* ── Dashboard özel stiller ── */
    .dash-wrap{ flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:14px; }
    .dash-wrap::-webkit-scrollbar{ width:4px; }
    .dash-wrap::-webkit-scrollbar-thumb{ background:var(--bd2); border-radius:2px; }

    /* ── Sabah Brifing Bandı ── */
    .briefing-bar{
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
      padding:12px 18px; border-radius:var(--R);
      border:1px solid var(--bd);
      background:var(--s);
      box-shadow:var(--sh);
    }
    .briefing-date{ font-size:12px; color:var(--t3); }
    .briefing-title{ font-size:18px; font-weight:800; letter-spacing:-.02em; color:var(--t); }
    .briefing-left{ display:flex; flex-direction:column; gap:2px; }
    .briefing-right{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

    .hs-pill{
      display:flex; align-items:center; gap:8px;
      padding:6px 14px; border-radius:99px;
      font-size:12px; font-weight:700;
      border:1.5px solid;
    }
    .hs-green{ background:#f0fdf4; border-color:#16a34a; color:#15803d; }
    .hs-yellow{ background:#fffbeb; border-color:#d97706; color:#92400e; }
    .hs-red{ background:#fef2f2; border-color:#dc2626; color:#991b1b; }
    .hs-dot{ width:8px; height:8px; border-radius:50%; animation:pulse-dot 2s ease-in-out infinite; }
    .hs-green .hs-dot{ background:#16a34a; }
    .hs-yellow .hs-dot{ background:#d97706; }
    .hs-red .hs-dot{ background:#dc2626; }
    @keyframes pulse-dot{
      0%,100%{ opacity:1; transform:scale(1); }
      50%{ opacity:.5; transform:scale(.7); }
    }

    /* ── Acil Eylemler Bandı ── */
    .action-band{
      border-radius:var(--R);
      overflow:hidden;
      border:1px solid;
    }
    .action-band-head{
      padding:8px 16px;
      font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
      display:flex; align-items:center; gap:7px;
    }
    .action-band-body{ display:flex; flex-wrap:wrap; gap:0; }
    .action-item{
      flex:1; min-width:200px;
      display:flex; align-items:center; gap:12px;
      padding:11px 16px;
      border-right:1px solid; border-top:1px solid;
      cursor:pointer; transition:background .12s;
    }
    .action-item:last-child{ border-right:none; }
    .action-item:hover{ filter:brightness(.97); }
    .ai-icon{ font-size:20px; flex-shrink:0; }
    .ai-body{ flex:1; min-width:0; }
    .ai-title{ font-size:12px; font-weight:700; margin-bottom:1px; }
    .ai-sub{ font-size:11px; opacity:.8; }
    .ai-count{ font-family:var(--mn); font-size:22px; font-weight:800; flex-shrink:0; }

    /* Kırmızı band */
    .band-red .action-band-head{ background:#dc2626; color:#fff; }
    .band-red .action-item{ background:#fef2f2; border-color:#fecaca; color:#991b1b; }
    .band-red .ai-count{ color:#dc2626; }
    /* Turuncu band */
    .band-orange .action-band-head{ background:#d97706; color:#fff; }
    .band-orange .action-item{ background:#fffbeb; border-color:#fde68a; color:#78350f; }
    .band-orange .ai-count{ color:#d97706; }
    /* Mavi band */
    .band-blue .action-band-head{ background:#1d4ed8; color:#fff; }
    .band-blue .action-item{ background:#eff6ff; border-color:#bfdbfe; color:#1e3a8a; }
    .band-blue .ai-count{ color:#1d4ed8; }

    /* ── KPI kartlar ── */
    .kpi-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }
    .kpi{
      background:var(--s);
      border:1px solid var(--bd);
      border-radius:var(--R);
      padding:14px 16px;
      box-shadow:var(--sh);
      position:relative;
      overflow:hidden;
      cursor:pointer;
      transition:box-shadow .15s, transform .1s;
    }
    .kpi:hover{ box-shadow:var(--sh2); transform:translateY(-1px); }
    .kpi-accent{
      position:absolute; top:0; left:0;
      width:3px; height:100%;
      border-radius:99px 0 0 99px;
    }
    .kpi-label{ font-size:10px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
    .kpi-val{ font-family:var(--mn); font-size:21px; font-weight:700; line-height:1.1; }
    .kpi-sub{ font-size:11px; color:var(--t3); margin-top:4px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
    .kpi-badge{ font-size:10px; font-weight:700; padding:1px 6px; border-radius:99px; }
    .kpi-icon{
      position:absolute; right:12px; top:14px;
      width:34px; height:34px; border-radius:9px;
      display:flex; align-items:center; justify-content:center;
      opacity:.12;
    }
    .kpi-icon svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; }
    .kpi-delta{
      position:absolute; right:14px; bottom:12px;
      font-size:11px; font-weight:700;
      display:flex; align-items:center; gap:2px;
      padding:2px 7px; border-radius:99px;
    }
    .delta-up{ background:#dcfce7; color:#15803d; }
    .delta-dn{ background:#fee2e2; color:#b91c1c; }
    .delta-eq{ background:var(--bd); color:var(--t3); }

    /* Sparkline mini */
    .kpi-spark{ margin-top:6px; }

    /* İkili/üçlü satır */
    .dash-row{ display:grid; gap:12px; }
    .dash-row-2{ grid-template-columns:1fr 1fr; }
    .dash-row-3{ grid-template-columns:2fr 1fr; }
    .dash-row-32{ grid-template-columns:3fr 2fr; }
    .dash-row-33{ grid-template-columns:1fr 1fr 1fr; }
    .dash-row-333{ grid-template-columns:1fr 1fr 1fr; }

    /* Panel */
    .dp{ background:var(--s); border:1px solid var(--bd); border-radius:var(--R); box-shadow:var(--sh); overflow:hidden; }
    .dp-head{
      padding:10px 16px; border-bottom:1px solid var(--bd);
      display:flex; align-items:center; justify-content:space-between;
      background:var(--s2);
    }
    .dp-title{ font-size:12px; font-weight:700; display:flex; align-items:center; gap:7px; }
    .dp-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .dp-body{ padding:0; }
    .dp-link{ font-size:11px; color:var(--bl); font-weight:500; text-decoration:none; padding:2px 6px; border-radius:4px; }
    .dp-link:hover{ background:var(--bld); }

    /* Nabız (pulse) kartı — operations status */
    .pulse-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:1px; background:var(--bd); }
    .pulse-cell{
      background:var(--s); padding:14px 12px; text-align:center;
      transition:background .12s; cursor:pointer;
    }
    .pulse-cell:hover{ background:var(--s2); }
    .pulse-val{ font-family:var(--mn); font-size:26px; font-weight:800; line-height:1; margin-bottom:4px; }
    .pulse-lbl{ font-size:10px; color:var(--t3); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
    .pulse-sub{ font-size:10px; color:var(--t3); margin-top:2px; }

    /* Nakit tahmini */
    .cash-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 16px; border-bottom:1px solid var(--bd); font-size:12px; }
    .cash-row:last-child{ border-bottom:none; }
    .cash-row-lbl{ font-weight:500; display:flex; align-items:center; gap:6px; }
    .cash-row-val{ font-family:var(--mn); font-weight:700; }
    .cash-sep{ padding:5px 16px; background:var(--s2); font-size:10px; font-weight:700; color:var(--t3); text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--bd); }

    /* Özet liste satırı */
    .sum-li{
      display:flex; align-items:center; justify-content:space-between;
      padding:9px 16px; border-bottom:1px solid var(--bd); font-size:12px;
      transition:background .1s;
    }
    .sum-li:last-child{ border-bottom:none; }
    .sum-li:hover{ background:var(--s2); }
    .sum-li-nm{ font-weight:500; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sum-li-meta{ color:var(--t3); font-size:11px; margin:0 10px; flex-shrink:0; }
    .sum-li-val{ font-family:var(--mn); font-weight:700; flex-shrink:0; }

    /* Grafik bar */
    .bar-row{ padding:8px 16px; }
    .bar-label{ display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px; }
    .bar-track{ height:6px; background:var(--bd); border-radius:99px; overflow:hidden; }
    .bar-fill{ height:100%; border-radius:99px; transition:width .4s ease; }

    /* Karar kutusu */
    .decision-item{
      display:flex; align-items:center; gap:12px;
      padding:10px 16px; border-bottom:1px solid var(--bd);
      cursor:pointer; transition:background .1s;
    }
    .decision-item:last-child{ border-bottom:none; }
    .decision-item:hover{ background:var(--s2); }
    .di-badge{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .di-body{ flex:1; min-width:0; }
    .di-title{ font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .di-sub{ font-size:11px; color:var(--t3); margin-top:1px; }
    .di-arrow{ color:var(--t3); font-size:14px; flex-shrink:0; }

    /* Dönem seçici */
    .donem-tabs{ display:flex; gap:4px; }
    .donem-tab{
      background:none; border:1px solid var(--bd); border-radius:var(--Rs);
      font-family:var(--fn); font-size:11px; font-weight:500; color:var(--t3);
      padding:3px 10px; cursor:pointer; transition:all .1s;
    }
    .donem-tab.on{ background:var(--bl); color:#fff; border-color:var(--bl); }

    /* SVG mini sparkline */
    .mini-chart{ display:block; width:100%; height:44px; }

    /* Aktivite */
    .act-li{ display:flex; align-items:flex-start; gap:10px; padding:9px 16px; border-bottom:1px solid var(--bd); }
    .act-li:last-child{ border-bottom:none; }
    .act-dot{ width:7px; height:7px; border-radius:50%; margin-top:4px; flex-shrink:0; }
    .act-body{ flex:1; min-width:0; }
    .act-text{ font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .act-meta{ font-size:10px; color:var(--t3); margin-top:1px; }

    /* Hızlı erişim */
    .quick-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; padding:10px; }
    .quick-btn{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:4px; padding:10px 6px; border-radius:var(--Rs);
      background:var(--s2); border:1px solid var(--bd);
      text-decoration:none; color:var(--t2); font-size:10px; font-weight:600;
      transition:all .12s; cursor:pointer; text-align:center;
    }
    .quick-btn:hover{ background:var(--bld); border-color:var(--blb); color:var(--bl); }
    .quick-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; }

    /* Trend bar chart */
    .trend-bars{ display:flex; align-items:flex-end; gap:4px; padding:12px 16px 4px; height:80px; }
    .trend-bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .trend-bar{ width:100%; border-radius:3px 3px 0 0; min-height:2px; transition:height .4s ease; }
    .trend-bar-label{ font-size:9px; color:var(--t3); text-align:center; }
    .trend-bar-val{ font-size:9px; font-weight:700; color:var(--t2); font-family:var(--mn); }

    /* ── Responsive ── */
    @media (max-width:1200px){
      .dash-row-333{ grid-template-columns:1fr 1fr; }
    }
    @media (max-width:1024px){
      .kpi-grid{ grid-template-columns:repeat(2,1fr); }
      .dash-row-3, .dash-row-32{ grid-template-columns:1fr; }
      .dash-row-33{ grid-template-columns:1fr 1fr; }
    }
    @media (max-width:640px){
      .dash-wrap{ padding:10px; gap:10px; }
      .kpi-grid{ grid-template-columns:repeat(2,1fr); gap:7px; }
      .kpi{ padding:11px 12px; }
      .kpi-val{ font-size:17px; }
      .kpi-icon{ display:none; }
      .kpi-delta{ display:none; }
      .dash-row-2, .dash-row-3, .dash-row-32, .dash-row-33, .dash-row-333{ grid-template-columns:1fr; }
      .quick-grid{ grid-template-columns:repeat(4,1fr); padding:8px; gap:5px; }
      .action-band-body{ flex-direction:column; }
      .action-item{ min-width:unset; border-right:none!important; }
      .briefing-bar{ flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>

<script>
if(!sessionKontrol()) location.href='index.html';

// ── State ──
var donem = 'bu_ay';

function donemSec(d, btn){
  donem = d;
  document.querySelectorAll('.donem-tab').forEach(function(b){b.classList.remove('on');});
  if(btn) btn.classList.add('on');
  dashRender();
}

// ── Dönem tarih aralığı ──
function donemAralik(d){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  if(d==='bugun') return {bas:today(), bit:today()};
  if(d==='bu_ay') return {bas:y+'-'+String(m+1).padStart(2,'0')+'-01', bit:today()};
  if(d==='gecen_ay'){
    var gm=m===0?12:m, gy=m===0?y-1:y;
    var sg=new Date(gy,gm,0).getDate();
    return {bas:gy+'-'+String(gm).padStart(2,'0')+'-01', bit:gy+'-'+String(gm).padStart(2,'0')+'-'+sg};
  }
  if(d==='bu_yil') return {bas:y+'-01-01', bit:today()};
  return {bas:'2000-01-01', bit:'2099-12-31'};
}

// ── Ana veri hesaplama ──
function hesapla(){
  var ara  = donemAralik(donem);
  var araG = donemAralik('gecen_ay');

  var tumH  = ld('h').filter(function(h){return !h.sil;});
  var kasaH = ld('kh').filter(function(h){return !h.sil;});
  var tumCari = ld('c').filter(function(c){return !c.arsiv;});
  var tumB  = ld('b').filter(function(b){return b.dur==='aktif';});
  var tumU  = ldS('urun').filter(function(u){return u.aktif!==false;});
  var tumSA = ldSA().filter(function(s){return !s.sil;});
  var donemSA  = tumSA.filter(function(s){return s.tar>=ara.bas && s.tar<=ara.bit;});
  var gecenSA  = tumSA.filter(function(s){return s.tar>=araG.bas && s.tar<=araG.bit;});

  // Cari bakiye
  var topBorc=0, topAlacak=0;
  tumH.forEach(function(h){
    var v=h.try_||h.tutar*(h.kur||KUR[h.par]||1);
    if(h.yon==='borc') topBorc+=v; else topAlacak+=v;
  });

  // Kasa + Banka
  var kasaBak = kasaTumBakiye();
  var kasaTRY = (kasaBak.TRY||0)+(kasaBak.USD||0)*(KUR.USD||1)+(kasaBak.EUR||0)*(KUR.EUR||1);
  var bankaToplam = tumB.reduce(function(t,b){return t+bankaTRY(b.id);},0);
  var topNakit = kasaTRY + bankaToplam;

  // Stok değeri
  var stokDeger = tumU.reduce(function(t,u){
    return t+urunStok(u.id)*u.alisFiyat*(KUR[u.par]||1);
  },0);

  // SA dönem tutarları
  function saTutar(list){
    return list.reduce(function(t,s){
      var mal=s.kalemler.reduce(function(tt,k){return tt+k.miktar*k.birimFiyat*(1+(k.kdv||18)/100);},0);
      return t+(mal+(s.navlun||0)+(s.gumruk||0))*(s.kur||1);
    },0);
  }
  var donemSATutar  = saTutar(donemSA);
  var gecenSATutar  = saTutar(gecenSA);
  var saDelta = gecenSATutar>0 ? ((donemSATutar-gecenSATutar)/gecenSATutar*100) : 0;

  // Çek/Senet
  var bekCS = tumH.filter(function(h){return ['cek','senet'].includes(h.tip)&&h.dur==='bekliyor';});
  var gecCS = bekCS.filter(function(h){return h.vade&&h.vade<today();});
  var bugunCS = bekCS.filter(function(h){return h.vade===today();});
  var bekCSTutar = bekCS.reduce(function(t,h){return t+(h.try_||h.tutar*(h.kur||1));},0);
  var gecCSTutar = gecCS.reduce(function(t,h){return t+(h.try_||h.tutar*(h.kur||1));},0);

  // Risk
  var riskAsan = tumCari.filter(function(c){
    if(!c.riskLimiti) return false;
    return Math.abs(cariBakTRY(c.id))>c.riskLimiti;
  });

  // Stok uyarıları
  var minStokAlti = stokUyarilar();

  // SA durumlar
  var bekSA   = tumSA.filter(function(s){return s.durum==='onay_bekliyor';});
  var malBekSA= tumSA.filter(function(s){return s.durum==='onaylandi'||s.durum==='kismi';});

  // Üretim
  var ureObj = (function(){ try{return aiUretimAnaliz();}catch(e){return {bekleyen:[],hazirlaniyor:[],uretimde:[],kalite:[],tamamlanan:[],geciken:[]};} })();
  var mrpE   = (function(){ try{return aiMrpOneri(5);}catch(e){return [];} })();

  // 6 aylık SA trendi
  var trend = [];
  for(var i=5;i>=0;i--){
    var d2=new Date(); d2.setMonth(d2.getMonth()-i);
    var my=d2.getFullYear(), mm=d2.getMonth()+1;
    var prefix=my+'-'+String(mm).padStart(2,'0');
    var ayH=tumSA.filter(function(s){return s.tar.startsWith(prefix);});
    trend.push({
      label:['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][mm-1],
      tutar:saTutar(ayH)
    });
  }

  // Top borçlu cariler
  var topCari = tumCari
    .map(function(c){return {c:c, bk:cariBakTRY(c.id)};})
    .filter(function(x){return x.bk>0;})
    .sort(function(a,b){return b.bk-a.bk;})
    .slice(0,5);

  // Son aktivite
  var loglar=[]; try{loglar=JSON.parse(localStorage.getItem('hm_log'))||[];}catch(e){}

  // Mamul özet
  var mamulUrunler = ldS('urun').filter(function(u){return u.aktif!==false&&u.urunTipi==='mamul';});
  var mamulSatilabilir = mamulUrunler.filter(function(u){return satisDurumu(u.id).kod==='satilabilir';}).length;
  var mamulHazir = mamulUrunler.reduce(function(t,u){return t+hazirStok(u.id);},0);
  var mamulUretilebilir = mamulUrunler.reduce(function(t,u){return t+uretilebilirAdet(u.id);},0);
  var mamulEksik = mamulUrunler.filter(function(u){return satisDurumu(u.id).kod==='eksik_parca';}).length;

  // Bu hafta vadeli CS
  var hafSon = new Date(); hafSon.setDate(hafSon.getDate()+7);
  var hafVadeCS = bekCS.filter(function(h){return h.vade && h.vade<=hafSon.toISOString().slice(0,10) && h.vade>=today();});
  var hafVadeTutar = hafVadeCS.reduce(function(t,h){return t+(h.try_||h.tutar*(h.kur||1));},0);

  // Sağlık skoru
  var skor = 100;
  if(topNakit<0) skor-=20;
  skor -= Math.min(riskAsan.length*8, 24);
  skor -= Math.min(gecCS.length*6, 18);
  skor -= Math.min(minStokAlti.length*3, 12);
  if(bekSA.length>0) skor-=6;
  if(ureObj.geciken.length>0) skor-=Math.min(ureObj.geciken.length*4,12);
  skor = Math.max(0, Math.round(skor));

  return {
    netBakiye:topAlacak-topBorc, topBorc, topAlacak,
    kasaTRY, bankaToplam, topNakit,
    stokDeger,
    donemSATutar, gecenSATutar, saDelta,
    bekCS:bekCS.length, gecCS:gecCS.length, bugunCS:bugunCS.length, bekCSTutar, gecCSTutar,
    hafVadeCS:hafVadeCS.length, hafVadeTutar,
    riskAsan, minStokAlti,
    bekSA:bekSA.length, malBekSA:malBekSA.length,
    ureObj, mrpE,
    trend, topCari,
    loglar:loglar.slice(-8).reverse(),
    cariSayisi:tumCari.length, stokUrun:tumU.length,
    mamulSatilabilir, mamulHazir, mamulUretilebilir, mamulEksik,
    skor
  };
}

// ── Sparkline SVG ──
function sparkline(data, color, h){
  h = h||40;
  if(!data || !data.length) return '';
  var max=Math.max.apply(null,data.concat([1]));
  var w=200;
  var pts=data.map(function(v,i){
    return [(i/(data.length-1||1))*w, h-(v/max)*h*0.82-3].join(',');
  });
  var path='M'+pts.join(' L');
  var area='M'+pts[0]+' L'+pts.join(' L')+' L'+[(data.length-1)/(data.length-1||1)*w,h]+' L0,'+h+' Z';
  return '<svg viewBox="0 0 200 '+h+'" preserveAspectRatio="none" style="width:100%;height:'+h+'px;display:block">'+
    '<defs><linearGradient id="sg_'+color.replace(/[^a-z0-9]/gi,'')+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity=".25"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#sg_'+color.replace(/[^a-z0-9]/gi,'')+')" />'+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>'+
    '</svg>';
}

// ── Delta badge ──
function deltaBadge(pct){
  if(!pct && pct!==0) return '';
  var cls = pct>0?'delta-up':pct<0?'delta-dn':'delta-eq';
  var arrow = pct>0?'↑':pct<0?'↓':'→';
  return '<span class="kpi-delta '+cls+'">'+arrow+' '+Math.abs(pct).toFixed(0)+'%</span>';
}

// ── Üretim Sağlık Rengi ──
function ureRenk(aktif,geciken){
  if(geciken>0) return '#dc2626';
  if(aktif>0) return '#7c3aed';
  return '#6b7280';
}

          '<div style="padding:28px;text-align:center;color:var(--t3);font-size:12px">Borçlu cari yok</div>'
        )+
        '<div class="cash-row" style="background:var(--s2);border-top:1px solid var(--bd)">'+
          '<span class="cash-row-lbl" style="font-size:11px;color:var(--t3)">Toplam alacak</span>'+
          '<span style="font-family:var(--mn);font-weight:700;font-size:12px;color:#b91c1c">'+fmtTRY(v.topBorc)+'</span>'+
        '</div>'+
      '</div>'+
    '</div>'+

  '</div>'+ // dash-row-33

  // ════════════════════════════════════════════
  // 6. KARAR GEREKEN İŞLEMLER + AKTİVİTE + HIZLI ERİŞİM
  // ════════════════════════════════════════════
  '<div class="dash-row dash-row-33">'+

    // Karar gereken
    '<div class="dp">'+
      '<div class="dp-head">'+
        '<div class="dp-title"><div class="dp-dot" style="background:#7c3aed"></div>Karar Bekleyen İşlemler</div>'+
      '</div>'+
      '<div class="dp-body">'+
        (function(){
          var items=[];
          if(v.bekSA>0) items.push({clr:'#d97706',title:v.bekSA+' Satın Alma Onay Bekliyor',sub:'Fiyat/tedarikçi onayı gerekiyor',nav:'satinalma.html'});
          if(v.gecCS>0) items.push({clr:'#dc2626',title:v.gecCS+' Vadesi Geçmiş Çek/Senet',sub:fmtTRY(v.gecCSTutar)+' tahsilat aksiyonu',nav:'ceksenet.html'});
          if(v.riskAsan.length>0) items.push({clr:'#dc2626',title:v.riskAsan.length+' Cari Risk Limiti Aşımı',sub:'Kredi dondurma veya teminat kararı',nav:'cariler.html'});
          if(v.ureObj.geciken.length>0) items.push({clr:'#b91c1c',title:v.ureObj.geciken.length+' Gecikmeli Üretim Emri',sub:'Önceliklendirme veya erteleme kararı',nav:'uretim.html'});
          if(v.mamulEksik>0) items.push({clr:'#7c3aed',title:v.mamulEksik+' Mamul Eksik Parça',sub:'Acil satın alma başlatılmalı',nav:'stok.html'});
          if(v.mrpE.length>0) items.push({clr:'#1d4ed8',title:'MRP: '+v.mrpE.length+' Satın Alma Önerisi',sub:'AI planlama önerileri hazır',nav:'stok.html'});
          if(!items.length) return '<div style="padding:32px;text-align:center"><div style="font-size:28px;margin-bottom:8px">✅</div><div style="font-size:13px;font-weight:600;color:#15803d">Bekleyen karar yok</div><div style="font-size:11px;color:var(--t3);margin-top:4px">Tüm sistemler normal</div></div>';
          return items.map(function(it){
            return '<div class="decision-item" data-nav="'+it.nav+'">'+
              '<div class="di-badge" style="background:'+it.clr+'"></div>'+
              '<div class="di-body"><div class="di-title" style="color:'+it.clr+'">'+it.title+'</div><div class="di-sub">'+it.sub+'</div></div>'+
              '<div class="di-arrow">›</div>'+
            '</div>';
          }).join('');
        })()+
      '</div>'+
    '</div>'+

    // Son İşlemler
    '<div class="dp">'+
      '<div class="dp-head">'+
        '<div class="dp-title"><div class="dp-dot" style="background:#1d4ed8"></div>Son İşlemler</div>'+
      '</div>'+
      '<div class="dp-body">'+
        (v.loglar.length ?
          v.loglar.slice(0,6).map(function(l){
            var modul=l.modul||l.tip||'';
            var renk=LOG_CLR[modul]||'#6b7280';
            var etk=LOG_ETK[modul]||modul;
            var detay=l.detay||l.data||{};
            var tarih=l.ts?new Date(l.ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
            return '<div class="act-li">'+
              '<div class="act-dot" style="background:'+renk+'"></div>'+
              '<div class="act-body">'+
                '<div class="act-text">'+etk+(detay.no?' — '+detay.no:detay.acik?' — '+detay.acik.substring(0,28):'')+'</div>'+
                '<div class="act-meta">'+tarih+'</div>'+
              '</div>'+
            '</div>';
          }).join('') :
          '<div style="padding:28px;text-align:center;color:var(--t3);font-size:12px">Henüz işlem yok</div>'
        )+
      '</div>'+
    '</div>'+

    // Hızlı Erişim
    '<div class="dp">'+
      '<div class="dp-head">'+
        '<div class="dp-title"><div class="dp-dot" style="background:#059669"></div>Hızlı Erişim</div>'+
      '</div>'+
      '<div class="dp-body">'+
        '<div class="quick-grid">'+
          [
            {href:'cariler.html',     label:'Cari',       icon:'<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>'},
            {href:'satinalma.html',   label:'Satın Alma', icon:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>'},
            {href:'stok.html',        label:'Stok',       icon:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>'},
            {href:'kasa.html',        label:'Kasa',       icon:'<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>'},
            {href:'ceksenet.html',    label:'Çek/Senet',  icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>'},
            {href:'uretim.html',      label:'Üretim',     icon:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>'},
            {href:'banka.html',       label:'Banka',      icon:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'},
            {href:'kredi.html',       label:'Kredi',      icon:'<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>'},
            {href:'ithalat.html',     label:'İthalat',    icon:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'},
            {href:'nakit.html',       label:'Nakit Akış', icon:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>'},
            {href:'ai-asistan.html',  label:'AI Asistan', icon:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>'},
            {href:'ayarlar.html',     label:'Ayarlar',    icon:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'},
          ].map(function(q){
            return '<a href="'+q.href+'" class="quick-btn">'+
              '<svg viewBox="0 0 24 24">'+q.icon+'</svg>'+
              '<span>'+q.label+'</span>'+
            '</a>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</div>'+

  '</div>'; // dash-row-33

}

window.addEventListener('DOMContentLoaded', function(){
  if(!IZIN.guard('dashboard')) return;
  IZIN.navFiltrele();
  document.addEventListener('click', function(e){
    var el=e.target.closest('[data-nav]');
    if(el) location.href=el.getAttribute('data-nav');
  });
  headerRender('dashboard');
  veriYukle();
  stokVeriYukle();
  saVeriYukle();
  dashRender();
  setInterval(dashRender, 5*60*1000);
});
</script>
</body>
</html>
