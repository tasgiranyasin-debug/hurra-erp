<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Hurra Motor ERP — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Dashboard özel stiller ── */
    .dash-wrap{ flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:16px; }
    .dash-wrap::-webkit-scrollbar{ width:4px; }
    .dash-wrap::-webkit-scrollbar-thumb{ background:var(--bd2); border-radius:2px; }

    /* KPI kartlar */
    .kpi-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }
    .kpi{
      background:var(--s);
      border:1px solid var(--bd);
      border-radius:var(--R);
      padding:14px 16px;
      box-shadow:var(--sh);
      position:relative;
      overflow:hidden;
      cursor:pointer;
      transition:box-shadow .15s, transform .1s;
    }
    .kpi:hover{ box-shadow:var(--sh2); transform:translateY(-1px); }
    .kpi-accent{
      position:absolute;
      top:0; left:0;
      width:3px; height:100%;
      border-radius:99px 0 0 99px;
    }
    .kpi-label{ font-size:10px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
    .kpi-val{ font-family:var(--mn); font-size:22px; font-weight:700; line-height:1.1; }
    .kpi-sub{ font-size:11px; color:var(--t3); margin-top:4px; display:flex; align-items:center; gap:4px; }
    .kpi-badge{ font-size:10px; font-weight:700; padding:1px 6px; border-radius:99px; }
    .kpi-up{ background:#dcfce7; color:#166534; }
    .kpi-dn{ background:#fee2e2; color:#991b1b; }
    .kpi-icon{
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      width:36px; height:36px; border-radius:9px;
      display:flex; align-items:center; justify-content:center;
      opacity:.15;
    }
    .kpi-icon svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; }

    /* İkili/üçlü satır */
    .dash-row{ display:grid; gap:12px; }
    .dash-row-2{ grid-template-columns:1fr 1fr; }
    .dash-row-3{ grid-template-columns:2fr 1fr; }
    .dash-row-33{ grid-template-columns:1fr 1fr 1fr; }

    /* Panel */
    .dp{ background:var(--s); border:1px solid var(--bd); border-radius:var(--R); box-shadow:var(--sh); overflow:hidden; }
    .dp-head{
      padding:11px 16px; border-bottom:1px solid var(--bd);
      display:flex; align-items:center; justify-content:space-between;
      background:var(--s2);
    }
    .dp-title{ font-size:12px; font-weight:700; display:flex; align-items:center; gap:7px; }
    .dp-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .dp-body{ padding:0; }
    .dp-link{ font-size:11px; color:var(--bl); font-weight:500; text-decoration:none; padding:2px 6px; border-radius:4px; }
    .dp-link:hover{ background:var(--bld); }

    /* Özet liste satırı */
    .sum-li{
      display:flex; align-items:center; justify-content:space-between;
      padding:9px 16px; border-bottom:1px solid var(--bd); font-size:12px;
      transition:background .1s;
    }
    .sum-li:last-child{ border-bottom:none; }
    .sum-li:hover{ background:var(--s2); }
    .sum-li-nm{ font-weight:500; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sum-li-meta{ color:var(--t3); font-size:11px; margin:0 10px; flex-shrink:0; }
    .sum-li-val{ font-family:var(--mn); font-weight:700; flex-shrink:0; }

    /* Grafik bar */
    .bar-row{ padding:8px 16px; }
    .bar-label{ display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px; }
    .bar-track{ height:6px; background:var(--bd); border-radius:99px; overflow:hidden; }
    .bar-fill{ height:100%; border-radius:99px; transition:width .4s ease; }

    /* Aktivite */
    .act-li{ display:flex; align-items:flex-start; gap:10px; padding:9px 16px; border-bottom:1px solid var(--bd); }
    .act-li:last-child{ border-bottom:none; }
    .act-dot{ width:7px; height:7px; border-radius:50%; margin-top:4px; flex-shrink:0; }
    .act-body{ flex:1; min-width:0; }
    .act-text{ font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .act-meta{ font-size:10px; color:var(--t3); margin-top:1px; }

    /* Uyarı kartları */
    .warn-card{
      border-left:3px solid;
      padding:9px 14px;
      border-radius:0 var(--Rs) var(--Rs) 0;
      background:var(--s2);
      margin:6px 10px;
      font-size:11px;
      display:flex; align-items:center; gap:10px;
      cursor:pointer;
      transition:background .1s;
    }
    .warn-card:hover{ background:var(--bd); }
    .warn-card-icon{ font-size:16px; flex-shrink:0; }
    .warn-card-body{ flex:1; min-width:0; }
    .warn-card-title{ font-weight:600; margin-bottom:1px; }
    .warn-card-sub{ color:var(--t3); }
    .warn-card-count{
      font-family:var(--mn); font-weight:700; font-size:18px;
      flex-shrink:0; text-align:right;
    }
    .warn-rd{ border-color:#dc2626; }
    .warn-am{ border-color:#d97706; }
    .warn-bl{ border-color:#1d4ed8; }

    /* Hızlı erişim */
    .quick-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px; }
    .quick-btn{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:5px; padding:12px 8px; border-radius:var(--Rs);
      background:var(--s2); border:1px solid var(--bd);
      text-decoration:none; color:var(--t2); font-size:11px; font-weight:500;
      transition:all .12s; cursor:pointer;
    }
    .quick-btn:hover{ background:var(--bld); border-color:var(--blb); color:var(--bl); }
    .quick-btn svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; }

    /* Dönem seçici */
    .donem-tabs{ display:flex; gap:4px; }
    .donem-tab{
      background:none; border:1px solid var(--bd); border-radius:var(--Rs);
      font-family:var(--fn); font-size:11px; font-weight:500; color:var(--t3);
      padding:3px 10px; cursor:pointer; transition:all .1s;
    }
    .donem-tab.on{ background:var(--bl); color:#fff; border-color:var(--bl); }

    /* SVG mini chart */
    .mini-chart{ display:block; width:100%; height:48px; }

    /* ── Responsive ── */
    @media (max-width:1024px){
      .kpi-grid{ grid-template-columns:repeat(2,1fr); }
      .dash-row-3{ grid-template-columns:1fr; }
      .dash-row-33{ grid-template-columns:1fr 1fr; }
    }
    @media (max-width:640px){
      .dash-wrap{ padding:10px; gap:10px; }
      .kpi-grid{ grid-template-columns:repeat(2,1fr); gap:7px; }
      .kpi{ padding:11px 12px; }
      .kpi-val{ font-size:17px; }
      .kpi-icon{ display:none; }
      .dash-row-2, .dash-row-3, .dash-row-33{ grid-template-columns:1fr; }
      .quick-grid{ grid-template-columns:repeat(4,1fr); padding:8px; gap:6px; }
    }
    @media (max-width:380px){
      .kpi-grid{ grid-template-columns:1fr 1fr; }
      .quick-grid{ grid-template-columns:repeat(4,1fr); }
    }
  </style>
</head>
<body>
<header class="hdr">
  <a href="dashboard.html" class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    <span class="brand-nm" id="brand-nm">Hurra Motor</span>

  <div class="vsep"></div>

      <div class="ki"><span class="kl">EUR</span><span class="kd" id="kd-eur"></span><span class="kv" id="kv-eur">—</span></div>

<div class="dash-wrap" id="dash-wrap">
  <!-- JS ile doldurulacak -->
  <div style="padding:40px;text-align:center;color:var(--t3)">Yükleniyor...</div>
</div>

<script src="core.js?v=42"></script>
<script>
if(!sessionKontrol()) location.href='index.html';

// ── State ──
var donem = 'bu_ay';

// ── Dönem filtresi ──
function donemSecBtn(btn){ donemSec(btn.getAttribute("data-d"), btn); }
function donemSec(d, btn){
  donem = d;
  document.querySelectorAll('.donem-tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  dashRender();
}

// ── Dönem tarih aralığı ──
function donemAralik(d){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  if(d==='bugun'){
    return {bas:today(), bit:today()};
  } else if(d==='bu_ay'){
    return {bas:y+'-'+String(m+1).padStart(2,'0')+'-01', bit:today()};
  } else if(d==='gecen_ay'){
    var gm = m===0?12:m, gy = m===0?y-1:y;
    var sonGun = new Date(gy, gm, 0).getDate();
    return {bas:gy+'-'+String(gm).padStart(2,'0')+'-01', bit:gy+'-'+String(gm).padStart(2,'0')+'-'+sonGun};
  } else if(d==='bu_yil'){
    return {bas:y+'-01-01', bit:today()};
  } else { // tum
    return {bas:'2000-01-01', bit:'2099-12-31'};
  }
}

// ── Hesaplama yardımcıları ──
function hesapla(){
  var ara = donemAralik(donem);
  var tumH = ld('h').filter(function(h){return !h.sil;});
  var donemH = tumH.filter(function(h){return h.tar>=ara.bas && h.tar<=ara.bit;});
  var hrtBH = ld('bh').filter(function(h){return !h.sil;});
  var donemBH = hrtBH.filter(function(h){return h.tar>=ara.bas && h.tar<=ara.bit;});
  var kasaH = ld('kh').filter(function(h){return !h.sil;});
  var tumCari = ld('c').filter(function(c){return !c.arsiv;});
  var tumB = ld('b').filter(function(b){return b.dur==='aktif';});
  var tumU = ldS('urun').filter(function(u){return u.aktif!==false;});
  var tumSH = ldS('sh').filter(function(h){return !h.sil;});
  var tumSA = ldSA().filter(function(s){return !s.sil;});
  var donemSA = tumSA.filter(function(s){return s.tar>=ara.bas && s.tar<=ara.bit;});

  // Cari bakiye
  var topBorc=0, topAlacak=0;
  tumH.forEach(function(h){
    var v = h.try_||h.tutar*(h.kur||KUR[h.par]||1);
    if(h.yon==='borc') topBorc+=v;
    else topAlacak+=v;
  });

  // Kasa bakiyeleri
  var kasaBak = kasaTumBakiye();
  var kasaTRY = (kasaBak.TRY||0) + (kasaBak.USD||0)*(KUR.USD||1) + (kasaBak.EUR||0)*(KUR.EUR||1);

  // Banka toplam TRY
  var bankaToplam = tumB.reduce(function(t,b){return t+bankaTRY(b.id);},0);

  // Stok değeri
  var stokDeger = tumU.reduce(function(t,u){
    return t + urunStok(u.id)*u.alisFiyat*(KUR[u.par]||1);
  },0);

  // Dönemsel satın alma
  var donemSATutarTRY = donemSA.reduce(function(t,s){
    var mal=s.kalemler.reduce(function(tt,k){return tt+k.miktar*k.birimFiyat*(1+(k.kdv||18)/100);},0);
    return t+(mal+(s.navlun||0)+(s.gumruk||0))*(s.kur||1);
  },0);

  // Bekleyen çek/senet
  var bekCS = tumH.filter(function(h){return ['cek','senet'].includes(h.tip)&&h.dur==='bekliyor';});
  var gecCS = bekCS.filter(function(h){return h.vade&&h.vade<today();});
  var bekCSTutar = bekCS.reduce(function(t,h){return t+(h.try_||h.tutar*(h.kur||1));},0);

  // Risk aşımı
  var riskAsan = tumCari.filter(function(c){
    if(!c.riskLimiti) return false;
    var bk = Math.abs(cariBakTRY(c.id));
    return bk > c.riskLimiti;
  });

  // Min stok altı
  var minStokAlti = stokUyarilar();

  // Bekleyen SA
  var bekSA = tumSA.filter(function(s){return s.durum==='onay_bekliyor';});
  var malBekSA = tumSA.filter(function(s){return s.durum==='onaylandi'||s.durum==='kismi';});

  // Aylık satın alma trendi (son 6 ay)
  var trend = [];
  for(var i=5;i>=0;i--){
    var d2 = new Date(); d2.setMonth(d2.getMonth()-i);
    var my = d2.getFullYear(), mm = d2.getMonth()+1;
    var prefix = my+'-'+String(mm).padStart(2,'0');
    var ayH = tumSA.filter(function(s){return s.tar.startsWith(prefix);});
    var ayTutar = ayH.reduce(function(t,s){
      var mal=s.kalemler.reduce(function(tt,k){return tt+k.miktar*k.birimFiyat*(1+(k.kdv||18)/100);},0);
      return t+(mal+(s.navlun||0)+(s.gumruk||0))*(s.kur||1);
    },0);
    trend.push({label:['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][mm-1], tutar:ayTutar});
  }

  // Top 5 cari bakiye (borçlu)
  var topCari = tumCari
    .map(function(c){return {c:c, bk:cariBakTRY(c.id)};})
    .filter(function(x){return x.bk>0;})
    .sort(function(a,b){return b.bk-a.bk;})
    .slice(0,5);

  // Son aktivite (log)
  var loglar = [];
  try{ loglar=JSON.parse(localStorage.getItem('hm_log'))||[]; }catch(e){}
  var sonLog = loglar.slice(-8).reverse();

  return {
    topBorc, topAlacak, netBakiye:topAlacak-topBorc,
    kasaTRY, bankaToplam, stokDeger,
    donemSATutarTRY,
    bekCS:bekCS.length, gecCS:gecCS.length, bekCSTutar,
    riskAsan, minStokAlti,
    bekSA:bekSA.length, malBekSA:malBekSA.length,
    trend, topCari, sonLog,
    cariSayisi:tumCari.length, stokUrun:tumU.length
  };
}

// ── SVG mini sparkline ──
function sparkline(data, color){
  if(!data.length) return '';
  var max = Math.max(...data, 1);
  var w=200, h=40;
  var pts = data.map(function(v,i){
    return [(i/(data.length-1||1))*w, h - (v/max)*h*0.85 - 2].join(',');
  });
  var path = 'M'+pts.join(' L');
  var areaPath = 'M'+pts[0]+' L'+pts.join(' L')+' L'+[(data.length-1)/(data.length-1||1)*w, h]+' L0,'+h+' Z';
  return '<svg viewBox="0 0 200 40" preserveAspectRatio="none" style="width:100%;height:40px;display:block">'+
    '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".3"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+areaPath+'" fill="url(#sg)"/>'+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>'+
    '</svg>';
}

// ── Ana render ──
function dashRender(){
  var v = hesapla();
  var el = document.getElementById('dash-wrap');

  // KPI renkleri
  var netCls = v.netBakiye>=0 ? '#1d4ed8' : '#b91c1c';
  var kasaRenk = v.kasaTRY>0?'#059669':'#b91c1c';

  var trendMax = Math.max(...v.trend.map(function(t){return t.tutar;}), 1);

  var LOG_ETK = {
    stok_hrt:'Stok hareketi', mal_kabul:'Mal kabul', sa_yeni:'Satın alma',
    sa_revize:'Revizyon', cari_arsiv:'Cari arşiv', transfer:'Transfer',
    cs_tahsil:'Çek tahsilat', banka_pasif:'Banka pasif',
    uretim_rezerve:'Malzeme rezerve', uretim_rezerve_iptal:'Rezervasyon çözüldü',
    uretim_baslat:'Üretime alındı', uretim_kalite:'Kalite kontrol',
    uretim_tamamlandi:'Üretim tamamlandı'
  };
  var LOG_RENK = {
    stok_hrt:'#1d4ed8', mal_kabul:'#059669', sa_yeni:'#7c3aed',
    sa_revize:'#d97706', cari_arsiv:'#6b7280', transfer:'#0891b2',
    cs_tahsil:'#166534', banka_pasif:'#6b7280',
    uretim_rezerve:'#7c3aed', uretim_rezerve_iptal:'#b45309',
    uretim_baslat:'#059669', uretim_kalite:'#0891b2',
    uretim_tamamlandi:'#15803d'
  };

  el.innerHTML =

  // ── Dönem seçici ──
  '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'+
    '<div>'+
      '<div style="font-size:16px;font-weight:700">Yönetim Paneli</div>'+
      '<div style="font-size:11px;color:var(--t3);margin-top:1px">'+new Date().toLocaleDateString('tr-TR',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'</div>'+
    '</div>'+
    '<div class="donem-tabs">'+
      ['bugun','bu_ay','gecen_ay','bu_yil','tum'].map(function(d,i){
        var lbl=['Bugün','Bu Ay','Geç.Ay','Bu Yıl','Tümü'][i];
        return '<button class="donem-tab'+(donem===d?' on':'')+'" onclick="donemSec(\''+d+'\',this)">'+lbl+'</button>';
      }).join('')+
    '</div>'+
  '</div>'+

  // ── KPI Grid ──
  '<div class="kpi-grid">'+

    // Net Bakiye
    '<div class="kpi" data-nav="cariler.html">'+
      '<div class="kpi-accent" style="background:'+netCls+'"></div>'+
      '<div class="kpi-label">Net Cari Bakiye</div>'+
      '<div class="kpi-val" style="color:'+netCls+'">'+(v.netBakiye>=0?'+ ':' − ')+fmtTRY(Math.abs(v.netBakiye))+'</div>'+
      '<div class="kpi-sub">'+
        '<span class="kpi-badge '+(v.netBakiye>=0?'kpi-up':'kpi-dn')+'">'+(v.netBakiye>=0?'Alacak':'Borç')+'</span>'+
        '<span>'+v.cariSayisi+' aktif cari</span>'+
      '</div>'+
      '<div class="kpi-icon" style="color:'+netCls+'"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>'+
    '</div>'+

    // Nakit + Banka
    '<div class="kpi" data-nav="kasa.html">'+
      '<div class="kpi-accent" style="background:#059669"></div>'+
      '<div class="kpi-label">Toplam Nakit & Banka</div>'+
      '<div class="kpi-val" style="color:#059669">'+(v.kasaTRY+v.bankaToplam>=0?'':'− ')+fmtTRY(Math.abs(v.kasaTRY+v.bankaToplam))+'</div>'+
      '<div class="kpi-sub">'+
        '<span>Kasa: '+fmtTRY(v.kasaTRY)+'</span>'+
        '<span style="color:var(--bd2)">·</span>'+
        '<span>Banka: '+fmtTRY(v.bankaToplam)+'</span>'+
      '</div>'+
      '<div class="kpi-icon" style="color:#059669"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div>'+
    '</div>'+

    // Stok Değeri
    '<div class="kpi" data-nav="stok.html">'+
      '<div class="kpi-accent" style="background:#7c3aed"></div>'+
      '<div class="kpi-label">Stok Değeri</div>'+
      '<div class="kpi-val" style="color:#7c3aed">'+fmtTRY(v.stokDeger)+'</div>'+
      '<div class="kpi-sub">'+
        '<span>'+v.stokUrun+' aktif ürün</span>'+
        (v.minStokAlti.length?'<span class="kpi-badge kpi-dn">'+v.minStokAlti.length+' kritik</span>':'')+
      '</div>'+
      '<div class="kpi-icon" style="color:#7c3aed"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>'+
    '</div>'+

    // Satın Alma
    '<div class="kpi" data-nav="satinalma.html">'+
      '<div class="kpi-accent" style="background:#d97706"></div>'+
      '<div class="kpi-label">Satın Alma (Dönem)</div>'+
      '<div class="kpi-val" style="color:#d97706">'+fmtTRY(v.donemSATutarTRY)+'</div>'+
      '<div class="kpi-sub">'+
        (v.bekSA?'<span class="kpi-badge kpi-dn">'+v.bekSA+' onay bekliyor</span>':'')+
        (v.malBekSA?'<span class="kpi-badge" style="background:#dbeafe;color:#1e40af">'+v.malBekSA+' mal bekliyor</span>':'')+
      '</div>'+
      '<div class="kpi-icon" style="color:#d97706"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div>'+
    '</div>'+

  '</div>'+ // kpi-grid

  // ── Uyarılar satırı ──
  (v.riskAsan.length||v.gecCS.length||v.minStokAlti.length||v.bekSA ? 
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px">'+
    (v.gecCS ? '<div class="warn-card warn-rd" data-nav="ceksenet.html">'+'<div class="warn-card-icon">📄</div><div class="warn-card-body"><div class="warn-card-title" style="color:#991b1b">Vadesi Geçmiş Çek/Senet</div><div class="warn-card-sub">İşlem gerekiyor</div></div><div class="warn-card-count" style="color:#991b1b">'+v.gecCS+'</div></div>' : '')+
    (v.riskAsan.length ? '<div class="warn-card warn-rd" data-nav="cariler.html">'+'<div class="warn-card-icon">⚠</div><div class="warn-card-body"><div class="warn-card-title" style="color:#991b1b">Risk Limiti Aşımı</div><div class="warn-card-sub">'+v.riskAsan.slice(0,2).map(function(x){return x.c.kisa||x.c.ad;}).join(', ')+'</div></div><div class="warn-card-count" style="color:#991b1b">'+v.riskAsan.length+'</div></div>' : '')+
    (v.minStokAlti.length ? '<div class="warn-card warn-am" data-nav="stok.html">'+'<div class="warn-card-icon">📦</div><div class="warn-card-body"><div class="warn-card-title" style="color:#854d0e">Kritik Stok</div><div class="warn-card-sub">'+v.minStokAlti.slice(0,2).map(function(u){return u.ad;}).join(', ')+'</div></div><div class="warn-card-count" style="color:#854d0e">'+v.minStokAlti.length+'</div></div>' : '')+
    (v.bekSA ? '<div class="warn-card warn-bl" data-nav="satinalma.html">'+'<div class="warn-card-icon">🛒</div><div class="warn-card-body"><div class="warn-card-title" style="color:#1e40af">Onay Bekleyen SA</div><div class="warn-card-sub">Satın alma onayı gerekiyor</div></div><div class="warn-card-count" style="color:#1e40af">'+v.bekSA+'</div></div>' : '')+
    (v.bekCS ? '<div class="warn-card warn-bl" data-nav="ceksenet.html">'+'<div class="warn-card-icon">📋</div><div class="warn-card-body"><div class="warn-card-title">Bekleyen Çek/Senet</div><div class="warn-card-sub">'+fmtTRY(v.bekCSTutar)+'</div></div><div class="warn-card-count" style="color:#1e40af">'+v.bekCS+'</div></div>' : '')+
  '</div>' : '')+

  // ── Mamul / Üretim KPI ──
  (function(){
    var mamulUrunler = ldS('urun').filter(function(u){return u.aktif!==false&&u.urunTipi==='mamul';});
    if(!mamulUrunler.length) return '';
    var topHazir   = mamulUrunler.reduce(function(t,u){return t+hazirStok(u.id);},0);
    var topUretileb= mamulUrunler.reduce(function(t,u){return t+uretilebilirAdet(u.id);},0);
    var satilabilir= mamulUrunler.filter(function(u){return satisDurumu(u.id).kod==='satilabilir';}).length;
    var uretileb   = mamulUrunler.filter(function(u){return satisDurumu(u.id).kod==='uretilebilir';}).length;
    var eksikSay   = mamulUrunler.filter(function(u){return satisDurumu(u.id).kod==='eksik_parca';}).length;
    // Top 5 model by hazır + üretilebilir
    var topModeller= mamulUrunler.slice().sort(function(a,b){
      return (hazirStok(b.id)+uretilebilirAdet(b.id))-(hazirStok(a.id)+uretilebilirAdet(a.id));
    }).slice(0,5);
    return '<div class="dp" style="margin-bottom:12px">'+
      '<div class="dp-head">'+
        '<div class="dp-title"><div class="dp-dot" style="background:#7c3aed"></div>Mamul Stok Durumu</div>'+
        '<a href="stok.html" class="dp-link">Tümü →</a>'+
      '</div>'+
      '<div class="dp-body" style="padding:12px 16px">'+
        '<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px">'+
          '<div class="kpi" style="padding:10px 12px" data-nav="stok.html">'+
            '<div class="kpi-accent" style="background:#15803d"></div>'+
            '<div class="kpi-label">Satılabilir</div>'+
            '<div class="kpi-val" style="color:#15803d;font-size:18px">'+satilabilir+'</div>'+
            '<div class="kpi-sub">model hazırda</div>'+
          '</div>'+
          '<div class="kpi" style="padding:10px 12px" data-nav="stok.html">'+
            '<div class="kpi-accent" style="background:#1d4ed8"></div>'+
            '<div class="kpi-label">Toplam Hazır</div>'+
            '<div class="kpi-val" style="color:#1d4ed8;font-size:18px">'+topHazir+'</div>'+
            '<div class="kpi-sub">adet depoda</div>'+
          '</div>'+
          '<div class="kpi" style="padding:10px 12px" data-nav="stok.html">'+
            '<div class="kpi-accent" style="background:#7c3aed"></div>'+
            '<div class="kpi-label">Üretilebilir</div>'+
            '<div class="kpi-val" style="color:#7c3aed;font-size:18px">'+topUretileb+'</div>'+
            '<div class="kpi-sub">adet (parça var)</div>'+
          '</div>'+
          (eksikSay?
            '<div class="kpi" style="padding:10px 12px;border-color:var(--rdb)" data-nav="stok.html">'+
              '<div class="kpi-accent" style="background:#b91c1c"></div>'+
              '<div class="kpi-label" style="color:#b91c1c">Eksik Parça</div>'+
              '<div class="kpi-val" style="color:#b91c1c;font-size:18px">'+eksikSay+'</div>'+
              '<div class="kpi-sub">model üretilemiyor</div>'+
            '</div>'
          :'')+
        '</div>'+
        '<div class="tw"><table class="tbl"><thead><tr>'+
          '<th>Model</th>'+
          '<th class="num">Hazır</th>'+
          '<th class="num">Üretilebilir</th>'+
          '<th>Durum</th>'+
        '</tr></thead><tbody>'+
        topModeller.map(function(u){
          var h=hazirStok(u.id), ure=uretilebilirAdet(u.id), dur=satisDurumu(u.id);
          return '<tr>'+
            '<td><div style="font-weight:600;font-size:12px">'+u.ad+'</div>'+
            '<div style="font-size:10px;color:var(--t3);font-family:var(--mn)">'+u.kod+'</div></td>'+
            '<td style="font-family:var(--mn);font-weight:700;text-align:right;color:'+(h>0?'#15803d':'var(--t3)')+'">'+h+'</td>'+
            '<td style="font-family:var(--mn);font-weight:700;text-align:right;color:'+(ure>0?'#7c3aed':'var(--t3)')+'">'+ure+'</td>'+
            '<td><span style="display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;'+dur.css+'">'+dur.etiket+'</span></td>'+
          '</tr>';
        }).join('')+
        '</tbody></table></div>'+
      '</div>'+
    '</div>';
  }())+

  // ── Orta satır: Trend + Borçlu Cariler ──
  '<div class="dash-row dash-row-3">'+

    // Satın Alma Trendi
    '<div class="dp">'+
      '<div class="dp-head">'+
        '<div class="dp-title"><div class="dp-dot" style="background:#d97706"></div>Satın Alma Trendi (6 Ay)</div>'+
        '<a href="satinalma.html" class="dp-link">Tümü →</a>'+
      '</div>'+
      '<div class="dp-body" style="padding:12px 16px 8px">'+
        sparkline(v.trend.map(function(t){return t.tutar;}), '#d97706')+
        '<div style="display:flex;justify-content:space-between;margin-top:6px">'+
          v.trend.map(function(t){
            return '<div style="text-align:center;flex:1">'+
              '<div style="font-size:9px;color:var(--t3)">'+t.label+'</div>'+
              '<div style="font-family:var(--mn);font-size:10px;font-weight:600;color:var(--t2)">'+
                (t.tutar>0?'₺'+Math.round(t.tutar/1000)+'K':'—')+
              '</div>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</div>'+

    // Top Borçlu Cariler
    '<div class="dp">'+
      '<div class="dp-head">'+
        '<div class="dp-title"><div class="dp-dot" style="background:#b91c1c"></div>En Yüksek Borç</div>'+
        '<a href="cariler.html" class="dp-link">Tümü →</a>'+
      '</div>'+
      '<div class="dp-body">'+
        (v.topCari.length ?
          v.topCari.map(function(x){
            var pct = v.topBorc>0 ? (x.bk/v.topBorc*100) : 0;
            return '<div class="bar-row">'+
              '<div class="bar-label">'+
                '<span style="font-weight:500">'+((x.c.kisa||x.c.ad).substring(0,20))+'</span>'+
                '<span style="font-family:var(--mn);font-size:11px;font-weight:700;color:#b91c1c">'+fmtTRY(x.bk)+'</span>'+
              '</div>'+
              '<div class="bar-track">'+
                '<div class="bar-fill" style="width:'+pct.toFixed(1)+'%;background:#b91c1c;opacity:.7"></div>'+
              '</div>'+
            '</div>';
          }).join('') :
          '<div style="padding:24px;text-align:center;color:var(--t3);font-size:12px">Borçlu cari yok</div>')+
      '</div>'+
    '</div>'+

  '</div>'+ // dash-row-3

  // ── Üretim & SA KPI (Faz 5) ──
  (function(){
    var ure = aiUretimAnaliz();
    var saList = ldSA().filter(function(s){return !s.sil;});
    var saBekleyen = saList.filter(function(s){return s.durum==='onay_bekliyor';});
    var saAktif    = saList.filter(function(s){return s.durum==='onaylandi'||s.durum==='kismi';});
    var mrpE = (function(){ try{ return aiMrpOneri(10); }catch(e){ return []; } })();
    var bugun = new Date().toISOString().slice(0,10);
    var geciken = ure.geciken.length;

    return '<div class="dp" style="margin-bottom:12px">'+
      '<div class="dp-head">'+
        '<div class="dp-title"><div class="dp-dot" style="background:#d97706"></div>Üretim & Satın Alma Durumu</div>'+
        '<a href="uretim.html" class="dp-link">Üretim →</a>'+
      '</div>'+
      '<div class="dp-body" style="padding:12px 16px">'+
        '<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:0">'+
          '<div class="kpi" style="padding:10px 12px" data-nav="uretim.html">'+
            '<div class="kpi-accent" style="background:#6b7280"></div>'+
            '<div class="kpi-label">Planlanan</div>'+
            '<div class="kpi-val" style="color:var(--t);font-size:18px">'+ure.bekleyen.length+'</div>'+
            '<div class="kpi-sub">emir</div>'+
          '</div>'+
          '<div class="kpi" style="padding:10px 12px" data-nav="uretim.html">'+
            '<div class="kpi-accent" style="background:#7c3aed"></div>'+
            '<div class="kpi-label">Üretimde</div>'+
            '<div class="kpi-val" style="color:#7c3aed;font-size:18px">'+(ure.hazirlaniyor.length+ure.uretimde.length)+'</div>'+
            '<div class="kpi-sub">aktif emir</div>'+
          '</div>'+
          '<div class="kpi" style="padding:10px 12px" data-nav="uretim.html">'+
            '<div class="kpi-accent" style="background:#0891b2"></div>'+
            '<div class="kpi-label">Kalite Kontrol</div>'+
            '<div class="kpi-val" style="color:#0891b2;font-size:18px">'+ure.kalite.length+'</div>'+
            '<div class="kpi-sub">bekliyor</div>'+
          '</div>'+
          (geciken ?
            '<div class="kpi" style="padding:10px 12px;border-color:var(--rdb)" data-nav="uretim.html">'+
              '<div class="kpi-accent" style="background:#b91c1c"></div>'+
              '<div class="kpi-label" style="color:#b91c1c">Gecikmeli</div>'+
              '<div class="kpi-val" style="color:#b91c1c;font-size:18px">'+geciken+'</div>'+
              '<div class="kpi-sub">emir vade aştı</div>'+
            '</div>' : '')+
          '<div class="kpi" style="padding:10px 12px" data-nav="satinalma.html">'+
            '<div class="kpi-accent" style="background:#d97706"></div>'+
            '<div class="kpi-label">Bekleyen SA</div>'+
            '<div class="kpi-val" style="color:#d97706;font-size:18px">'+(saBekleyen.length+saAktif.length)+'</div>'+
            '<div class="kpi-sub">sipariş</div>'+
          '</div>'+
          (mrpE.length ?
            '<div class="kpi" style="padding:10px 12px;border-color:var(--rdb)" data-nav="stok.html">'+
              '<div class="kpi-accent" style="background:#7c3aed"></div>'+
              '<div class="kpi-label" style="color:#7c3aed">MRP Öneri</div>'+
              '<div class="kpi-val" style="color:#7c3aed;font-size:18px">'+mrpE.length+'</div>'+
              '<div class="kpi-sub">mamul eksik parça</div>'+
            '</div>' : '')+
        '</div>'+
      '</div>'+
    '</div>';
  })()+

  // ── Alt satır: Aktivite + Hızlı Erişim ──
  '<div class="dash-row dash-row-2">'+

    // Son Aktivite
    '<div class="dp">'+
      '<div class="dp-head">'+
        '<div class="dp-title"><div class="dp-dot" style="background:#1d4ed8"></div>Son İşlemler</div>'+
      '</div>'+
      '<div class="dp-body">'+
        (v.sonLog.length ?
          v.sonLog.slice(0,7).map(function(l){
            var renk = LOG_RENK[l.tip]||'#6b7280';
            var etk = LOG_ETK[l.tip]||l.tip;
            var tarih = l.ts ? new Date(l.ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
            return '<div class="act-li">'+
              '<div class="act-dot" style="background:'+renk+'"></div>'+
              '<div class="act-body">'+
                '<div class="act-text">'+etk+(l.data?.no?' — '+l.data.no:l.data?.acik?' — '+l.data.acik.substring(0,30):'')+'</div>'+
                '<div class="act-meta">'+tarih+'</div>'+
              '</div>'+
            '</div>';
          }).join('') :
          '<div style="padding:24px;text-align:center;color:var(--t3);font-size:12px">Henüz işlem yok</div>')+
      '</div>'+
    '</div>'+

    // Hızlı Erişim
    '<div class="dp">'+
      '<div class="dp-head">'+
        '<div class="dp-title"><div class="dp-dot" style="background:#059669"></div>Hızlı Erişim</div>'+
      '</div>'+
      '<div class="dp-body">'+
        '<div class="quick-grid">'+
          [
            {href:'cariler.html',      label:'Yeni Cari',     icon:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>'},
            {href:'satinalma.html',    label:'Satın Alma',    icon:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>'},
            {href:'stok.html',         label:'Stok Giriş',    icon:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'},
            {href:'kasa.html',         label:'Kasa',          icon:'<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>'},
            {href:'ceksenet.html',     label:'Çek/Senet',     icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'},
            {href:'seri.html',         label:'Seri No',       icon:'<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/>'},
            {href:'satinalma.html',    label:'Mal Kabul',     icon:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'},
            {href:'stok.html',         label:'Transfer',      icon:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/>'},
            {href:'evrak.html',        label:'AI Evrak',      icon:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'},
            {href:'ai-asistan.html',   label:'AI Asistan',    icon:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>'},
            {href:'uretim.html',       label:'Üretim',        icon:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>'},
            {href:'ayarlar.html',      label:'Ayarlar',       icon:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9 1.65 1.65 0 0 0 4.27 7.18l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'},
          ].map(function(q){
            return '<a href="'+q.href+'" class="quick-btn">'+
              '<svg viewBox="0 0 24 24">'+q.icon+'</svg>'+
              '<span>'+q.label+'</span>'+
            '</a>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</div>'+

  '</div>'; // dash-row-2

}

window.addEventListener('DOMContentLoaded', function(){
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-nav]');
    if(el) location.href=el.getAttribute('data-nav');
  });
  headerRender('dashboard');
  veriYukle();
  stokVeriYukle();
  saVeriYukle();
  dashRender();
  // Her 5 dakikada otomatik yenile
  setInterval(dashRender, 5*60*1000);
});
</script>
</body>
</html>
