<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurra Motor ERP — Giriş</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bl:#2563eb;--bl2:#1d4ed8;
      --rd:#dc2626;--rdd:#fef2f2;--rdb:#fecaca;
      --fn:'Inter',system-ui,sans-serif;
    }
    body{
      background:linear-gradient(135deg,#0f1117 0%,#1a1d2e 50%,#0f1117 100%);
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--fn);
      padding:16px;
    }

    /* Arka plan deseni */
    body::before{
      content:'';
      position:fixed;inset:0;
      background-image:radial-gradient(circle at 20% 50%, rgba(37,99,235,.08) 0%, transparent 50%),
                       radial-gradient(circle at 80% 20%, rgba(124,58,237,.06) 0%, transparent 50%);
      pointer-events:none;
    }

    .login-wrap{
      width:100%;max-width:420px;
      position:relative;z-index:1;
    }

    /* Kart */
    .login-card{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.1);
      border-radius:18px;
      padding:40px 44px;
      box-shadow:0 24px 64px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);
      backdrop-filter:blur(24px);
    }

    /* Logo */
    .logo{
      display:flex;align-items:center;gap:12px;
      justify-content:center;margin-bottom:32px;
    }
    .logo-mark{
      width:46px;height:46px;
      background:var(--bl);
      border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 8px 24px rgba(37,99,235,.4);
    }
    .logo-mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .logo-text{font-size:22px;font-weight:700;color:#fff;letter-spacing:-.03em}
    .logo-text span{color:#60a5fa}

    /* Başlık */
    .login-title{
      text-align:center;
      font-size:15px;font-weight:600;color:#e8eaf0;
      margin-bottom:5px;
    }
    .login-sub{
      text-align:center;
      font-size:12px;color:#6b7280;
      margin-bottom:28px;
    }

    /* Form */
    .field{margin-bottom:16px}
    .field label{
      display:block;
      font-size:11px;font-weight:600;
      color:#9ca3af;text-transform:uppercase;
      letter-spacing:.06em;margin-bottom:7px;
    }
    .field input{
      width:100%;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.1);
      border-radius:9px;
      color:#e8eaf0;
      font-family:var(--fn);font-size:14px;
      padding:12px 14px;outline:none;
      transition:border-color .15s,background .15s;
    }
    .field input:focus{
      border-color:var(--bl);
      background:rgba(37,99,235,.08);
    }
    .field input::placeholder{color:#4b5563}
    .field input:-webkit-autofill{
      -webkit-box-shadow:0 0 0 30px #1e2230 inset;
      -webkit-text-fill-color:#e8eaf0;
    }

    /* Şifre alanı */
    .pass-wrap{position:relative}
    .pass-wrap input{padding-right:42px}
    .pass-toggle{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;
      color:#6b7280;padding:4px;
      display:flex;align-items:center;
    }
    .pass-toggle:hover{color:#9ca3af}
    .pass-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

    /* Alt satır */
    .login-options{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:20px;
    }
    .remember{
      display:flex;align-items:center;gap:7px;
      cursor:pointer;font-size:12px;color:#9ca3af;
      user-select:none;
    }
    .remember input{
      width:15px;height:15px;
      accent-color:var(--bl);
      cursor:pointer;
    }
    .forgot{
      font-size:12px;color:#60a5fa;
      cursor:pointer;background:none;border:none;
      font-family:var(--fn);
      text-decoration:none;
    }
    .forgot:hover{color:#93c5fd}

    /* Giriş butonu */
    .login-btn{
      width:100%;
      background:var(--bl);color:#fff;
      border:none;border-radius:9px;
      font-family:var(--fn);font-size:14px;font-weight:600;
      padding:13px;cursor:pointer;
      transition:background .15s,transform .1s,box-shadow .15s;
      letter-spacing:.01em;
      box-shadow:0 4px 16px rgba(37,99,235,.35);
    }
    .login-btn:hover{background:var(--bl2);box-shadow:0 6px 20px rgba(37,99,235,.45)}
    .login-btn:active{transform:scale(.98)}
    .login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

    /* Hata */
    .login-err{
      background:rgba(220,38,38,.12);
      border:1px solid rgba(220,38,38,.25);
      border-radius:8px;padding:10px 14px;
      font-size:12px;color:#fca5a5;
      text-align:center;margin-top:14px;
      display:none;
      animation:shake .3s ease;
    }
    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }

    /* Caps Lock */
    .caps-warn{
      background:rgba(217,119,6,.1);
      border:1px solid rgba(217,119,6,.2);
      border-radius:6px;padding:7px 12px;
      font-size:11px;color:#fbbf24;
      text-align:center;margin-top:10px;
      display:none;
    }

    /* Footer */
    .login-footer{
      margin-top:24px;text-align:center;
      font-size:11px;color:#374151;
    }

    /* Başarılı animasyon */
    .login-btn.success{
      background:#166534;
      box-shadow:0 4px 16px rgba(22,101,52,.4);
    }

    /* Şifre unuttum modal */
    .hint-box{
      display:none;
      background:rgba(37,99,235,.08);
      border:1px solid rgba(37,99,235,.2);
      border-radius:8px;padding:12px 14px;
      font-size:12px;color:#93c5fd;
      margin-top:10px;line-height:1.7;
    }
    .hint-box.show{display:block}
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="logo-text">Hurra<span>Motor</span></span>
    </div>

    <div class="login-title">ERP Sistemi</div>
    <div class="login-sub">Devam etmek için giriş yapın</div>

    <!-- Form -->
    <div class="field">
      <label>Kullanıcı Adı</label>
      <input
        type="text"
        id="inp-user"
        placeholder="Kullanıcı adınızı girin"
        autocomplete="username"
        onkeydown="if(event.key==='Enter') document.getElementById('inp-pass').focus()"
      >
    </div>

    <div class="field">
      <label>Şifre</label>
      <div class="pass-wrap">
        <input
          type="password"
          id="inp-pass"
          placeholder="Şifrenizi girin"
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter') girisYap()"
          onkeyup="capsKontrol(event)"
        >
        <button class="pass-toggle" onclick="sifreGoster()" title="Şifreyi göster/gizle" id="pass-eye">
          <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <!-- Seçenekler -->
    <div class="login-options">
      <label class="remember">
        <input type="checkbox" id="inp-remember">
        Beni hatırla
      </label>
      <button class="forgot" onclick="sifreHint()">Şifremi unuttum?</button>
    </div>

    <!-- Giriş Butonu -->
    <button class="login-btn" id="login-btn" onclick="girisYap()">
      Giriş Yap →
    </button>

    <!-- Hata -->
    <div class="login-err" id="login-err">
      ⚠ Kullanıcı adı veya şifre hatalı
    </div>

    <!-- Caps Lock -->
    <div class="caps-warn" id="caps-warn">
      ⚠ CAPS LOCK açık — şifrenizi kontrol edin
    </div>

    <!-- Şifre ipucu -->
    <div class="hint-box" id="hint-box">
      <strong>Kullanıcı adını mı unuttunuz?</strong><br>
      Varsayılan kullanıcı adı: <code style="color:#93c5fd">hurramotor</code><br>
      <span style="font-size:11px;color:#6b7280">Şifreyi değiştirdiyseniz Ayarlar → Güvenlik bölümüne bakın.</span>
    </div>

  </div>

  <div class="login-footer">
    Hurra Motor Yönetim Sistemi &copy; 2026
  </div>
</div>

<script src="core.js?v=41"></script>
<script>
  // Kimlik kontrolü core.js içindeki loginKontrol() ile yapılır (SHA-256)

  // ── Sayfa yüklenince ──
  window.addEventListener('DOMContentLoaded', function(){
    // Zaten giriş yapmışsa dashboard'a gönder
    if(sessionKontrol()){
      window.location.href = 'dashboard.html';
      return;
    }
    // Kayıtlı kullanıcı adı
    const saved = localStorage.getItem('hm_saved_user');
    if(saved){
      document.getElementById('inp-user').value = saved;
      document.getElementById('inp-remember').checked = true;
      document.getElementById('inp-pass').focus();
    } else {
      document.getElementById('inp-user').focus();
    }
  });

  // ── Giriş ──
  async function girisYap(){
    const u = document.getElementById('inp-user').value.trim();
    const p = document.getElementById('inp-pass').value;
    const remember = document.getElementById('inp-remember').checked;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-err');

    if(!u || !p){
      err.textContent = '⚠ Kullanıcı adı ve şifre zorunludur';
      err.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Kontrol ediliyor...';

    const gecerli = await loginKontrolMulti(u, p);

    if(gecerli){
      err.style.display = 'none';
      btn.textContent = '✓ Giriş başarılı...';
      btn.classList.add('success');
      if(typeof setSessionUser === 'function') setSessionUser(u, remember);
      else sessionKur(remember);
      if(remember){ localStorage.setItem('hm_saved_user', u); }
      else { localStorage.removeItem('hm_saved_user'); }
      setTimeout(()=>{ window.location.href = 'dashboard.html'; }, 700);
    } else {
      btn.disabled = false;
      btn.textContent = 'Giriş Yap →';
      btn.classList.remove('success');
      err.textContent = '⚠ Kullanıcı adı veya şifre hatalı';
      err.style.display = 'block';
      err.style.animation = 'none';
      void err.offsetWidth;
      err.style.animation = 'shake .3s ease';
      document.getElementById('inp-pass').value = '';
      document.getElementById('inp-pass').focus();
    }
  }

  // ── Şifre göster/gizle ──
  function sifreGoster(){
    const inp = document.getElementById('inp-pass');
    const icon = document.getElementById('eye-icon');
    if(inp.type === 'password'){
      inp.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      inp.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  // ── Caps Lock kontrolü ──
  function capsKontrol(e){
    const warn = document.getElementById('caps-warn');
    if(e.getModifierState && e.getModifierState('CapsLock')){
      warn.style.display = 'block';
    } else {
      warn.style.display = 'none';
    }
  }

  // ── Şifre ipucu ──
  function sifreHint(){
    const box = document.getElementById('hint-box');
    box.classList.toggle('show');
  }
  // Not: Şifre gösterilmez, sadece kullanıcı adı hatırlatılır
</script>
</body>
</html>
