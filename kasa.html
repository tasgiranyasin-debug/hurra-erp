<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurra Motor ERP — Kasa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Ana sekmeler */
    .main-tabs {
      background:var(--s);
      border-bottom:2px solid var(--bd);
      padding:0 20px;
      display:flex;
      flex-shrink:0;
    }
    .main-tab {
      background:none;border:none;
      border-bottom:3px solid transparent;
      color:var(--t2);
      font-family:var(--fn);font-size:13px;font-weight:500;
      padding:12px 16px;
      cursor:pointer;transition:all .12s;
      margin-bottom:-2px;
    }
    .main-tab:hover{color:var(--t)}
    .main-tab.on{color:var(--bl);border-bottom-color:var(--bl);font-weight:600}

    .main-content {
      flex:1;overflow-y:auto;padding:20px;
    }
    .main-content::-webkit-scrollbar{width:4px}
    .main-content::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

    /* Özet kartlar */
    .ozet-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:10px;
      margin-bottom:20px;
    }
    .ozet-card {
      background:var(--s);
      border:1px solid var(--bd);
      border-radius:var(--R);
      padding:14px;
      box-shadow:var(--sh);
    }
    .ozet-card-lbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
    .ozet-card-val{font-family:var(--mn);font-size:18px;font-weight:700;margin-bottom:2px}
    .ozet-card-sub{font-size:11px;color:var(--t3)}

    /* Kasa para birimi kartları */
    .kasa-par-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-bottom:20px;
    }
    @media(max-width:800px){.kasa-par-grid{grid-template-columns:repeat(2,1fr)}}
    .kasa-par-card {
      background:var(--s);
      border:1px solid var(--bd);
      border-radius:var(--R);
      padding:16px;
      box-shadow:var(--sh);
      cursor:pointer;
      transition:box-shadow .15s,border-color .15s;
    }
    .kasa-par-card:hover{box-shadow:var(--sh2);border-color:var(--bl)}
    .kpc-par{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
    .kpc-val{font-family:var(--mn);font-size:22px;font-weight:700;margin-bottom:4px}
    .kpc-try{font-size:11px;color:var(--t3);font-family:var(--mn)}
    .kpc-btn{margin-top:10px;font-size:11px}

    /* Banka kartları */
    .banka-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
      gap:12px;
      margin-bottom:20px;
    }
    .banka-card {
      background:var(--s);
      border:1px solid var(--bd);
      border-radius:var(--R);
      box-shadow:var(--sh);
      overflow:hidden;
      cursor:pointer;
      transition:box-shadow .15s;
    }
    .banka-card:hover{box-shadow:var(--sh2)}
    .banka-card.on{border-color:var(--bl)}
    .bc-head {
      padding:12px 14px;
      border-bottom:1px solid var(--bd);
      display:flex;align-items:center;justify-content:space-between;
    }
    .bc-av {
      width:32px;height:32px;
      border-radius:8px;
      background:var(--bld);
      display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:700;color:var(--bl);
      flex-shrink:0;
    }
    .bc-nm{font-size:13px;font-weight:600;margin-left:8px}
    .bc-sub{font-size:10px;color:var(--t3)}
    .bc-body{padding:12px 14px}
    .bc-par-row {
      display:flex;justify-content:space-between;
      align-items:center;
      padding:4px 0;
      border-bottom:1px solid var(--bd);
      font-size:12px;
    }
    .bc-par-row:last-child{border-bottom:none}
    .bc-par-lbl{font-size:10px;color:var(--t3);font-family:var(--mn);font-weight:600}
    .bc-par-val{font-family:var(--mn);font-weight:700}
    .bc-foot {
      padding:8px 14px;
      border-top:1px solid var(--bd);
      display:flex;gap:6px;
      background:var(--s2);
    }

    /* Detay panel */
    .detay-panel {
      background:var(--s);
      border:1px solid var(--bd);
      border-radius:var(--R);
      box-shadow:var(--sh);
      overflow:hidden;
    }
    .dp-head {
      padding:12px 16px;
      border-bottom:1px solid var(--bd);
      display:flex;align-items:center;justify-content:space-between;
    }
    .dp-head h3{font-size:13px;font-weight:600}
    .dp-body{padding:14px 16px}

    /* POS tablo */
    .pos-table {
      width:100%;border-collapse:collapse;
    }
    .pos-table th {
      font-size:10px;font-weight:600;color:var(--t3);
      text-transform:uppercase;letter-spacing:.05em;
      padding:6px 10px;background:var(--s2);
      border-bottom:1px solid var(--bd);
      text-align:center;
    }
    .pos-table th:first-child{text-align:left}
    .pos-table td {
      padding:7px 10px;
      border-bottom:1px solid var(--bd);
      font-size:12px;text-align:center;
    }
    .pos-table td:first-child{text-align:left;font-weight:500}
    .pos-table tr:last-child td{border-bottom:none}
    .pos-table tbody tr:hover td{background:var(--s2)}
    .pos-oran {
      font-family:var(--mn);font-size:11px;
    }
    .pos-oran.sifir{color:var(--t3)}
    .pos-oran.dusuk{color:var(--gn)}
    .pos-oran.orta{color:var(--am)}
    .pos-oran.yuksek{color:var(--rd)}

    /* Hesap kartları */
    .hesap-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:8px;
      margin-bottom:14px;
    }
    .hesap-card {
      background:var(--s2);
      border:1px solid var(--bd);
      border-radius:var(--R);
      padding:12px;
      cursor:pointer;
      transition:all .12s;
    }
    .hesap-card:hover{border-color:var(--bl);box-shadow:var(--sh)}
    .hc-nm{font-size:12px;font-weight:600;margin-bottom:3px}
    .hc-sub{font-size:10px;color:var(--t3);margin-bottom:6px}
    .hc-iban{font-size:10px;color:var(--t3);font-family:var(--mn);margin-bottom:6px}
    .hc-val{font-family:var(--mn);font-size:16px;font-weight:700}
  </style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <a href="dashboard.html" class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <span class="brand-nm" id="brand-nm">Hurra Motor</span>
  </a>
  <div class="vsep"></div>
  <nav id="main-nav" style="display:flex;gap:2px"></nav>
  <div class="hdr-right">
    <div id="live-clock"></div>
    <div class="vsep"></div>
    <div class="kur-strip">
      <div class="ki"><span class="kl">USD</span><span class="kd" id="kd-usd"></span><span class="kv" id="kv-usd">—</span></div>
      <div class="ki"><span class="kl">EUR</span><span class="kd" id="kd-eur"></span><span class="kv" id="kv-eur">—</span></div>
      <div class="ki"><span class="kl">CNY</span><span class="kd" id="kd-cny"></span><span class="kv" id="kv-cny">—</span></div>
    </div>
    <div class="vsep"></div>
    <button id="dark-toggle" onclick="toggleDark()">🌙</button>
    <button class="btn-logout" onclick="cikisYap()">Çıkış</button>
  </div>
</header>

<!-- ANA SEKMELER -->
<div class="main-tabs">
  <button class="main-tab on" onclick="sekmeAc('ozet',this)">📊 Genel Bakış</button>
  <button class="main-tab" onclick="sekmeAc('nakit',this)">💵 Nakit Kasa</button>
  <button class="main-tab" onclick="sekmeAc('bankalar',this)">🏦 Bankalar</button>
  <button class="main-tab" onclick="sekmeAc('pos',this)">💳 POS Oranları</button>
</div>

<!-- İÇERİKLER -->
<div style="flex:1;overflow:hidden;display:flex;flex-direction:column">

  <!-- GENEL BAKIŞ -->
  <div id="sekme-ozet" class="main-content"></div>

  <!-- NAKİT KASA -->
  <div id="sekme-nakit" class="main-content" style="display:none"></div>

  <!-- BANKALAR -->
  <div id="sekme-bankalar" class="main-content" style="display:none"></div>

  <!-- POS ORANLARI -->
  <div id="sekme-pos" class="main-content" style="display:none"></div>

</div>

<!-- ═══ MODALler ═══ -->

<!-- NAKİT KASA HAREKETİ -->
<div class="overlay hidden" id="m-kasa-hrt">
  <div class="modal modal-sm">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-icon" style="background:var(--amd)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--am)" stroke-width="2">
            <rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/>
          </svg>
        </div>
        <div><h3 id="m-kh-title">Kasa Hareketi</h3><p id="m-kh-par" style="font-size:11px;color:var(--t3)"></p></div>
      </div>
      <button class="modal-close" onclick="modalKapat('m-kasa-hrt')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="kh-par">
      <div class="fg fg-1">
        <div class="field">
          <label>İşlem Tipi</label>
          <select id="kh-tip">
            <option value="giris">+ Giriş (Tahsilat / Yatırım)</option>
            <option value="cikis">− Çıkış (Ödeme / Çekim)</option>
          </select>
        </div>
        <div class="field">
          <label>Tutar *</label>
          <input type="number" id="kh-tutar" value="0" step="0.01" min="0">
        </div>
        <div class="field">
          <label>Tarih</label>
          <input type="date" id="kh-tarih">
        </div>
        <div class="field">
          <label>Açıklama *</label>
          <input type="text" id="kh-acik" placeholder="Kasa hareketi açıklaması">
        </div>
        <div class="field">
          <label>Belge No</label>
          <input type="text" id="kh-bno" placeholder="MAK-001">
        </div>
      </div>
      <div id="kh-uyari" style="display:none;background:var(--rdd);border:1px solid var(--rdb);border-radius:var(--Rs);padding:8px 12px;font-size:12px;color:var(--rd);margin-top:8px"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-sec" onclick="modalKapat('m-kasa-hrt')">İptal</button>
      <button class="btn btn-pri" onclick="kasaHrtKaydet()">Kaydet</button>
    </div>
  </div>
</div>

<!-- BANKA EKLE/DÜZENLE -->
<div class="overlay hidden" id="m-banka">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-icon" style="background:var(--bld)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--bl)" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
        </div>
        <div><h3 id="m-banka-title">Yeni Banka</h3></div>
      </div>
      <button class="modal-close" onclick="modalKapat('m-banka')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="bm-id">
      <div class="fg">
        <div class="field fg-full">
          <label>Banka Adı *</label>
          <input type="text" id="bm-ad" placeholder="Garanti BBVA">
        </div>
        <div class="field">
          <label>Banka Kodu</label>
          <input type="text" id="bm-kod" placeholder="GARAN">
        </div>
        <div class="field">
          <label>Şube</label>
          <input type="text" id="bm-sube" placeholder="Antalya Merkez">
        </div>
        <div class="field">
          <label>Şube Kodu</label>
          <input type="text" id="bm-subk">
        </div>
        <div class="field">
          <label>Ana Para Birimi</label>
          <select id="bm-par">

        </div>
        <div class="field">
          <label>Tip</label>
          <select id="bm-tip">

            <option value="havale">Havale</option>

          </select>
        </div>
        <div class="field fg-full">

          <label>Notlar</label>

        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-am btn-sm" id="btn-banka-sil" style="display:none;margin-right:auto" onclick="bankaSil()">⏸ Pasife Al</button>
      <button class="btn btn-sec" onclick="modalKapat('m-banka')">İptal</button>
      <button class="btn btn-pri" onclick="bankaKaydet()">Kaydet</button>
    </div>
  </div>
</div>

<!-- BANKA HESABI EKLE/DÜZENLE -->
<div class="overlay hidden" id="m-hesap">
  <div class="modal modal-sm">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-icon" style="background:var(--bld)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--bl)" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
        </div>
        <div><h3 id="m-hesap-title">Hesap Ekle</h3><p id="m-hesap-banka" style="font-size:11px;color:var(--t3)"></p></div>
      </div>
      <button class="modal-close" onclick="modalKapat('m-hesap')">

          <label>Hesap Adı *</label>
          <input type="text" id="hm-ad" placeholder="TRY Vadesiz Mevduat">
        </div>
        <div class="field">
          <label>Hesap Tipi</label>
          <select id="hm-tip">
            <option value="vadesiz">Vadesiz</option>
            <option value="vadeli">Vadeli</option>
            <option value="pos">POS</option>
            <option value="kredi">Kredi</option>
            <option value="doviz">Döviz</option>
          </select>
        </div>
        <div class="field">
          <label>Para Birimi</label>
          <select id="hm-par">
            <option value="TRY">TRY</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="CNY">CNY</option>
          </select>
        </div>
        <div class="field fg-full">
          <label>IBAN</label>
          <input type="text" id="hm-iban" placeholder="TR00 0000 0000 0000 0000 0000 00">
        </div>
        <div class="field">
          <label>Müşteri No</label>
          <input type="text" id="hm-mno">
        </div>
        <div class="field">
          <label>Açılış Tarihi</label>
          <input type="date" id="hm-acilis">
        </div>
        <div class="field">
          <label>Faiz Oranı (%)</label>
          <input type="number" id="hm-faiz" value="0" step="0.01">
        </div>
        <div class="field">
          <label>Durum</label>
          <select id="hm-aktif">
            <option value="true">Aktif</option>
            <option value="false">Pasif</option>
          </select>
        </div>
        <div class="field fg-full">
          <label>Notlar</label>
          <textarea id="hm-not2" rows="2"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-sec" onclick="modalKapat('m-hesap')">İptal</button>
      <button class="btn btn-pri" onclick="hesapKaydet()">Kaydet</button>
    </div>
  </div>
</div>

<!-- BANKA HAREKETİ -->
<div class="overlay hidden" id="m-banka-hrt">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-icon" style="background:var(--gnd)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--gn)" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <div><h3 id="m-bh-title">Banka Hareketi</h3><p id="m-bh-banka" style="font-size:11px;color:var(--t3)"></p></div>
      </div>
      <button class="modal-close" onclick="modalKapat('m-banka-hrt')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="bh-id">
      <input type="hidden" id="bh-bid">
      <div class="yon-grid">
        <button class="yon-btn" id="bh-yon-giris" onclick="bhYonSec('giris')">📥 GİRİŞ — Tahsilat / EFT</button>
        <button class="yon-btn on-borc" id="bh-yon-cikis" onclick="bhYonSec('cikis')">📤 ÇIKIŞ — Ödeme / EFT</button>
      </div>
      <div class="fg">
        <div class="field">
          <label>Tip</label>
          <select id="bh-tip">
            <option value="havale">Havale / EFT</option>
            <option value="pos">POS Tahsilat</option>
            <option value="komisyon">Komisyon</option>
            <option value="nakit">Nakit</option>
            <option value="virman">Virman</option>
            <option value="diger">Diğer</option>
          </select>
        </div>
        <div class="field">
          <label>Para Birimi</label>
          <select id="bh-par">

            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="CNY">CNY</option>
          </select>
        </div>
        <div class="field">
          <label>Tutar *</label>
          <input type="number" id="bh-tutar" value="0" step="0.01" oninput="bhTryHesapla()">
        </div>
        <div class="field">
          <label>Kur (TRY)</label>
          <input type="number" id="bh-kur" value="1" step="0.0001" oninput="bhTryHesapla()">
        </div>
        <div class="field">
          <label>TRY Karşılığı</label>
          <input type="number" id="bh-try" class="f-ro" readonly>
        </div>
        <div class="field">
          <label>Tarih *</label>
          <input type="date" id="bh-tar">
        </div>
        <div class="field">
          <label>Değer Tarihi</label>
          <input type="date" id="bh-dtr">
        </div>
        <div class="field">
          <label>Referans No</label>
          <input type="text" id="bh-ref">
        </div>
        <div class="field fg-full">
          <label>Açıklama *</label>
          <input type="text" id="bh-ack" placeholder="Hareket açıklaması">
        </div>
        <div class="field fg-full">
          <label>Karşı Taraf</label>
          <input type="text" id="bh-kar" placeholder="Firma / kişi adı">
        </div>
        <div class="field fg-full">
          <label>Notlar</label>
          <textarea id="bh-not" rows="2"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-rd btn-sm" id="btn-bh-sil" style="display:none;margin-right:auto" onclick="bhSil()">Sil</button>
      <button class="btn btn-sec" onclick="modalKapat('m-banka-hrt')">İptal</button>
      <button class="btn btn-pri" onclick="bhKaydet()">Kaydet</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="core.js?v=36"></script>
<script>
// ── Auth ──
if(!sessionKontrol()) location.href='index.html';

// ── State ──
let aktifSekme = 'ozet';
let seciliBanka = null;
let bhYon = 'cikis';

// ─────────────────────────────────────────
// ANA SEKME
// ─────────────────────────────────────────
function sekmeAc(id, btn){
  aktifSekme = id;
  document.querySelectorAll('.main-tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  ['ozet','nakit','bankalar','pos'].forEach(s=>{
    document.getElementById('sekme-'+s).style.display = s===id?'block':'none';
  });

}

function kasaHrtAc(par){
  document.getElementById('kh-par').value = par||'TRY';
  document.getElementById('m-kh-par').textContent = (par||'TRY') + ' Kasası';
  document.getElementById('m-kh-title').textContent = 'Kasa Hareketi Ekle';
  document.getElementById('kh-tutar').value = '0';
  document.getElementById('kh-tarih').value = today();
  document.getElementById('kh-acik').value = '';
  document.getElementById('kh-bno').value = '';
  document.getElementById('kh-tip').value = 'giris';
  document.getElementById('kh-uyari').style.display = 'none';
  modalAc('m-kasa-hrt');
}

function kasaHrtKaydet(){
  const par = document.getElementById('kh-par').value||'TRY';
  const tip = document.getElementById('kh-tip').value;
  const tutar = parseFloat(document.getElementById('kh-tutar').value)||0;
  const acik = document.getElementById('kh-acik').value.trim();
  if(tutar<=0){toast('Geçerli tutar girin','err');return;}
  if(!acik){toast('Açıklama zorunludur','err');return;}

  // Çıkışta bakiye kontrolü
  if(tip==='cikis'){
    const bk = kasaBakiye(par);
    if(bk < tutar){
      document.getElementById('kh-uyari').style.display='block';
      document.getElementById('kh-uyari').textContent=`Yetersiz bakiye! ${par} kasa: ${fmt(bk,par)} — Gereken: ${fmt(tutar,par)}`;
      return;
    }
  }

  // Kasayı güncelle
  const kasa = kasaTumBakiye();
  if(!kasa[par]) kasa[par]=0;
  kasa[par] += (tip==='giris'?1:-1)*tutar;
  localStorage.setItem(DB.kasa, JSON.stringify(kasa));

  // Hareket kaydet
  const hrts = ld('kh');
  hrts.push({
    id:nid(hrts), tip, tutar, par,
    tarih: document.getElementById('kh-tarih').value,
    acik,
    bno: document.getElementById('kh-bno').value.trim(),
    auto:false, sil:false, cat:ts()
  });
  sv('kh', hrts);

  modalKapat('m-kasa-hrt');
  toast('Kasa hareketi kaydedildi');
  nakitRender();
  ozetRender();
}

function kasaHrtSil(id){
  const hrts=ld('kh');
  const i=hrts.findIndex(h=>h.id===id);
  if(i<0) return;
  const h=hrts[i];

  // Otomatik hareketi iptal etme
  if(h.auto){
    toast('Otomatik hareketler iptal edilemez — ilgili işlemden düzeltin','err');
    return;
  }

  const kasa=kasaTumBakiye();
  const mevcutBak=kasa[h.par]||0;
  // Giriş iptali kasayı düşürür — negatife gider mi?
  if(h.tip==='giris' && mevcutBak - h.tutar < 0){
    if(!confirm(`Uyarı: Bu hareketi iptal etmek ${h.par} kasasını negatife düşürecek!\nMevcut: ${fmt(mevcutBak,h.par)} → Sonuç: ${fmt(mevcutBak-h.tutar,h.par)}\n\nDevam edilsin mi?`)) return;
  } else {
    if(!confirm(`"${h.acik}" hareketi iptal edilsin mi?\n${h.tip==='giris'?'+ ':' − '}${fmt(h.tutar,h.par||'TRY')}`)) return;
  }

  // Kasayı geri al
  if(!kasa[h.par]) kasa[h.par]=0;
  kasa[h.par] -= (h.tip==='giris'?1:-1)*h.tutar;
  localStorage.setItem(DB.kasa, JSON.stringify(kasa));
  hrts[i].sil=true;
  sv('kh',hrts);
  logEkle('kasa_hrt_iptal',null,{id,acik:h.acik,tutar:h.tutar,par:h.par});
  toast('Kasa hareketi iptal edildi','inf');
  nakitRender();
  ozetRender();
}

}

function bankaKaydet(){
  const id = parseInt(document.getElementById('bm-id').value)||null;
  const ad = document.getElementById('bm-ad').value.trim();
  if(!ad){toast('Banka adı zorunludur','err');return;}
  const obj = {
    ad, kod:document.getElementById('bm-kod').value.trim(),
    sube:document.getElementById('bm-sube').value.trim(),
    subk:document.getElementById('bm-subk').value.trim(),
    par:document.getElementById('bm-par').value,
    tip:document.getElementById('bm-tip').value,
    iban:document.getElementById('bm-iban').value.trim(),
    swft:document.getElementById('bm-swft').value.trim(),
    dur:document.getElementById('bm-dur').value,
    not:document.getElementById('bm-not').value.trim(),
    pos:{1:0,2:1.2,3:1.5,4:1.8,6:2.2,9:2.8,12:3.5}
  };
  const list = ld('b');
  if(id){
    const i=list.findIndex(x=>x.id===id);
    if(i>=0){
      obj.id=id;
      obj.hesaplar=list[i].hesaplar; // hesapları koru
      obj.pos=list[i].pos||obj.pos;  // POS oranlarını koru
      list[i]=obj;
    }
  } else {
    obj.id=nid(list);
    list.push(obj);
  }
  sv('b',list);
  modalKapat('m-banka');
  toast(id?'Banka güncellendi':'Banka eklendi');
  bankalarRender();
  ozetRender();
}


function bankaAktifYap(id){
  const list=ld('b');
  const i=list.findIndex(x=>x.id===id);
  if(i>=0){ list[i].dur='aktif'; delete list[i].pasifTarih; }
  sv('b',list);
  logEkle('banka_aktif',id,{});
  toast('Banka aktife alındı');
  bankalarRender();
  ozetRender();
}

function bankaSil(){
  const id=parseInt(document.getElementById('bm-id').value);
  const b=ld('b').find(x=>x.id===id);
  if(!b) return;

  const bhrtler=ld('bh').filter(h=>h.bid===id&&!h.sil);
  const cariHrtler=ld('h').filter(h=>h.bid===id&&!h.sil);
  const toplam=bhrtler.length+cariHrtler.length;

  let msg=`"${b.ad}" bankasını pasif yapmak istiyor musunuz?\n\nBanka pasife alınır, tüm hareketler ve bakiyeler korunur.`;
  if(toplam>0) msg+=`\n(${toplam} bağlı hareket korunacak)`;

  if(!confirm(msg)) return;

  // Kalıcı silme YOK — sadece pasife al
  const list=ld('b');
  const i=list.findIndex(x=>x.id===id);
  if(i>=0){ list[i].dur='pasif'; list[i].pasifTarih=ts(); }
  sv('b',list);
  logEkle('banka_pasif',id,{ad:b.ad,toplam});
  modalKapat('m-banka');
  toast(`"${b.ad}" pasife alındı`,'inf');
  bankalarRender();
  ozetRender();
}

function hesapKaydet(){
  const bankaId = parseInt(document.getElementById('hm-banka-id').value);
  const idxVal = document.getElementById('hm-hesap-idx').value;
  const ad = document.getElementById('hm-ad').value.trim();
  if(!ad){toast('Hesap adı zorunludur','err');return;}
  const obj = {
    id: Date.now(),
    ad, tip:document.getElementById('hm-tip').value,
    par:document.getElementById('hm-par').value,
    iban:document.getElementById('hm-iban').value.trim(),
    mno:document.getElementById('hm-mno').value.trim(),
    acilis:document.getElementById('hm-acilis').value,
    faiz:parseFloat(document.getElementById('hm-faiz').value)||0,
    aktif:document.getElementById('hm-aktif').value==='true',
    not:document.getElementById('hm-not2').value.trim(),
  };
  const list=ld('b');
  const bi=list.findIndex(x=>x.id===bankaId);
  if(bi<0){toast('Banka bulunamadı','err');return;}
  if(!list[bi].hesaplar) list[bi].hesaplar=[];
  if(idxVal!==''){
    const i=parseInt(idxVal);
    obj.id=list[bi].hesaplar[i]?.id||obj.id;
    list[bi].hesaplar[i]=obj;
    toast('Hesap güncellendi');
  } else {
    list[bi].hesaplar.push(obj);
    toast('Hesap eklendi');
  }
  sv('b',list);
  modalKapat('m-hesap');
  bankalarRender();
}

function bhYonSec(yon){
  bhYon = yon;
  document.getElementById('bh-yon-giris').className='yon-btn'+(yon==='giris'?' on-alacak':'');
  document.getElementById('bh-yon-cikis').className='yon-btn'+(yon==='cikis'?' on-borc':'');
}

function bhTryHesapla(){
  const t=parseFloat(document.getElementById('bh-tutar').value)||0;
  const par=document.getElementById('bh-par').value;
  document.getElementById('bh-kur').value=(KUR[par]||1).toFixed(4);
  const k=parseFloat(document.getElementById('bh-kur').value)||1;
  document.getElementById('bh-try').value=(t*k).toFixed(2);
}

function bhKaydet(){
  const id=parseInt(document.getElementById('bh-id').value)||null;
  const bid=parseInt(document.getElementById('bh-bid').value);
  const tutar=parseFloat(document.getElementById('bh-tutar').value)||0;
  const ack=document.getElementById('bh-ack').value.trim();
  if(tutar<=0){toast('Geçerli tutar girin','err');return;}
  if(!ack){toast('Açıklama zorunludur','err');return;}
  const par=document.getElementById('bh-par').value;
  const kur=parseFloat(document.getElementById('bh-kur').value)||1;
  const obj={
    bid, yon:bhYon, tip:document.getElementById('bh-tip').value,
    tutar, par, kur, try_:tutar*kur,
    tar:document.getElementById('bh-tar').value,
    dtr:document.getElementById('bh-dtr').value,
    ref:document.getElementById('bh-ref').value.trim(),
    ack, kar:document.getElementById('bh-kar').value.trim(),
    not:document.getElementById('bh-not').value.trim(),
    sil:false,
  };
  const list=ld('bh');
  if(id){const i=list.findIndex(x=>x.id===id);if(i>=0){obj.id=id;obj.cat=list[i].cat;list[i]=obj;}}
  else{obj.id=nid(list);obj.cat=ts();list.push(obj);}
  sv('bh',list);
  modalKapat('m-banka-hrt');
  toast(id?'Güncellendi':'Kaydedildi');
  bankalarRender();
  ozetRender();
  if(_bhBid) bankaHrtListesi(_bhBid);
}

function bankaHrtSil(id){
  const h=ld('bh').find(x=>x.id===id);
  if(!h) return;
  if(!confirm(`"${h.ack}" hareketi iptal edilsin mi?\n${h.yon==='giris'?'+ ':' − '}${fmt(h.tutar,h.par)}`)) return;
  const list=ld('bh');const i=list.findIndex(x=>x.id===id);
  if(i>=0) list[i].sil=true;
  sv('bh',list);toast('Geri alındı','inf');
  bankalarRender();ozetRender();
  if(_bhBid) bankaHrtListesi(_bhBid);
}

function bhSil(){
  const id=parseInt(document.getElementById('bh-id').value);
  const h=ld('bh').find(x=>x.id===id);
  if(!h) return;

  const list=ld('bh');const i=list.findIndex(x=>x.id===id);

}

function posRender(){
  const bl = ld('b');
  const taksitler = [1,2,3,4,6,9,12];
  const taksitEtiket = {1:'Peşin',2:'2T',3:'3T',4:'4T',6:'6T',9:'9T',12:'12T'};

  document.getElementById('sekme-pos').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="font-size:15px;font-weight:600">POS Komisyon Oranları</div>
        <div class="text-dim">Banka bazında taksit komisyon oranları (%)</div>
      </div>
    </div>
    <div class="detay-panel">
      <div class="dp-body" style="padding:0;overflow-x:auto">
        <table class="pos-table">
          <thead>
            <tr>
              <th>Banka</th>
              ${taksitler.map(t=>`<th>${taksitEtiket[t]}</th>`).join('')}
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${bl.map(b=>`<tr>
              <td>
                <div style="font-weight:600">${b.ad}</div>
                <div class="text-dim" style="font-size:10px">${b.par} · ${b.dur}</div>
              </td>
              ${taksitler.map(t=>{
                const oran=b.pos?.[t]??0;
                const cls=oran===0?'sifir':oran<=1.5?'dusuk':oran<=2.5?'orta':'yuksek';
                return `<td>
                  <span class="pos-oran ${cls}">${oran===0?'—':oran.toFixed(2)+'%'}</span>
                </td>`;
              }).join('')}
              <td>
                <button class="btn btn-ghost btn-xs" onclick="posOranDuzenle(${b.id})">✏</button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div id="pos-edit-panel"></div>`;
}

function posOranDuzenle(bid){
  const b = ld('b').find(x=>x.id===bid);
  if(!b) return;
  const taksitler = [1,2,3,4,6,9,12];
  const taksitEtiket = {1:'Peşin',2:'2 Taksit',3:'3 Taksit',4:'4 Taksit',6:'6 Taksit',9:'9 Taksit',12:'12 Taksit'};
  const panel = document.getElementById('pos-edit-panel');
  panel.innerHTML = `
    <div class="detay-panel" style="margin-top:16px;max-width:500px">
      <div class="dp-head">
        <h3>${b.ad} — POS Oranları Düzenle</h3>
        <button class="btn btn-ghost btn-xs" onclick="document.getElementById('pos-edit-panel').innerHTML=''">✕</button>
      </div>
      <div class="dp-body">
        <div class="fg">
          ${taksitler.map(t=>`
            <div class="field">
              <label>${taksitEtiket[t]} (%)</label>
              <input type="number" id="pos-${bid}-${t}" value="${(b.pos?.[t]??0).toFixed(2)}" step="0.01" min="0">
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
          <button class="btn btn-sec" onclick="document.getElementById('pos-edit-panel').innerHTML=''">İptal</button>
          <button class="btn btn-pri" onclick="posOranKaydet(${bid})">Kaydet</button>
        </div>
      </div>
    </div>`;
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

function posOranKaydet(bid){
  const taksitler=[1,2,3,4,6,9,12];
  const list=ld('b');
  const i=list.findIndex(x=>x.id===bid);
  if(i<0) return;
  if(!list[i].pos) list[i].pos={};
  taksitler.forEach(t=>{
    list[i].pos[t]=parseFloat(document.getElementById(`pos-${bid}-${t}`).value)||0;
  });
  sv('b',list);
  toast('POS oranları güncellendi');
  document.getElementById('pos-edit-panel').innerHTML='';
  posRender();
}
