<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurra Motor ERP — Stok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    .main-tabs{background:var(--s);border-bottom:2px solid var(--bd);padding:0 20px;display:flex;flex-shrink:0}
    .main-tab{background:none;border:none;border-bottom:3px solid transparent;color:var(--t2);font-family:var(--fn);font-size:13px;font-weight:500;padding:12px 16px;cursor:pointer;transition:all .12s;margin-bottom:-2px}
    .main-tab:hover{color:var(--t)}
    .main-tab.on{color:var(--bl);border-bottom-color:var(--bl);font-weight:600}
    .mc{flex:1;overflow-y:auto;padding:20px}
    .mc::-webkit-scrollbar{width:4px}
    .mc::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px
    .urun-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:16px}
    .urun-card{background:var(--s);border:1px solid var(--bd);border-radius:var(--R);padding:14px;cursor:pointer;transition:all .12s;box-shadow:var(--sh)}
    .urun-card:hover{box-shadow:var(--sh2);border-color:var(--bl)}
    .urun-card.warn{border-color:var(--rdb)}
    .stok-bar{height:4px;background:var(--bd);border-radius:99px;margin-top:6px;overflow:hidden}
    .stok-bar-fill{height:100%;border-radius:99px}
    .depo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
    .depo-card{background:var(--s);border:1px solid var(--bd);border-radius:var(--R);overflow:hidden;box-shadow:var(--sh)}
    .ozet-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
    .oz{background:var(--s);border:1px solid var(--bd);border-radius:var(--R);padding:12px;box-shadow:var(--sh)}
    .oz-lbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
    .oz-val{font-family:var(--mn);font-size:18px;font-weight:700}
    .oz-sub{font-size:11px;color:var(--t3);margin-top:2px}
    .ht-satinalma{background:#dbeafe;color:#1e40af}
    .ht-satis{background:#dcfce7;color:#166534}
    .ht-transfer{background:#f3e8ff;color:#6b21a8}
    .ht-iade{background:#fef9c3;color:#854d0e}
    .ht-fire{background:#fee2e2;color:#991b1b}
    .ht-sayim{background:#f0f9ff;color:#0369a1}
    .onay-bekl{background:var(--amd);color:var(--am);border:1px solid var(--amb);border-radius:99px;font-size:10px;font-weight:600;padding:2px 8px}
    .onay-onay{background:var(--gnd);color:var(--gn);border:1px solid var(--gnb);border-radius:99px;font-size:10px;font-weight:600;padding:2px 8px}
    .onay-red{background:var(--rdd);color:var(--rd);border:1px solid var(--rdb);border-radius:99px;font-size:10px;font-weight:600;padding:2px 8px}
    [data-theme="dark"] .ht-satinalma{background:#1a2a4a;color:#60a5fa}
    [data-theme="dark"] .ht-satis{background:#0d2a1a;color:#4ade80}
    [data-theme="dark"] .ht-transfer{background:#1a1030;color:#a78bfa}
    [data-theme="dark"] .ht-iade{background:#2a1e0d;color:#fbbf24}
    [data-theme="dark"] .ht-fire{background:#2a0d0d;color:#fca5a5}
  </style>
</head>
<body class="has-sidebar">
<header class="hdr">
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menü" aria-expanded="false">&#9776;</button>
  <a href="dashboard.html" class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    <span class="brand-nm" id="brand-nm">Hurra Motor</span>
  </a>
  <div class="vsep"></div>
  <div class="hdr-right">
    <div id="live-clock"></div>

    <div class="kur-strip">
      <div class="ki"><span class="kl">USD</span><span class="kd" id="kd-usd"></span><span class="kv" id="kv-usd">—</span></div>
      <div class="ki"><span class="kl">EUR</span><span class="kd" id="kd-eur"></span><span class="kv" id="kv-eur">—</span></div>
      <div class="ki"><span class="kl">CNY</span><span class="kd" id="kd-cny"></span><span class="kv" id="kv-cny">—</span></div>
    </div>
    <div class="vsep"></div>
    <button id="dark-toggle" onclick="toggleDark()">&#x1F319;</button>
    <button class="btn-logout" onclick="cikisYap()">&#xC7;&#x131;k&#x131;&#x15F;</button>
  </div>
</header>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <nav id="main-nav"></nav>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
  <main class="main-content" id="main-content">


<div class="main-tabs">
  <button class="main-tab on" onclick="sekme('ana',this)">🏭 Ana Ürünler</button>
  <button class="main-tab"   onclick="sekme('parca',this)">🔩 Parçalar</button>
  <button class="main-tab"   onclick="sekme('kritik',this)">⚠️ Kritik Eksikler</button>
  <button class="main-tab"   onclick="sekme('depolar',this)">🏢 Depolar</button>
  <button class="main-tab"   onclick="sekme('hareketler',this)">📋 Hareketler</button>
  <button class="main-tab"   onclick="sekme('transfer',this)">🔄 Transferler</button>
  <button class="main-tab"   onclick="sekme('rapor',this)">📊 Rapor</button>
  <button class="main-tab"   onclick="sekme('mrp',this)">🏗 MRP Planı</button>

</div>

<div id="s-ana" class="mc"></div>
<div id="s-parca" class="mc" style="display:none"></div>
<div id="s-kritik" class="mc" style="display:none"></div>
<div id="s-depolar" class="mc" style="display:none"></div>
<div id="s-hareketler" class="mc" style="display:none"></div>
<div id="s-transfer" class="mc" style="display:none"></div>
<div id="s-rapor" class="mc" style="display:none"></div>
<div id="s-mrp" class="mc" style="display:none"></div>
<div id="s-lot" class="mc" style="display:none"></div>

<!-- URUN MODAL -->
<div class="overlay hidden" id="m-urun">
  <div class="modal modal-lg">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-icon" style="background:var(--bld)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--bl)" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        </div>
        <div><h3 id="m-urun-title">Yeni Ürün</h3></div>
      </div>
      <button class="modal-close" onclick="modalKapat('m-urun')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="um-id">
      <div class="sec-title">Temel Bilgiler</div>
      <div class="fg">
        <div class="field"><label>Ürün Kodu *</label><input type="text" id="um-kod" placeholder="MTR-001"></div>
        <div class="field"><label>Barkod</label><input type="text" id="um-barkod"></div>
        <div class="field"><label>Üretici Kodu <span style="font-size:10px;color:var(--t3)">(Tedarikçi part no)</span></label><input type="text" id="um-uretici-kod" placeholder="GZM-2504-CN"></div>
        <div class="field fg-full"><label>Ürün Adı *</label><input type="text" id="um-ad"></div>
        <div class="field"><label>Marka</label><input type="text" id="um-marka"></div>
        <div class="field"><label>Model</label><input type="text" id="um-model"></div>
        <div class="field"><label>Kategori</label><select id="um-kat"></select></div>
        <div class="field"><label>Tip *</label>
          <select id="um-tip">
            <option value="mamul">Mamul (üretilen ürün)</option>
            <option value="yardimci">Yardımcı / Parça (BOM'da kullanılan)</option>
            <option value="yari_mamul">Yarı Mamul</option>
            <option value="sarf">Sarf Malzeme</option>
            <option value="hammadde">Hammadde</option>
          </select>
        </div>
        <div class="field"><label>Birim</label>
          <select id="um-birim"><option value="adet">Adet</option><option value="takım">Takım</option><option value="set">Set</option><option value="kg">Kg</option><option value="litre">Litre</option><option value="metre">Metre</option></select>
        </div>
      </div>
      <div class="sec-title">Fiyat</div>
      <div class="fg fg-4">
        <div class="field"><label>Alış Fiyatı</label><input type="number" id="um-alis" value="0" step="0.01"></div>
        <div class="field"><label>Satış Fiyatı</label><input type="number" id="um-satis" value="0" step="0.01"></div>
        <div class="field"><label>Para Birimi</label><select id="um-par"><option value="TRY">TRY</option><option value="USD">USD</option><option value="EUR">EUR</option></select></div>
        <div class="field"><label>KDV (%)</label><select id="um-kdv"><option value="0">%0</option><option value="10">%10</option><option value="18" selected>%18</option><option value="20">%20</option></select></div>
      </div>
      <div class="sec-title">Stok Ayarları</div>
      <div class="fg">
        <div class="field"><label>Min Stok (Uyarı)</label><input type="number" id="um-min" value="0" min="0"></div>
        <div class="field"><label>Yaşam Döngüsü Durumu</label>
          <select id="um-yasam">
            <option value="taslak">🌱 Taslak</option>
            <option value="test">🧪 Test</option>
            <option value="pilot">🔬 Pilot</option>
            <option value="aktif" selected>✅ Aktif</option>
            <option value="revizyonda">🔄 Revizyonda</option>
            <option value="pasif">⏸️ Pasif</option>
            <option value="arsiv">📦 Arşiv</option>
          </select>
        </div>
        <div class="field"><label>Durum</label><select id="um-aktif"><option value="true">Aktif</option><option value="false">Pasif</option></select></div>
        <div class="field fg-full">
          <label>Seri Numarası Takibi</label>
          <select id="um-seritakip">
            <option value="false">Yok - toplu stok (vida, conta, sarf...)</option>
            <option value="true">Var - her birim ayrı seri no (motor, şasi, batarya...)</option>
          </select>
        </div>
        <div class="field fg-full"><label>Notlar</label><textarea id="um-not" rows="2"></textarea></div>
      </div>
      <div class="sec-title">Fiziksel Özellikler <small style="font-weight:400;color:var(--t3)">(Desi ve m³ otomatik hesaplanır)</small></div>
      <div class="fg fg-4">
        <div class="field"><label>Uzunluk (cm)</label><input type="number" id="um-uzunluk" value="0" min="0" step="0.1" oninput="fizikHesapla()"></div>
        <div class="field"><label>Genişlik (cm)</label><input type="number" id="um-genislik" value="0" min="0" step="0.1" oninput="fizikHesapla()"></div>
        <div class="field"><label>Yükseklik (cm)</label><input type="number" id="um-yukseklik" value="0" min="0" step="0.1" oninput="fizikHesapla()"></div>
        <div class="field"><label>Ağırlık (kg)</label><input type="number" id="um-agirlik" value="0" min="0" step="0.001" oninput="fizikHesapla()"></div>
      </div>
      <div class="fg fg-4">
        <div class="field"><label>Desi <small style="color:var(--t3)">(otomatik)</small></label><input type="number" id="um-desi" readonly style="background:var(--s2);color:var(--t2)"></div>
        <div class="field"><label>Hacim m³ <small style="color:var(--t3)">(otomatik)</small></label><input type="number" id="um-hacim" readonly style="background:var(--s2);color:var(--t2)"></div>
        <div class="field"><label>Maliyet Yöntemi</label>
          <select id="um-maliyet-yontemi">
            <option value="fifo">FIFO (Varsayılan)</option>
            <option value="agirlikli_ortalama">Ağırlıklı Ortalama</option>
          </select>
        </div>
        <div class="field"><label>Temin Süresi (gün)</label><input type="number" id="um-temin-sure" value="0" min="0"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-am btn-sm" id="btn-urun-pasif" style="display:none;margin-right:auto" onclick="urunPasifYap()">Pasife Al</button>
      <button class="btn btn-sec" onclick="modalKapat('m-urun')">İptal</button>
      <button class="btn btn-pri" onclick="urunKaydet()">Kaydet</button>
    </div>
  </div>
</div>

<!-- STOK HAREKETI MODAL -->
<div class="overlay hidden" id="m-sh">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-icon" style="background:var(--gnd)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--gn)" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        <div><h3 id="m-sh-title">Stok Hareketi</h3><p id="m-sh-urun" style="font-size:11px;color:var(--t3)"></p></div>
      </div>
      <button class="modal-close" onclick="modalKapat('m-sh')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="sh-id">
      <div id="sh-neg-uyari" style="display:none;background:var(--rdd);border:1px solid var(--rdb);border-radius:var(--Rs);padding:8px 12px;font-size:12px;color:var(--rd);font-weight:600;margin-bottom:10px">Stok negatife duşemez!</div>
      <div class="fg">
        <div class="field"><label>Ürün *</label><select id="sh-urun" onchange="shUrunDegis()"></select></div>
        <div class="field"><label>Depo *</label><select id="sh-depo" onchange="shStokBilgi()"></select></div>
        <div class="field"><label>Tip *</label>
          <select id="sh-tip" onchange="shTipDegis()">
            <option value="satin_alma">Satin Alma</option>
            <option value="satis">Satis</option>
            <option value="iade">Iade</option>
            <option value="fire">Fire</option>
            <option value="sayim">Sayim Farki</option>
          </select>
        </div>
        <div class="field"><label>Yön</label><select id="sh-yon"><option value="giris">+ Giris</option><option value="cikis">- Cikis</option></select></div>
        <div class="field"><label>Miktar *</label><input type="number" id="sh-miktar" value="1" min="0.01" step="0.01" oninput="shStokBilgi()"></div>
        <div class="field"><label>Birim Fiyat</label><input type="number" id="sh-fiyat" value="0" step="0.01"></div>
        <div class="field"><label>Para Birimi</label><select id="sh-par"><option value="TRY">TRY</option><option value="USD">USD</option><option value="EUR">EUR</option></select></div>
        <div class="field"><label>Tarih *</label><input type="date" id="sh-tar"></div>
        <div class="field"><label>Ref No</label><input type="text" id="sh-ref"></div>
        <div class="field"><label>Cari</label><select id="sh-cari"></select></div>
        <div class="field fg-full"><label>Açıklama *</label><input type="text" id="sh-ack"></div>
        <div class="field fg-full"><label>Notlar</label><textarea id="sh-not" rows="2"></textarea></div>
      </div>
      <div id="sh-stok-bilgi" style="display:none;background:var(--s2);border:1px solid var(--bd);border-radius:var(--Rs);padding:7px 11px;font-size:12px;margin-top:4px"></div>
      <div style="margin-top:10px;background:var(--bld);border:1px solid var(--blb);border-radius:var(--Rs);padding:8px 12px">
        <div style="font-size:11px;font-weight:600;color:var(--bl);margin-bottom:5px">Toplu CSV Yükleme</div>
        <div style="font-size:11px;color:var(--t2);margin-bottom:6px">Format: <code style="font-family:var(--mn)">urunKod,depoKod,miktar,fiyat,refNo,acik</code></div>
        <button class="btn btn-sec btn-xs" onclick="document.getElementById('sh-csv').click()">CSV Yukle</button>
        <input type="file" id="sh-csv" accept=".csv,.txt" style="display:none" onchange="shCSVYukle(this)">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-sec" onclick="modalKapat('m-sh')">İptal</button>
      <button class="btn btn-pri" onclick="shKaydet()">Kaydet</button>
    </div>
  </div>
</div>

<!-- TRANSFER MODAL -->
<div class="overlay hidden" id="m-transfer">
  <div class="modal modal-lg">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-icon" style="background:var(--pud)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--pu)" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
        <div><h3 id="m-tr-title">Yeni Transfer</h3></div>
      </div>
      <button class="modal-close" onclick="modalKapat('m-transfer')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="tr-id">
      <div class="fg">
        <div class="field"><label>Kaynak Depo *</label><select id="tr-kaynak"></select></div>
        <div class="field"><label>Hedef Depo *</label><select id="tr-hedef"></select></div>
        <div class="field"><label>Tarih *</label><input type="date" id="tr-tar"></div>
        <div class="field"><label>Transfer No</label><input type="text" id="tr-no" class="f-ro" readonly></div>
        <div class="field fg-full"><label>Açıklama</label><input type="text" id="tr-ack"></div>
      </div>
      <div class="sec-title" style="margin-top:12px">Kalemler <button class="btn btn-sec btn-xs" onclick="trKalemEkle()">+ Ekle</button></div>
      <div id="tr-kalemler"></div>
      <div id="tr-uyari" style="display:none;background:var(--rdd);border:1px solid var(--rdb);border-radius:var(--Rs);padding:8px 12px;font-size:12px;color:var(--rd);margin-top:8px"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-sec" onclick="modalKapat('m-transfer')">İptal</button>
      <button class="btn btn-am btn-sm" onclick="trKaydet('bekliyor')">Taslak</button>
      <button class="btn btn-pri" onclick="trKaydet('onaylandi')">Onayla</button>
    </div>
  </div>
</div>

<!-- DEPO MODAL -->
<div class="overlay hidden" id="m-depo">
  <div class="modal modal-sm">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-icon" style="background:var(--gnd)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--gn)" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <div><h3 id="m-depo-title">Yeni Depo</h3></div>
      </div>
      <button class="modal-close" onclick="modalKapat('m-depo')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="dm-id">
      <div class="fg fg-1">
        <div class="field"><label>Depo Adı *</label><input type="text" id="dm-ad"></div>
        <div class="field"><label>Depo Kodu</label><input type="text" id="dm-kod"></div>
        <div class="field"><label>Depo Tipi</label>
          <select id="dm-tip">
            <option value="ana">Ana Depo</option>
            <option value="yedek">Yedek Parça</option>
            <option value="servis">Servis</option>
            <option value="karantina">Karantina - KK bekliyor</option>
            <option value="transit">Transit - yolda / gumrukte</option>
            <option value="uretim">Uretim Hatti</option>
            <option value="diger">Diger</option>
          </select>
        </div>
        <div class="field"><label>Konum</label><input type="text" id="dm-konum"></div>
        <div class="field"><label>Açıklama</label><textarea id="dm-acik" rows="2"></textarea></div>
        <div class="field"><label>Durum</label><select id="dm-aktif"><option value="true">Aktif</option><option value="false">Pasif</option></select></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-sec" onclick="modalKapat('m-depo')">İptal</button>
      <button class="btn btn-pri" onclick="depoKaydet()">Kaydet</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>  </main>
</div>

<script>

function sekme(id,btn){
  document.querySelectorAll('.main-tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  if(id==='lot'){lotRender();}
  ['ana','parca','kritik','depolar','hareketler','transfer','rapor','mrp'].forEach(s=>{document.getElementById('s-'+s).style.display=s===id?'block':'none';});
  if(id==='ana')anaUrunlerRender();
  else if(id==='parca')parcalarRender();
  else if(id==='kritik')kritikEksiklerRender();
  else if(id==='depolar')depolarRender();
  else if(id==='hareketler')hareketlerRender();
  else if(id==='transfer')transferRender();
  else if(id==='mrp')mrpRender();
  else raporRender();
}

// ── BOM üretilebilir hesap (local fallback — core.js'deki kullanılıyor) ──
function uretilebirAdet(mamulId){
  // core.js v3.3'te tanımlı — bu fonksiyon artık ortak kütüphanede
  // Geriye dönük uyumluluk için burada da bırakıyoruz
  if(typeof uretilebilirAdet==='function') return uretilebilirAdet(mamulId);
  var bomlar=ld('bom')||[];
  var bom=bomlar.find(b=>b.mamulUrunId===mamulId&&b.aktif!==false);
  if(!bom||(bom.satirlar||[]).length===0)return 0;
  var urunler=ldS('urun');var min=Infinity;
  bom.satirlar.forEach(function(s){
    var p=urunler.find(function(u){return u.id===s.urunId;});
    var mev=(p?urunStok(p.id):0);
    var etkin=(s.miktar||1)*(1+(s.fireOrani||0));
    var adet=Math.floor(mev/etkin);if(adet<min)min=adet;
  });
  return min===Infinity?0:min;
}

// ── Kritik Eksikler ──
function kritikEksiklerRender(){
  var el=document.getElementById('s-kritik');
  var urunler=ldS('urun').filter(u=>u.aktif!==false);
  var bomlar=ld('bom')||[];
  // 1) Min stok altındakiler
  var minAltı=stokUyarilar();
  // 2) BOM tabanlı eksikler
  var bomEksikler=[];
  bomlar.forEach(function(bom){
    var mamul=urunler.find(u=>u.id===bom.mamulUrunId);
    (bom.satirlar||[]).forEach(function(s){
      var p=urunler.find(u=>u.id===s.urunId);
      if(!p)return;
      var stok=urunStok(p.id);
      if(stok<(s.miktar||1)){
        bomEksikler.push({mamulAd:mamul?mamul.ad:'?',parcaAd:p.ad,parcaKod:p.kod,gerekli:s.miktar||1,mevcut:stok,eksik:(s.miktar||1)-stok});
      }

    '<div class="oz"><div class="oz-lbl" style="color:var(--am)">BOM Eksikleri</div><div class="oz-val" style="color:var(--am)">'+bomEksikler.length+'</div></div>'+

    '<div class="tw" style="margin-bottom:20px"><table class="tbl"><thead><tr><th>Kod</th><th>Ürün</th><th class="num">Mevcut</th><th class="num">Min Stok</th><th class="num">Fark</th><th></th></tr></thead>'+
    '<tbody>'+minAltı.map(u=>'<tr>'+
      '<td style="font-family:var(--mn);font-size:11px">'+u.kod+'</td>'+
      '<td style="font-weight:500">'+u.ad+'</td>'+
      '<td style="font-family:var(--mn);font-weight:700;color:#b91c1c">'+u.toplamStok+'</td>'+
      '<td style="font-family:var(--mn);color:var(--t3)">'+u.minStok+'</td>'+

      '<td><button class="btn btn-sec btn-xs" onclick="shFormAc('+u.id+')">+ Stok Ekle</button></td>'+
    '</tr>').join('')+'</tbody></table></div>':'<div style="padding:16px;text-align:center;color:var(--gn);font-weight:600">✓ Min stok altında ürün yok</div>')+
  (bomEksikler.length?'<div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--am)">⚠ BOM Eksikleri ('+bomEksikler.length+')</div>'+

function urunFormAc(id,tipDefault){
  var u=id?ldS('urun').find(x=>x.id===id):null;
  document.getElementById('m-urun-title').textContent=u?'Urun Duzenle':'Yeni Urun';
  document.getElementById('um-id').value=id||'';
  document.getElementById('btn-urun-pasif').style.display=u?'inline-flex':'none';
  var ks=document.getElementById('um-kat');
  ks.innerHTML=katListesi().map(k=>'<option value="'+k+'">'+k+'</option>').join('')+'<option value="Yeni...">+ Yeni...</option>';
  ['um-kod','um-barkod','um-ad','um-marka','um-model','um-not'].forEach(i=>{document.getElementById(i).value=(u?u[i.replace('um-','')||i]||'':'');});
  document.getElementById('um-kod').value=u?.kod||'';document.getElementById('um-barkod').value=u?.barkod||'';
  document.getElementById('um-ad').value=u?.ad||'';document.getElementById('um-marka').value=u?.marka||'';
  document.getElementById('um-model').value=u?.model||'';document.getElementById('um-not').value=u?.not||'';
  document.getElementById('um-kat').value=u?.kategori||katListesi()[0];
  document.getElementById('um-tip').value=u?.urunTipi||(tipDefault||'mamul');
  document.getElementById('um-birim').value=u?.birim||'adet';
  document.getElementById('um-alis').value=u?.alisFiyat||0;document.getElementById('um-satis').value=u?.satisFiyat||0;
  document.getElementById('um-par').value=u?.par||'USD';document.getElementById('um-kdv').value=u?.kdv||18;
  document.getElementById('um-min').value=u?.minStok||0;
  document.getElementById('um-aktif').value=String(u?.aktif!==false);
  document.getElementById('um-seritakip').value=String(u?.seriTakip===true);
  // v4.0 — Yaşam döngüsü
  var yasamEl=document.getElementById('um-yasam');
  if(yasamEl) yasamEl.value=u?.yasamDurumu||'aktif';
  // v4.0 — Fiziksel boyutlar
  var flds={uzunluk:u?.uzunluk||0,genislik:u?.genislik||0,yukseklik:u?.yukseklik||0,agirlik:u?.agirlik||0,desi:u?.desi||0,'hacim_m3':u?.hacim_m3||0,'maliyet-yontemi':u?.maliyetYontemi||'fifo','temin-sure':u?.teminSure||0};
  Object.entries(flds).forEach(([k,v])=>{var el=document.getElementById('um-'+k);if(el)el.value=v;});
  modalAc('m-urun');
}

function fizikHesapla(){
  var u=parseFloat(document.getElementById('um-uzunluk')?.value)||0;
  var g=parseFloat(document.getElementById('um-genislik')?.value)||0;
  var y=parseFloat(document.getElementById('um-yukseklik')?.value)||0;
  var a=parseFloat(document.getElementById('um-agirlik')?.value)||0;
  var desi=u*g*y/3000;
  var hacim=u*g*y/1000000;
  var desiEl=document.getElementById('um-desi'); if(desiEl) desiEl.value=desi.toFixed(4);
  var hacimEl=document.getElementById('um-hacim'); if(hacimEl) hacimEl.value=hacim.toFixed(6);
}

  var ad=document.getElementById('um-ad').value.trim();
  var kod=document.getElementById('um-kod').value.trim();
  if(!ad){toast('Urun adi zorunludur','err');return;}

function shKaydet(){
  var urunId=parseInt(document.getElementById('sh-urun').value);
  var depoId=parseInt(document.getElementById('sh-depo').value);
  var miktar=parseFloat(document.getElementById('sh-miktar').value)||0;

  var tip=document.getElementById('sh-tip').value;
  if(!urunId){toast('Urun secin','err');return;}
  if(!depoId){toast('Depo secin','err');return;}
  if(miktar<=0){toast('Gecerli miktar girin','err');return;}
  if(!ack){toast('Aciklama zorunludur','err');return;}
  // Yetki kontrolü — giriş=stok.ekle, çıkış=stok.duzenle, sayım=stok.sayim
  if(typeof IZIN !== 'undefined'){
    var _izinKey = yon==='giris' ? 'stok.ekle' : (tip==='sayim' ? 'stok.sayim' : 'stok.duzenle');
    if(!IZIN.islem(_izinKey)){ var _k=IZIN.kim(); toast('Yetki yok (rol: '+_k.rol+')','err'); return; }
  }
  // Stok ASLA negatife duşemez — onay seçeneği yok
  if(yon==='cikis'&&tip!=='sayim'){
    var _k=stokNegatifKontrol(urunId,depoId,miktar);
    if(!_k.ok){
      toast(_k.msg,'err');

    }
  }
  var list=ldS('sh');

  modalKapat('m-sh');toast('Stok hareketi kaydedildi');urunlerRender();
}

function shCSVYukle(inp){
  if(!inp.files[0])return;
  var r=new FileReader();
  r.onload=function(e){
    var lines=e.target.result.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
    var urunler=ldS('urun'),depolar=ldS('depo');
    var eklenen=0,hata=[];var list=ldS('sh');
    lines.forEach(function(line,idx){
      var parts=line.split(',').map(p=>p.trim());
      if(parts.length<3)return;
      var urunKod=parts[0],depoKod=parts[1],miktar=parseFloat(parts[2]);
      var u=urunler.find(x=>x.kod===urunKod);var d=depolar.find(x=>x.kod===depoKod);
      if(!u){hata.push('Satir '+(idx+1)+': Urun bulunamadi: '+urunKod);return;}
      if(!d){hata.push('Satir '+(idx+1)+': Depo bulunamadi: '+depoKod);return;}
      if(!miktar||miktar<=0){hata.push('Satir '+(idx+1)+': Gecersiz miktar');return;}
      list.push({id:nid(list),urunId:u.id,depoId:d.id,yon:'giris',tip:'satin_alma',miktar,birimFiyat:parseFloat(parts[3])||0,par:u.par,tar:today(),refNo:parts[4]||'',ack:parts[5]||('CSV Import '+today()),onay:'onaylandi',sil:false,cat:ts()});
      eklenen++;
    });
    svS('sh',list);modalKapat('m-sh');
    if(hata.length)alert(eklenen+' eklendi. '+hata.length+' hata:\n'+hata.slice(0,3).join('\n'));
    else toast(eklenen+' stok hareketi CSV\`den yuklendi','ok');
    urunlerRender();
  };
  r.readAsText(inp.files[0]);
}

function trKalemlerRender(){

  if(!trKalemler.length){
    el.innerHTML='<div class="text-dim" style="padding:10px;text-align:center">Kalem yok — "+ Ekle" kullanın</div>';
    return;
  }
  var SN_DB='hm_seri';
  var snList=[];try{snList=JSON.parse(localStorage.getItem(SN_DB))||[];}catch{}

  el.innerHTML = trKalemler.map(function(k,i){
    var u   = urs.find(function(x){return x.id===k.urunId;});
    var mev = urunStok(k.urunId, kid);
    var yaz = k.miktar > mev;
    var seriTakip = u && u.seriTakip===true;
    var secililer = trSeriSecim[i] || [];
    var mevcutSeri = seriTakip
      ? snList.filter(function(s){return s.dur==='stok'&&(s.depoId===kid||s.depoId===null);})
      : [];

    var seriHTML = '';
    if(seriTakip){
      var seriItems = mevcutSeri.map(function(s){
        var sec = secililer.indexOf(s.no) >= 0;
        // data-i ve data-no ile onclick — tırnak sorunu yok
        return '<label style="display:flex;align-items:center;gap:3px;font-family:var(--mn);font-size:10px;cursor:pointer;'
          + 'background:'+(sec?'var(--bld)':'var(--s2)')+';border:1px solid '+(sec?'var(--blb)':'var(--bd)')
          + ';border-radius:3px;padding:2px 6px;margin:1px">'
          + '<input type="checkbox" '+(sec?'checked':'')
          + ' data-i="'+i+'" data-no="'+s.no.replace(/"/g,'&quot;')+'" onchange="trSeriCB(this)"> '+s.no
          + '</label>';
      }).join('');
      seriHTML = '<div style="margin-top:6px;background:var(--s);border:1px solid var(--blb);border-radius:var(--Rs);padding:8px">'
        + '<div style="font-size:10px;font-weight:600;color:var(--bl);margin-bottom:5px">'
        + 'Seri No Seç — '+secililer.length+' / '+mev+' seçildi</div>'
        + (mevcutSeri.length
          ? '<div style="display:flex;flex-wrap:wrap;gap:2px;max-height:100px;overflow-y:auto">'+seriItems+'</div>'
            + '<div style="font-size:9px;color:var(--t3);margin-top:4px">Seçilen seri nolar transfer edilir. Miktar otomatik güncellenir.</div>'
          : '<div style="font-size:11px;color:var(--am)">Bu depoda stokta seri kayıt yok</div>')
        + '</div>';
    }

    return '<div style="border:1px solid '+(yaz?'var(--rdb)':'var(--bd)')+';border-radius:var(--Rs);padding:8px;margin-bottom:6px;background:var(--s2)">'
      + '<div style="display:grid;grid-template-columns:2fr 100px 60px auto;gap:8px;align-items:center">'
        + '<select style="background:var(--s);border:1px solid var(--bd);border-radius:var(--Rs);font-family:var(--fn);font-size:11px;padding:4px;outline:none;color:var(--t)" onchange="trKalemUrun('+i+',parseInt(this.value))">'
          + urs.map(function(u2){return'<option value="'+u2.id+'"'+(u2.id===k.urunId?' selected':'')+'>'+u2.kod+' — '+u2.ad+(u2.seriTakip?' 🔢':'')+'</option>';}).join('')
        + '</select>'
        + '<div>'
          + '<input type="number" value="'+k.miktar+'" min="1" max="'+mev+'"'+(seriTakip?' readonly style="background:var(--s2);"':'')+' style="width:100%;background:var(--s);border:1px solid '+(yaz?'var(--rdb)':'var(--bd)')+';border-radius:var(--Rs);font-family:var(--mn);font-size:12px;padding:4px;outline:none;color:'+(yaz?'var(--rd)':'var(--t)')+';text-align:right" onchange="trKalemMiktar('+i+',parseFloat(this.value))">'
          + '<div style="font-size:9px;color:'+(yaz?'var(--rd)':'var(--t3)')+';text-align:right">Max: '+mev+(u?' '+u.birim:'')+'</div>'
        + '</div>'

        + '<button class="btn btn-ghost btn-xs" style="color:var(--rd)" onclick="trKalemSil('+i+')">&#x2715;</button>'
      + '</div>'
      + seriHTML
    + '</div>';
  }).join('');

function trSeriCB(el){
  var i  = parseInt(el.getAttribute('data-i'));
  var no = el.getAttribute('data-no');
  if(!trSeriSecim[i]) trSeriSecim[i] = [];
  if(el.checked){
    if(trSeriSecim[i].indexOf(no) < 0) trSeriSecim[i].push(no);
  } else {
    trSeriSecim[i] = trSeriSecim[i].filter(function(s){return s!==no;});
  }
  if(trKalemler[i]) trKalemler[i].miktar = trSeriSecim[i].length || 1;
  trKalemlerRender();
}

      shList.push({id:nid(shList),urunId:k.urunId,depoId:kid,yon:'cikis',tip:'transfer',miktar:k.miktar,tar:today(),ack:'Transfer #'+trObj.no+' — cikis',hedefDepoId:hid,refNo:trObj.no,birimFiyat:0,par:'TRY',onay:'onaylandi',sil:false,cat:ts()});
      shList.push({id:nid(shList),urunId:k.urunId,depoId:hid,yon:'giris',tip:'transfer',miktar:k.miktar,tar:today(),ack:'Transfer #'+trObj.no+' — giris',refNo:trObj.no,birimFiyat:0,par:'TRY',onay:'onaylandi',sil:false,cat:ts()});
    });

    var SN_DB='hm_seri';var snList=[];try{snList=JSON.parse(localStorage.getItem(SN_DB))||[];}catch{}
    var degisti=false;
    Object.keys(trSeriSecim||{}).forEach(function(idx){

  var el = document.getElementById('mrp-sonuc');

  var sonuc = mrpHesapla(mrpSec.mamulId, mrpSec.adet);
  if(!sonuc.bom){
    el.innerHTML='<div class="uyari-kut">⚠ Bu mamul için reçete (BOM) tanımlı değil. <a href="bom.html" style="color:var(--bl);font-weight:600">Reçete oluştur →</a></div>';
    return;
  }

  var oz = sonuc.ozet;
  var fmtTL = n => '₺'+n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});

  // KPI satırı
  var kpi = '<div class="ozet-row" style="margin-bottom:16px">' +
    '<div class="oz"><div class="oz-lbl">Üretilebilir (şu an)</div><div class="oz-val" style="color:'+(oz.uretilebilirAdet>=mrpSec.adet?'var(--gn)':'var(--rd)')+'">'+oz.uretilebilirAdet+'</div><div class="oz-sub">/ '+mrpSec.adet+' hedef</div></div>' +
    '<div class="oz"><div class="oz-lbl">Toplam Tahmini Maliyet</div><div class="oz-val" style="color:var(--bl);font-size:16px">'+fmtTL(oz.toplamMaliyet)+'</div></div>' +
    (oz.eksikSay?'<div class="oz" style="border-color:var(--rdb)"><div class="oz-lbl" style="color:var(--rd)">Eksik Parça</div><div class="oz-val" style="color:#b91c1c">'+oz.eksikSay+'</div><div class="oz-sub">kalem — '+fmtTL(oz.eksikMaliyet)+' eksik</div></div>':'') +
    '<div class="oz"><div class="oz-lbl">Yeterli Parça</div><div class="oz-val" style="color:var(--gn)">'+oz.yeterliSay+'</div><div class="oz-sub">kalem hazır</div></div>' +
  '</div>';

  // Ana tablo
  var tablo = '<div class="tw"><table class="tbl"><thead><tr>' +
    '<th>Parça</th>' +
    '<th class="num">Gerekli</th>' +
    '<th class="num">Fiziksel</th>' +
    '<th class="num">Rezerve</th>' +
    '<th class="num">Kullanılabilir</th>' +
    '<th class="num" style="color:#b91c1c">Eksik</th>' +
    '<th>Son Tedarikçi</th>' +
    '<th class="num">Birim Fiyat</th>' +
    '<th class="num">Satır Maliyet</th>' +
    '<th class="num" style="color:#b91c1c">Eksik Maliyet</th>' +
  '</tr></thead><tbody>' +
  sonuc.satirlar.map(s =>
    '<tr style="'+(s.yeterli?'':'background:var(--rdd)')+'">' +
      '<td><div style="font-weight:600;font-size:12px">'+s.urunAd+'</div><div style="font-size:10px;color:var(--t3);font-family:var(--mn)">'+s.urunKod+'</div></td>' +
      '<td style="font-family:var(--mn);font-weight:700;text-align:right">'+s.gerekli+'</td>' +
      '<td style="font-family:var(--mn);text-align:right;color:'+(s.fiziksel>0?'var(--t2)':'var(--t3)')+'">'+s.fiziksel+'</td>' +
      '<td style="font-family:var(--mn);text-align:right;color:'+(s.rezerve>0?'#b45309':'var(--t3)')+'">'+( s.rezerve||'—')+'</td>' +
      '<td style="font-family:var(--mn);font-weight:600;text-align:right;color:'+(s.kullanilab>=s.gerekli?'#15803d':s.kullanilab>0?'#d97706':'#b91c1c')+'">'+s.kullanilab+'</td>' +
      '<td style="font-family:var(--mn);font-weight:700;text-align:right;color:#b91c1c">'+(s.eksik||'—')+'</td>' +
      '<td style="font-size:11px;color:var(--t2)">'+s.sonTedarikci+(s.sonAlisTarih?'<div style="font-size:9px;color:var(--t3)">'+s.sonAlisTarih+'</div>':'')+'</td>' +

    }));

      '</div>';
  }

  el.innerHTML = kpi + tablo + saBtn;
}

function mrpSaOlustur(eksikler, ref){
  if(!eksikler||!eksikler.length){toast('Eksik parça yok','ok');return;}
  var kalemler = eksikler.map((e,i)=>({
    id:i+1, urunId:e.urunId, urunAd:e.ad, urunKod:e.kod,
    miktar:e.eksik, birim:e.birim, birimFiyat:e.alisFiyat||0, kdv:18, seriTakip:false
  }));
  var liste = ldSA();
  var yeniSA = {
    id:nid(liste), no:saNoUret(), tip:'siparis', durum:'taslak',
    cariId:null, par:'TRY', kur:1,
    tar:new Date().toISOString().slice(0,10), teslim:'',
    navlun:0, gumruk:0, ekMasraf:0,
    kalemler:kalemler,
    toplamKDVsiz:kalemler.reduce((t,k)=>t+k.miktar*(k.birimFiyat||0),0),
    toplamKDV:kalemler.reduce((t,k)=>t+k.miktar*(k.birimFiyat||0)*((k.kdv||18)/100),0),
    notlar:'MRP — '+ref+' için eksik parça alımı',
    mrpRef:ref, sil:false, olusturma:ts()
  };
  liste.push(yeniSA);
  svSA(liste);
  toast('SA taslağı oluşturuldu: '+yeniSA.no,'2400','success');
  if(confirm('Satın alma sayfasına gitmek ister misiniz?')) location.href='satinalma.html';
}

function lotRender(){
  var el=document.getElementById('s-lot');
  if(!el)return;
  var lotlar=ldLOT();
  var urunler=ldS('urun');
  var fil=document.getElementById('lot-fil-urun')?.value||'';

  // KPI
  var aktifLot=lotlar.filter(l=>l.durum==='aktif');
  var topDeger=aktifLot.reduce((t,l)=>t+(l.kalanMiktar||0)*(l.maliyetTRY||0),0);

  var html='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px">';
  html+='<div class="oz"><div class="oz-lbl">Aktif Lot</div><div class="oz-val">'+aktifLot.length+'</div></div>';
  html+='<div class="oz"><div class="oz-lbl">Toplam Lot Değeri</div><div class="oz-val" style="font-size:16px">'+fmtTL(topDeger)+'</div></div>';
  html+='<div class="oz"><div class="oz-lbl">Tüketilen Lot</div><div class="oz-val" style="color:var(--t3)">'+lotlar.filter(l=>l.durum==='tuketildi').length+'</div></div>';
  html+='</div>';

  // Filtre
  html+='<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">';
  html+='<select id="lot-fil-urun" onchange="lotRender()" style="padding:6px 8px;font-size:12px;border:1px solid var(--bd);border-radius:6px">';
  html+='<option value="">— Tüm Ürünler —</option>'+urunler.map(u=>'<option value="'+u.id+'" '+(u.id==fil?'selected':'')+'>'+u.ad+'</option>').join('');
  html+='</select>';
  html+='<select id="lot-fil-durum" onchange="lotRender()" style="padding:6px 8px;font-size:12px;border:1px solid var(--bd);border-radius:6px">';
  html+='<option value="">Tüm Durumlar</option><option value="aktif">Aktif</option><option value="tuketildi">Tüketildi</option><option value="iptal">İptal</option>';
  html+='</select>';
  html+='</div>';

  // Lot tablosu
  var filDurum=document.getElementById('lot-fil-durum')?.value||'';
  var listFiltre=lotlar.filter(l=>{
    if(fil && l.urunId!=fil) return false;
    if(filDurum && l.durum!==filDurum) return false;
    return true;
  }).sort((a,b)=>b.cat>a.cat?1:-1);

  if(!listFiltre.length){
    html+='<div style="text-align:center;padding:40px;color:var(--t2);font-size:13px">Lot kaydı bulunamadı.<br><small>İthalat mal kabulü veya satın alma sonrasında otomatik oluşturulur.</small></div>';
  } else {
    var durumClr={aktif:'#dcfce7',tuketildi:'#f1f5f9',iptal:'#fee2e2'};
    var durumFg= {aktif:'#15803d', tuketildi:'#64748b', iptal:'#dc2626'};
    html+='<div class="tw"><table class="tbl"><thead><tr>';
    html+='<th>Lot No</th><th>Ürün</th><th>Giriş Tarihi</th><th>Lot Tipi</th>';
    html+='<th style="text-align:right">Toplam</th><th style="text-align:right">Kalan</th>';
    html+='<th style="text-align:right">Birim Maliyet</th><th style="text-align:right">Kalan Değer</th>';
    html+='<th>Durum</th></tr></thead><tbody>';
    html+=listFiltre.map(l=>{
      var u=urunler.find(x=>x.id===l.urunId);
      var dc=durumClr[l.durum]||'#f1f5f9';
      var df=durumFg[l.durum]||'#64748b';
      var kalanDeger=(l.kalanMiktar||0)*(l.maliyetTRY||0);
      return '<tr>'+
        '<td style="font-family:var(--mn);font-weight:600">'+l.lotNo+'</td>'+
        '<td>'+((u?.ad)||l.urunAd||'—')+'</td>'+
        '<td style="font-size:11px">'+l.girisTarihi+'</td>'+
        '<td><span style="font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:#f0f9ff;color:#0369a1">'+(LOT_TIPI[l.lotTipi]||l.lotTipi||'—')+'</span></td>'+
        '<td style="text-align:right">'+l.miktar+'</td>'+
        '<td style="text-align:right;font-weight:700;color:'+(l.kalanMiktar>0?'var(--bl)':'var(--t3)')+'">'+l.kalanMiktar+'</td>'+
        '<td style="text-align:right;font-family:var(--mn)">'+fmtTL(l.maliyetTRY||0)+'</td>'+
        '<td style="text-align:right;font-family:var(--mn);font-weight:600">'+fmtTL(kalanDeger)+'</td>'+
        '<td><span style="font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:'+dc+';color:'+df+'">'+l.durum+'</span></td>'+
      '</tr>';
    }).join('');
    html+='</tbody></table></div>';
  }

  // Ürün yaşam döngüsü özeti
  html+='<div style="margin-top:20px">';
  html+='<div style="font-size:13px;font-weight:700;margin-bottom:12px">🌱 Ürün Yaşam Döngüsü Özeti</div>';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  Object.entries(YASAM_ETK).forEach(function([k,v]){
    var say=urunler.filter(u=>u.yasamDurumu===k||(!u.yasamDurumu&&k==='aktif')).length;
    html+='<div style="background:'+YASAM_CLR[k]+';border-radius:8px;padding:10px 16px;text-align:center;min-width:100px">';
    html+='<div style="font-size:18px;font-weight:700">'+say+'</div>';
    html+='<div style="font-size:11px;font-weight:600;margin-top:2px">'+v+'</div>';
    html+='</div>';
  });
  html+='</div></div>';

  el.innerHTML=html;
}

window.addEventListener('DOMContentLoaded',function(){
  if (!IZIN.guard('stok')) return;
  IZIN.navFiltrele();
  IZIN.islemFiltrele();
  if(typeof buildNav==='function')buildNav('stok');else if(typeof headerRender==='function')headerRender('stok');
  if(typeof stokVeriYukle==='function')stokVeriYukle();
  if(typeof seedMasrafTurleri==='function') seedMasrafTurleri();
  anaUrunlerRender();
  if(typeof buildGlobalAI==='function') buildGlobalAI('stok');
});
</script>
</body>
</html>
