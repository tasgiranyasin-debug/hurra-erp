<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurra Motor ERP — Üretim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .pg-wrap{ flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:14px; }
    .pg-wrap::-webkit-scrollbar{ width:4px; }
    .pg-wrap::-webkit-scrollbar-thumb{ background:var(--bd2); border-radius:2px; }
    .page-hd{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
    .page-ttl{ font-size:18px; font-weight:700; }

    .card{ background:var(--s); border:1px solid var(--bd); border-radius:var(--R); padding:16px; box-shadow:var(--sh); }
    .card-ttl{ font-size:13px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:6px; }

    /* KPI satırı */
    .kpi-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .kpi{ background:var(--s); border:1px solid var(--bd); border-radius:var(--R); padding:12px 14px; box-shadow:var(--sh); }
    .kpi-lbl{ font-size:10px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
    .kpi-val{ font-family:var(--mn); font-size:20px; font-weight:700; }

    /* Durum renkleri */
    .ds{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:600; }
    .ds-taslak{ background:#f3f4f6; color:#374151; }
    .ds-onaylandi{ background:var(--bld); color:var(--bl); }
    .ds-uretimde{ background:#fef3c7; color:#92400e; }
    .ds-tamamlandi{ background:#dcfce7; color:#166534; }
    .ds-iptal{ background:#fee2e2; color:#991b1b; }
    .ds-eksik{ background:#fee2e2; color:#991b1b; }
    .ds-ok{ background:#dcfce7; color:#166534; }

    /* Adım göstergesi */
    .adim-bar{ display:flex; align-items:center; gap:0; margin-bottom:16px; overflow-x:auto; }
    .adim{ display:flex; align-items:center; gap:6px; padding:6px 14px; font-size:11px; font-weight:600; color:var(--t3); white-space:nowrap; }
    .adim.akt{ color:var(--bl); }
    .adim.done{ color:var(--gn); }
    .adim-sep{ color:var(--bd); font-size:16px; }

    /* Tablo */
    .tbl{ width:100%; border-collapse:collapse; font-size:12px; }
    .tbl th{ text-align:left; font-weight:600; color:var(--t3); font-size:11px; padding:8px 10px; border-bottom:1px solid var(--bd); background:var(--s2); text-transform:uppercase; letter-spacing:.04em; }
    .tbl td{ padding:9px 10px; border-bottom:1px solid var(--bd); vertical-align:middle; }
    .tbl tr:last-child td{ border-bottom:none; }
    .tbl tr:hover td{ background:var(--s2); }
    .tbl-wrap{ border-radius:var(--R); border:1px solid var(--bd); overflow:hidden; overflow-x:auto; }

    /* Butonlar */
    .btn{ display:inline-flex; align-items:center; gap:5px; padding:7px 14px; border-radius:var(--Rs); border:none; cursor:pointer; font:500 12px var(--fn); transition:all .12s; }
    .btn-pri{ background:var(--bl); color:#fff; }
    .btn-pri:hover{ opacity:.9; }
    .btn-sec{ background:var(--s2); color:var(--t); border:1px solid var(--bd); }
    .btn-sec:hover{ background:var(--s3,var(--bd)); }
    .btn-rd{ background:var(--rdd); color:var(--rd); border:1px solid var(--rdb,var(--rdd)); }
    .btn-rd:hover{ background:var(--rd); color:#fff; }
    .btn-gn{ background:#dcfce7; color:#166534; border:1px solid #86efac; }
    .btn-gn:hover{ background:#bbf7d0; }
    .btn-sm{ padding:4px 10px; font-size:11px; }

    /* Form */
    .fg{ display:grid; gap:10px; }
    .fg-2{ grid-template-columns:1fr 1fr; }
    .fg-3{ grid-template-columns:1fr 1fr 1fr; }
    .field label{ display:block; font-size:11px; font-weight:600; color:var(--t2); margin-bottom:4px; }
    .field input,.field select,.field textarea{ width:100%; padding:7px 10px; border:1px solid var(--bd); border-radius:var(--Rs); background:var(--bg); color:var(--t); font:14px var(--fn); box-sizing:border-box; }
    .field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--bl); outline:none; box-shadow:0 0 0 2px var(--bld); }

    /* Modal */
    .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; }
    .modal-bg.hidden{ display:none; }
    .modal{ background:var(--s); border:1px solid var(--bd); border-radius:var(--R); box-shadow:0 20px 60px rgba(0,0,0,.25); padding:20px; width:100%; max-width:640px; max-height:92vh; overflow-y:auto; }
    .modal-hd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .modal-ttl{ font-size:14px; font-weight:600; }
    .modal-close{ background:none; border:none; cursor:pointer; color:var(--t3); font-size:18px; }
    .modal-ft{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

    /* Stok kontrol */
    .stok-kontrol{ border:1px solid var(--bd); border-radius:var(--Rs); overflow:hidden; margin-top:10px; }
    .stok-satir{ display:grid; grid-template-columns:1fr 80px 80px 80px; gap:0; font-size:12px; }
    .stok-satir>div{ padding:7px 10px; border-bottom:1px solid var(--bd); }
    .stok-satir.hd>div{ background:var(--s2); font-weight:600; font-size:11px; color:var(--t3); text-transform:uppercase; }
    .stok-satir:last-child>div{ border-bottom:none; }
    .stok-eksik{ background:var(--rdd); }
    .stok-ok{ }

    /* Akış adımları */
    .akis-adim{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--bd); }
    .akis-adim:last-child{ border-bottom:none; }
    .akis-no{ width:24px; height:24px; border-radius:50%; background:var(--s2); border:1px solid var(--bd); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
    .akis-no.done{ background:var(--gn); color:#fff; border-color:var(--gn); }
    .akis-no.akt{ background:var(--bl); color:#fff; border-color:var(--bl); }

    /* Sekme */
    .tab-bar{ display:flex; gap:2px; border-bottom:1px solid var(--bd); margin-bottom:14px; }
    .tab-btn{ background:none; border:none; color:var(--t3); font:500 12px var(--fn); padding:8px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:var(--Rs) var(--Rs) 0 0; transition:all .12s; }
    .tab-btn:hover{ color:var(--t); background:var(--s2); }
    .tab-btn.act{ color:var(--bl); border-bottom-color:var(--bl); font-weight:600; }
    .tab-pane{ display:none; }
    .tab-pane.act{ display:block; }

    /* Uyarı */
    .uyari-kut{ background:var(--rdd); border:1px solid #f87171; border-radius:var(--Rs); padding:10px 12px; font-size:12px; color:var(--rd); }
    .uyari-kut ul{ margin:4px 0 0 16px; }
    .bilgi-kut{ background:var(--bld); border:1px solid var(--blb,var(--bl)); border-radius:var(--Rs); padding:10px 12px; font-size:12px; color:var(--bl); }
  </style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-l">
      <div class="logo-wrap"><span class="logo-ico">🏭</span><span class="logo-txt">Hurra Motor</span></div>
      <nav id="main-nav"></nav>
    </div>
    <div class="hdr-r">
      <div id="kur-bar" class="kur-bar"></div>
      <button class="icon-btn" onclick="toggleDark()">🌙</button>
      <button class="btn btn-sm btn-rd" onclick="if(confirm('Çıkış?'))cikisYap()">Çıkış</button>
    </div>
  </header>

  <div class="pg-wrap">
    <div class="page-hd">
      <div class="page-ttl">🏭 Üretim Yönetimi</div>
      <button class="btn btn-pri" onclick="yeniUretimModal()">+ Yeni Üretim Emri</button>
    </div>

    <!-- KPI -->
    <div class="kpi-row" id="kpi-row"></div>

    <!-- Sekmeler -->
    <div>
      <div class="tab-bar">
        <button class="tab-btn act" onclick="sekme('aktif',this)">🔄 Aktif Emirler</button>
        <button class="tab-btn" onclick="sekme('tamamlanan',this)">✅ Tamamlanan</button>
        <button class="tab-btn" onclick="sekme('tum',this)">📋 Tüm Emirler</button>
      </div>

      <div class="tab-pane act" id="pane-aktif">
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr>
              <th>Üretim No</th><th>Mamul</th><th>Adet</th><th>Durum</th>
              <th>Başlangıç</th><th>Teslim</th><th>Maliyet</th><th>İşlem</th>
            </tr></thead>
            <tbody id="aktif-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane" id="pane-tamamlanan">
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr>
              <th>Üretim No</th><th>Mamul</th><th>Adet</th><th>Durum</th>
              <th>Tamamlanma</th><th>Maliyet</th><th>Seri Numaraları</th>
            </tr></thead>
            <tbody id="tamamlanan-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane" id="pane-tum">
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr>
              <th>Üretim No</th><th>Mamul</th><th>Adet</th><th>Durum</th>
              <th>Tarih</th><th>Maliyet</th><th>İşlem</th>
            </tr></thead>
            <tbody id="tum-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Üretim Modal (Yeni / Detay) -->
<div class="modal-bg hidden" id="uretim-modal">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-ttl" id="um-ttl">Yeni Üretim Emri</div>
      <button class="modal-close" onclick="closeModal('uretim-modal')">✕</button>
    </div>

    <!-- Adım göstergesi -->
    <div class="adim-bar" id="um-adim-bar"></div>

    <!-- Adım 1: Temel bilgiler -->
    <div id="um-adim-1">
      <div class="fg fg-2" style="margin-bottom:10px">
        <div class="field">
          <label>Mamul Ürün *</label>
          <select id="um-mamul" onchange="mamulSecildi()">
            <option value="">— Seçin —</option>
          </select>
        </div>
        <div class="field">
          <label>Üretim Adedi *</label>
          <input type="number" id="um-adet" min="1" value="1" onchange="adetDegisti()">
        </div>
        <div class="field">
          <label>Sorumlu Personel</label>
          <input id="um-sorumlu" placeholder="Ad Soyad">
        </div>
        <div class="field">
          <label>Kalite Kontrol Personeli</label>
          <input id="um-kalite" placeholder="Ad Soyad">
        </div>
        <div class="field">
          <label>Hedef Depo</label>
          <select id="um-hedef-depo">
            <option value="">— Seçin —</option>
          </select>
        </div>
        <div class="field">
          <label>Malzeme Deposu</label>
          <select id="um-malz-depo">
            <option value="">— Seçin —</option>
          </select>
        </div>
        <div class="field">
          <label>Başlangıç Tarihi</label>
          <input type="date" id="um-bas-tarih">
        </div>
        <div class="field">
          <label>Teslim Tarihi</label>
          <input type="date" id="um-tes-tarih">
        </div>
      </div>
      <div class="field" style="margin-bottom:10px">
        <label>Notlar</label>
        <textarea id="um-notlar" rows="2" placeholder="Üretim notu..."></textarea>
      </div>

      <!-- İşçilik Maliyeti (v4.0) -->
      <div style="border-top:1px solid var(--bd);padding-top:12px;margin-top:4px">
        <div style="font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">İşçilik & Ek Maliyetler</div>
        <div class="fg" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <div class="field">
            <label>İşçilik Süresi (saat)</label>
            <input type="number" id="um-iscilik-sure" value="0" min="0" step="0.5" oninput="iscilikHesapla()">
          </div>
          <div class="field">
            <label>Saatlik Ücret (TRY)</label>
            <input type="number" id="um-saatlik-ucret" value="0" min="0" step="0.01" oninput="iscilikHesapla()">
          </div>
          <div class="field">
            <label>İşçilik Toplamı</label>
            <input type="number" id="um-iscilik-toplam" readonly value="0" style="background:var(--s2)">
          </div>
          <div class="field">
            <label>Enerji Maliyeti (TRY)</label>
            <input type="number" id="um-ek-enerji" value="0" min="0" step="0.01">
          </div>
          <div class="field">
            <label>Genel Gider Payı (TRY)</label>
            <input type="number" id="um-ek-genel" value="0" min="0" step="0.01">
          </div>
          <div class="field">
            <label>Paketleme (TRY)</label>
            <input type="number" id="um-ek-paketleme" value="0" min="0" step="0.01">
          </div>
        </div>
      </div>

      <!-- Reçete & Stok kontrolü -->
      <div id="um-stok-kontrol"></div>
    </div>

    <div class="modal-ft">
      <button class="btn btn-sec" onclick="closeModal('uretim-modal')">İptal</button>
      <button class="btn btn-rd btn-sm" id="um-iptal-btn" style="display:none;margin-right:auto" onclick="uretimIptal()">İptal Et</button>
      <div id="um-akis-btns" style="display:flex;gap:8px"></div>
    </div>
  </div>
</div>

<!-- Seri No Modal -->
<div class="modal-bg hidden" id="seri-modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-hd">
      <div class="modal-ttl">🔢 Seri Numarası Ata</div>
      <button class="modal-close" onclick="closeModal('seri-modal')">✕</button>
    </div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:10px" id="seri-info"></div>
    <div id="seri-giris-alani"></div>
    <div class="modal-ft">
      <button class="btn btn-sec" onclick="closeModal('seri-modal')">Atla</button>
      <button class="btn btn-pri" onclick="seriKaydet()">Kaydet ve Tamamla</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db/supabase.js?v=1"></script>
  <script src="core.js?v=43"></script>
<script>
  sessionKontrol() || (location.href = 'index.html');
  buildNav('uretim');
  applyTheme();

  let activeUretimId = null;

  // Bugünü ve +7 gün doldur
  function doldurDepoSelects(hedefId, malzId){
    const depolar = ldS('depo').filter(d => d.aktif !== false);
    const hedefSel = document.getElementById('um-hedef-depo');
    const malzSel  = document.getElementById('um-malz-depo');
    const opts = '<option value="">— Seçin —</option>' +
      depolar.map(d => `<option value="${d.id}">${d.ad}</option>`).join('');
    hedefSel.innerHTML = opts;
    malzSel.innerHTML  = opts;
    if(hedefId) hedefSel.value = hedefId;
    if(malzId)  malzSel.value  = malzId;
    // Varsayılan: ilk depoyu seç
    if(!hedefSel.value && depolar.length) hedefSel.value = depolar[0].id;
    if(!malzSel.value  && depolar.length) malzSel.value  = depolar[0].id;
  }

  window.addEventListener('DOMContentLoaded', () => {
    yetkiKontrol('uretim');
    const bugun = new Date().toISOString().slice(0,10);
    const yedi  = new Date(Date.now()+7*864e5).toISOString().slice(0,10);
    document.getElementById('um-bas-tarih').value = bugun;
    document.getElementById('um-tes-tarih').value = yedi;
    doldurDepoSelects();
    renderAll();
  });

  // ── Veri ──
  function getUretimler(){ return ld('uretim') || []; }
  function saveUretim(list){ sv('uretim', list); }
  function getUrunler(){ return ldS('urun') || []; }
  function getBomlar(){ return ld('bom') || []; }

  function uretimNo(){
    const list = getUretimler();
    const n = list.length + 1;
    return 'ÜR-' + new Date().getFullYear() + '-' + String(n).padStart(4,'0');
  }

  function getDurum(d){
    const map = {
      planlandi:'ds-planlandi', hazirlaniyor:'ds-hazirlaniyor',
      uretimde:'ds-uretimde', kalite_kontrol:'ds-kalite', tamamlandi:'ds-tamamlandi', iptal:'ds-iptal',
      // Geriye dönük uyumluluk
      taslak:'ds-planlandi', onaylandi:'ds-hazirlaniyor'
    };
    const lbl = {
      planlandi:'Planlandı', hazirlaniyor:'Hazırlanıyor',
      uretimde:'Üretimde', kalite_kontrol:'Kalite Kontrol', tamamlandi:'Tamamlandı', iptal:'İptal',
      taslak:'Planlandı', onaylandi:'Hazırlanıyor'
    };
    return `<span class="ds ${map[d]||'ds-planlandi'}">${lbl[d]||d}</span>`;
  }

  // ── Render ──
  function renderAll(){
    renderKpi();
    renderTablo('aktif');
    renderTablo('tamamlanan');
    renderTablo('tum');
  }

  function sekme(id, btn){
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('act'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('act'));
    document.getElementById('pane-' + id).classList.add('act');
    btn.classList.add('act');
    renderTablo(id);
  }

  function renderKpi(){
    const list = getUretimler();
    const stats = [
      { lbl:'Toplam Emir',   val: list.length },
      { lbl:'Planlandı',     val: list.filter(u=>u.durum==='planlandi'||u.durum==='taslak').length },
      { lbl:'Üretimde',      val: list.filter(u=>['hazirlaniyor','uretimde','kalite_kontrol','onaylandi'].includes(u.durum)).length },
      { lbl:'Tamamlandı',    val: list.filter(u=>u.durum==='tamamlandi').length },
      { lbl:'Toplam Maliyet',val: '₺'+fmt(list.reduce((t,u)=>t+(u.maliyet||0),0)) },
    ];
    document.getElementById('kpi-row').innerHTML = stats.map(s =>
      `<div class="kpi"><div class="kpi-lbl">${s.lbl}</div><div class="kpi-val">${s.val}</div></div>`
    ).join('');
  }

  function renderTablo(tip){
    let list = getUretimler();
    const stoklar = getUrunler();
    const aktifDurumlar = ['planlandi','hazirlaniyor','uretimde','kalite_kontrol','taslak','onaylandi'];
    if(tip === 'aktif')       list = list.filter(u => aktifDurumlar.includes(u.durum||'planlandi'));
    if(tip === 'tamamlanan')  list = list.filter(u => u.durum === 'tamamlandi' || u.durum === 'iptal');

    const tbody = document.getElementById(tip+'-tbody');
    if(!tbody) return;

    if(!list.length){
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--t3);padding:24px">Kayıt yok</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(u => {
      const mamul = stoklar.find(x => x.id === u.urunId);
      if(tip === 'tamamlanan'){
        return `<tr>
          <td style="font-family:var(--mn);font-size:11px">${u.no||'—'}</td>
          <td><strong>${mamul?mamul.ad:'?'}</strong></td>
          <td style="font-family:var(--mn)">${u.adet}</td>
          <td>${getDurum(u.durum||'planlandi')}</td>
          <td style="font-size:11px;color:var(--t3)">${u.tamamlanmaTarihi||'—'}</td>
          <td style="font-family:var(--mn)">₺${fmt(u.maliyet||0)}</td>
          <td style="font-size:11px;color:var(--t3)">${(u.seriNolar||[]).join(', ')||'—'}</td>
        </tr>`;
      }
      return `<tr>
        <td style="font-family:var(--mn);font-size:11px">${u.no||'—'}</td>
        <td><strong>${mamul?mamul.ad:'?'}</strong></td>
        <td style="font-family:var(--mn)">${u.adet}</td>
        <td>${getDurum(u.durum||'planlandi')}</td>
        <td style="font-size:11px;color:var(--t3)">${u.basTarih||'—'}</td>
        <td style="font-size:11px;color:var(--t3)">${u.tesTarih||'—'}</td>
        <td style="font-family:var(--mn)">₺${fmt(u.maliyet||0)}</td>
        <td>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sec btn-sm" onclick="uretimDetay('${u.id}')">Detay</button>
            ${(u.durum==='planlandi'||u.durum==='taslak')?`<button class="btn btn-gn btn-sm" onclick="uretimHazirla('${u.id}')">Hazırlamaya Al</button>`:''}
            ${(u.durum==='hazirlaniyor'||u.durum==='onaylandi')?`<button class="btn btn-gn btn-sm" onclick="uretimBaslat('${u.id}')">Üretime Al</button>`:''}
            ${u.durum==='uretimde'?`<button class="btn btn-am btn-sm" onclick="uretimKaliteKontrol('${u.id}')">Kalite Kontrol</button>`:''}
            ${u.durum==='kalite_kontrol'?`<button class="btn btn-pri btn-sm" onclick="uretimTamamla('${u.id}')">Tamamla</button>`:''}
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  // ── Modal ──
  function iscilikHesapla(){
    const sure  = parseFloat(document.getElementById('um-iscilik-sure')?.value)||0;
    const ucret = parseFloat(document.getElementById('um-saatlik-ucret')?.value)||0;
    const el    = document.getElementById('um-iscilik-toplam');
    if(el) el.value = (sure*ucret).toFixed(2);
  }

  function yeniUretimModal(){
    activeUretimId = null;
    document.getElementById('um-ttl').textContent = 'Yeni Üretim Emri';
    document.getElementById('um-iptal-btn').style.display = 'none';
    doldurMamulSelect();
    document.getElementById('um-adet').value = 1;
    document.getElementById('um-sorumlu').value = '';
    document.getElementById('um-kalite').value = '';
    document.getElementById('um-notlar').value = '';
    document.getElementById('um-stok-kontrol').innerHTML = '';
    // v4.0 — işçilik alanlarını temizle
    ['um-iscilik-sure','um-saatlik-ucret','um-iscilik-toplam','um-ek-enerji','um-ek-genel','um-ek-paketleme']
      .forEach(id => { const el = document.getElementById(id); if(el) el.value = 0; });
    doldurDepoSelects();
    document.getElementById('um-akis-btns').innerHTML = `<button class="btn btn-pri" onclick="uretimKaydet('planlandi')">Planla</button><button class="btn btn-gn" onclick="uretimKaydet('hazirlaniyor')">Hazırlamaya Al</button>`;
    openModal('uretim-modal');
  }

  function uretimDetay(id){
    const u = getUretimler().find(x => x.id === id);
    if(!u) return;
    activeUretimId = id;
    const mamul = getUrunler().find(x => x.id === u.urunId);
    document.getElementById('um-ttl').textContent = `Üretim Emri: ${u.no}`;
    document.getElementById('um-iptal-btn').style.display = u.durum!=='tamamlandi'&&u.durum!=='iptal' ? 'inline-flex' : 'none';
    doldurMamulSelect(u.urunId);
    doldurDepoSelects(u.hedefDepoId, u.malzemeDepoId);
    document.getElementById('um-adet').value = u.adet;
    document.getElementById('um-sorumlu').value = u.sorumlu||'';
    document.getElementById('um-kalite').value = u.kalite||'';
    document.getElementById('um-notlar').value = u.notlar||'';
    document.getElementById('um-bas-tarih').value = u.basTarih||'';
    document.getElementById('um-tes-tarih').value = u.tesTarih||'';
    // v4.0 — işçilik/ek maliyet alanları
    const ek = u.ekMaliyetler||{};
    document.getElementById('um-iscilik-sure').value  = u.iscilikSure||0;
    document.getElementById('um-saatlik-ucret').value = u.saatlikUcret||0;
    document.getElementById('um-iscilik-toplam').value= ((u.iscilikSure||0)*(u.saatlikUcret||0)).toFixed(2);
    document.getElementById('um-ek-enerji').value     = ek.enerji||0;
    document.getElementById('um-ek-genel').value      = ek.genelGider||0;
    document.getElementById('um-ek-paketleme').value  = ek.paketleme||0;
    // Mevcut emrin kendi rezervasyonunu çift saymamak için id geç
    mamulSecildi(id);

    const btns = document.getElementById('um-akis-btns');
    const d = u.durum;
    if(d==='planlandi'||d==='taslak')
      btns.innerHTML = `<button class="btn btn-sec" onclick="uretimKaydet('planlandi')">Güncelle</button><button class="btn btn-gn" onclick="uretimKaydet('hazirlaniyor')">Hazırlamaya Al</button>`;
    else if(d==='hazirlaniyor'||d==='onaylandi')
      btns.innerHTML = `<button class="btn btn-gn" onclick="uretimKaydet('uretimde')">Üretime Al</button>`;
    else if(d==='uretimde')
      btns.innerHTML = `<button class="btn btn-am" onclick="uretimKaydet('kalite_kontrol')">Kalite Kontrole Al</button>`;
    else if(d==='kalite_kontrol')
      btns.innerHTML = `<button class="btn btn-pri" onclick="uretimKaydet('tamamlandi_pre')">Tamamla →</button>`;
    else btns.innerHTML = `<span style="font-size:12px;color:var(--t3)">${getDurum(u.durum)}</span>`;

    openModal('uretim-modal');
  }

  function doldurMamulSelect(secili){
    const sel = document.getElementById('um-mamul');
    const list = getUrunler().filter(u => u.urunTipi === 'mamul');
    sel.innerHTML = '<option value="">— Mamul seçin —</option>' +
      list.map(u => `<option value="${u.id}" ${u.id===secili?'selected':''}>${u.ad}</option>`).join('');
    if(secili) setTimeout(mamulSecildi, 50);
  }

  function mamulSecildi(excludeId=null){
    const mamulId = document.getElementById('um-mamul').value;
    const adet    = parseInt(document.getElementById('um-adet').value) || 1;
    if(!mamulId){ document.getElementById('um-stok-kontrol').innerHTML=''; return; }
    renderStokKontrol(mamulId, adet, excludeId);
  }

  function adetDegisti(){ mamulSecildi(activeUretimId); }

  // excludeId: mevcut emrin kendisini rezerve hesabından dışla (double-counting önler)
  function renderStokKontrol(mamulId, adet, excludeId=null){
    const bomlar  = getBomlar();
    const stoklar = getUrunler();
    const bom = bomlar.find(b => b.mamulUrunId === mamulId && b.aktif !== false);
    const el = document.getElementById('um-stok-kontrol');

    if(!bom){
      el.innerHTML = `<div class="bilgi-kut">ℹ Bu mamul için reçete tanımlı değil. <a href="bom.html" style="color:var(--bl);font-weight:600">Reçete oluştur →</a></div>`;
      return;
    }

    let maliyet = 0;
    const satirlar = (bom.satirlar||[]).map(s => {
      const p = stoklar.find(u => u.id === s.urunId);
      // excludeId: açık üretim emrinin kendi parçalarını çift sayma
      const mevcut = p ? kullanilabilirStok(p.id, null, excludeId) : 0;
      const rezerve = p ? rezerveStok(p.id, excludeId) : 0;
      const gerekli = (s.miktar||1) * adet;
      const yeterli = mevcut >= gerekli;
      maliyet += (p?.alisFiyat||0) * (s.miktar||1);
      return { ad: p?p.ad:(s.parcaAd||'?'), gerekli, mevcut, rezerve, yeterli };
    });

    const eksikler = satirlar.filter(s => !s.yeterli);
    const topMaliyet = maliyet * adet;

    const toplamRezerveli = satirlar.some(s => s.rezerve > 0);
    let html = `
      <div style="font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">
        📦 Malzeme Kontrolü — ${adet} adet için
        ${excludeId ? '<span style="font-size:10px;background:#dbeafe;color:#1e40af;padding:1px 6px;border-radius:99px;font-weight:600;margin-left:6px">Bu emrin rezervasyonu hariç</span>' : ''}
      </div>
      <div class="stok-kontrol">
        <div class="stok-satir hd">
          <div>Parça</div><div>Gerekli</div><div>Kullanılabilir${toplamRezerveli?' / Rezerve':''}</div><div>Durum</div>
        </div>
        ${satirlar.map(s => `
          <div class="stok-satir ${s.yeterli?'stok-ok':'stok-eksik'}">
            <div>${s.ad}</div>
            <div style="font-family:var(--mn)">${s.gerekli}</div>
            <div style="font-family:var(--mn);color:${s.yeterli?'var(--gn)':'var(--rd)'}">
              ${s.mevcut}
              ${s.rezerve > 0 ? `<span style="font-size:9px;color:#b45309;margin-left:3px">(+${s.rezerve} rezerve)</span>` : ''}
            </div>
            <div>${s.yeterli ? '<span class="ds ds-ok">✓</span>' :
              `<span class="ds ds-eksik">Eksik ${s.gerekli - s.mevcut}</span>`}</div>
          </div>`).join('')}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px">
        <span style="color:var(--t3)">Tahmini Maliyet:</span>
        <strong style="font-family:var(--mn);color:var(--bl)">₺${fmt(topMaliyet)}</strong>
      </div>`;

    if(eksikler.length){
      // Eksik parça verileri — satın alma önerisi için
      const eksikData = (bom.satirlar||[]).map((s,i)=>{
        const p = stoklar.find(u=>u.id===s.urunId);
        return {
          urunId: s.urunId,
          ad: p?.ad || s.parcaAd || '?',
          kod: p?.kod || '',
          birim: s.birim || p?.birim || 'Adet',
          alisFiyat: p?.alisFiyat || 0,
          gerekli: (s.miktar||1)*adet,
          mevcut: satirlar[i]?.mevcut || 0,
          eksik: Math.max(0, (s.miktar||1)*adet - (satirlar[i]?.mevcut||0)),
          yeterli: satirlar[i]?.yeterli
        };
      }).filter(e=>!e.yeterli);

      html += `<div class="uyari-kut" style="margin-top:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div>⚠ ${eksikler.length} parçada stok yetersiz:
            <ul style="margin:4px 0 0 0">${eksikler.map(e=>`<li>${e.ad}: gerekli ${e.gerekli}, mevcut ${e.mevcut}, <b style="color:#b91c1c">eksik ${e.gerekli-e.mevcut}</b></li>`).join('')}</ul>
          </div>
          <button class="btn btn-am btn-sm" onclick="saOneriOlustur(${JSON.stringify(eksikData).replace(/"/g,'&quot;')}, '${u?.no||id}')">
            🛒 Satın Alma Taslağı Oluştur
          </button>
        </div>
      </div>`;
    }

    el.innerHTML = html;
  }

  // ── Eksik parça → Satın Alma taslağı ──
  function saOneriOlustur(eksikler, uretimNo){
    if(!eksikler || !eksikler.length){ toast('Eksik parça yok','info'); return; }

    // Modal oluştur
    const m = document.createElement('div');
    m.className = 'modal-bg';
    m.id = 'sa-oneri-modal';
    m.innerHTML = `
      <div class="modal" style="max-width:600px">
        <div class="modal-hd">
          <div class="modal-ttl">🛒 Satın Alma Önerisi — Üretim #${uretimNo}</div>
          <button class="modal-close" onclick="document.getElementById('sa-oneri-modal').remove()">✕</button>
        </div>
        <div style="font-size:11px;color:var(--t3);margin-bottom:12px">
          Aşağıdaki eksik parçalar için satın alma taslağı oluşturulacak. Miktarları düzenleyebilirsiniz.
        </div>
        <div class="stok-kontrol" style="margin-bottom:12px">
          <div class="stok-satir hd">
            <div>Parça</div><div>Eksik Adet</div><div>Alınacak Miktar</div><div>Tahmini Fiyat</div>
          </div>
          ${eksikler.map((e,i)=>`
            <div class="stok-satir stok-eksik">
              <div>
                <div style="font-weight:600;font-size:12px">${e.ad}</div>
                <div style="font-size:10px;color:var(--t3);font-family:var(--mn)">${e.kod}</div>
              </div>
              <div style="font-family:var(--mn);color:#b91c1c;font-weight:700">${e.eksik} ${e.birim}</div>
              <div>
                <input type="number" id="sa-oneri-miktar-${i}" value="${e.eksik}" min="1"
                  style="width:72px;padding:3px 6px;border:1px solid var(--bd);border-radius:var(--Rs);background:var(--bg);color:var(--t);font:12px var(--mn);text-align:right"
                  oninput="saOneriHesapla()">
                <span style="font-size:10px;color:var(--t3);margin-left:2px">${e.birim}</span>
              </div>
              <div id="sa-oneri-fiyat-${i}" style="font-family:var(--mn);font-size:11px;color:var(--bl)">
                ${e.alisFiyat>0?'₺'+(e.eksik*e.alisFiyat).toLocaleString('tr-TR',{minimumFractionDigits:2}):'—'}
              </div>
            </div>`).join('')}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:8px 10px;background:var(--s2);border-radius:var(--Rs)">
          <span style="font-size:12px;color:var(--t2)">Toplam Tahmini:</span>
          <span id="sa-oneri-toplam" style="font-family:var(--mn);font-weight:700;color:var(--bl)">
            ₺${eksikler.reduce((t,e)=>t+e.eksik*(e.alisFiyat||0),0).toLocaleString('tr-TR',{minimumFractionDigits:2})}
          </span>
        </div>
        <div style="margin-bottom:12px">
          <label style="font-size:11px;font-weight:600;color:var(--t2);display:block;margin-bottom:4px">Not (opsiyonel)</label>
          <textarea id="sa-oneri-not" rows="2"
            style="width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--bd);border-radius:var(--Rs);background:var(--bg);color:var(--t);font:12px var(--fn);resize:none"
            placeholder="Üretim #${uretimNo} için eksik parça alımı"></textarea>
        </div>
        <div class="modal-ft">
          <button class="btn btn-sec" onclick="document.getElementById('sa-oneri-modal').remove()">Vazgeç</button>
          <button class="btn btn-am" onclick="saOneriKaydet(${JSON.stringify(eksikler).replace(/"/g,'&quot;')}, '${uretimNo}')">
            Taslak Oluştur →
          </button>
        </div>
      </div>`;

    // Global ref for recalc
    window._saOneriEksikler = eksikler;
    document.body.appendChild(m);
  }

  function saOneriHesapla(){
    const eksikler = window._saOneriEksikler || [];
    let toplam = 0;
    eksikler.forEach((e,i)=>{
      const miktar = parseFloat(document.getElementById('sa-oneri-miktar-'+i)?.value)||0;
      const fiyat = e.alisFiyat||0;
      const ara = miktar*fiyat;
      toplam += ara;
      const fd = document.getElementById('sa-oneri-fiyat-'+i);
      if(fd) fd.textContent = fiyat>0?'₺'+ara.toLocaleString('tr-TR',{minimumFractionDigits:2}):'—';
    });
    const td = document.getElementById('sa-oneri-toplam');
    if(td) td.textContent = '₺'+toplam.toLocaleString('tr-TR',{minimumFractionDigits:2});
  }

  function saOneriKaydet(eksikler, uretimNo){
    const not = document.getElementById('sa-oneri-not')?.value ||
      'Üretim #'+uretimNo+' için eksik parça alımı';

    const kalemler = eksikler.map((e,i)=>{
      const miktar = parseFloat(document.getElementById('sa-oneri-miktar-'+i)?.value)||e.eksik;
      return {
        id: i+1,
        urunId: e.urunId,
        urunAd: e.ad,
        urunKod: e.kod,
        miktar: miktar,
        birim: e.birim,
        birimFiyat: e.alisFiyat||0,
        kdv: 18,
        seriTakip: false
      };
    });

    const liste = ldSA();
    const yeniSA = {
      id: nid(liste),
      no: saNoUret(),
      tip: 'siparis',
      durum: 'taslak',
      cariId: null,       // tedarikçi seçimi için satinalma.html'de tamamlanacak
      par: 'TRY',
      kur: 1,
      tar: new Date().toISOString().slice(0,10),
      teslim: '',
      navlun: 0, gumruk: 0, ekMasraf: 0,
      kalemler: kalemler,
      toplamKDVsiz: kalemler.reduce((t,k)=>t+k.miktar*(k.birimFiyat||0),0),
      toplamKDV: kalemler.reduce((t,k)=>t+k.miktar*(k.birimFiyat||0)*((k.kdv||18)/100),0),
      notlar: not,
      uretimRef: uretimNo,
      sil: false,
      olusturma: ts()
    };
    liste.push(yeniSA);
    svSA(liste);

    document.getElementById('sa-oneri-modal').remove();
    toast('Satın alma taslağı oluşturuldu: '+yeniSA.no,'2400','success');

    // Satın alma sayfasına yönlendir
    setTimeout(()=>{
      if(confirm('Taslak oluşturuldu ('+yeniSA.no+'). Satın alma sayfasına gitmek ister misiniz?')){
        location.href='satinalma.html';
      }
    }, 300);
  }

  // ── Kaydet / Durum ──
  async function uretimKaydet(durum){
    const urunId  = document.getElementById('um-mamul').value;
    const adet    = parseInt(document.getElementById('um-adet').value) || 1;
    if(!urunId){ toast('Mamul seçin','2400','error'); return; }

    const hedefDepoId   = parseInt(document.getElementById('um-hedef-depo').value) || null;
    const malzemeDepoId = parseInt(document.getElementById('um-malz-depo').value)  || null;

    const bomlar  = getBomlar();
    const bom     = bomlar.find(b => b.mamulUrunId === urunId);
    const maliyet = bom ? (bom.satirlar||[]).reduce((t,s) => {
      const p = getUrunler().find(u=>u.id===s.urunId);
      return t + ((p?.alisFiyat||0) * (s.miktar||1));
    },0) * adet : 0;

    if(durum === 'tamamlandi_pre'){
      closeModal('uretim-modal');
      seriNoAta(activeUretimId, adet);
      return;
    }

    const durumEtiket = { planlandi:'planlandı', hazirlaniyor:'hazırlamaya alındı', uretimde:'üretime alındı', kalite_kontrol:'kalite kontrole alındı' };
    const list = getUretimler();

    // v4.0 — İşçilik ve ek maliyet verileri
    const iscilikSure  = parseFloat(document.getElementById('um-iscilik-sure')?.value)||0;
    const saatlikUcret = parseFloat(document.getElementById('um-saatlik-ucret')?.value)||0;
    const ekMaliyetler = {
      enerji:     parseFloat(document.getElementById('um-ek-enerji')?.value)||0,
      genelGider: parseFloat(document.getElementById('um-ek-genel')?.value)||0,
      paketleme:  parseFloat(document.getElementById('um-ek-paketleme')?.value)||0,
    };
    // Gerçek mamul maliyeti hesapla (parça + işçilik + ek)
    const iscilikToplam = iscilikSure * saatlikUcret;
    const ekToplam = ekMaliyetler.enerji + ekMaliyetler.genelGider + ekMaliyetler.paketleme;
    const gercekMaliyet = maliyet + iscilikToplam + ekToplam;

    const updateObj = {
      urunId, adet, hedefDepoId, malzemeDepoId,
      sorumlu:    document.getElementById('um-sorumlu').value,
      kalite:     document.getElementById('um-kalite').value,
      notlar:     document.getElementById('um-notlar').value,
      basTarih:   document.getElementById('um-bas-tarih').value,
      tesTarih:   document.getElementById('um-tes-tarih').value,
      maliyet: gercekMaliyet, durum,
      // v4.0 yeni alanlar
      iscilikSure, saatlikUcret, iscilikToplam, ekMaliyetler,
      parcaMaliyeti: maliyet,
      planliTeslim: document.getElementById('um-tes-tarih').value,
    };

    if(activeUretimId){
      const idx = list.findIndex(u => u.id === activeUretimId);
      if(idx >= 0) Object.assign(list[idx], updateObj);
    } else {
      list.push({
        id: nid(list), no: uretimNo(), ...updateObj,
        seriNolar:[], olusturma: ts()
      });
    }

    saveUretim(list);
    closeModal('uretim-modal');
    renderAll();
    toast(`Üretim emri ${durumEtiket[durum]||'güncellendi'}`,'2000','success');
  }

  function uretimHazirla(id){
    const list = getUretimler();
    const idx  = list.findIndex(u => u.id === id);
    if(idx < 0) return;
    const u = list[idx];

    // ── İki seviyeli stok kontrolü ─────────────────────────────
    const kontrol = stokYeterliMi(u.urunId, u.adet, id);

    if(!kontrol.yeterli){
      // KRİTİK: fiziksel stok yetersiz → BLOK, geçiş yok
      const eksikMsg = kontrol.eksikler.map(e =>
        `• ${e.ad}\n  Gerekli: ${e.gerekli} — Kullanılabilir: ${e.mevcut} — Eksik: ${e.eksik}`
      ).join('\n');
      alert(
        `🚫 Üretim başlatılamaz — Yetersiz Stok\n\n${eksikMsg}\n\n` +
        `Satın alma taslağı oluşturup malzemeleri tamamladıktan sonra tekrar deneyin.`
      );
      return; // kesin blok
    }

    if(kontrol.uyarilar.length){
      // UYARI: yeterli ama bu üretimden sonra eşik altına düşecek
      const uyariMsg = kontrol.uyarilar.map(e =>
        `• ${e.ad}: kullanıldıktan sonra ${e.kalan} adet kalacak`
      ).join('\n');
      const devamEt = confirm(
        `⚠️ Düşük Stok Uyarısı\n\n${uyariMsg}\n\n` +
        `Stok yeterli ancak bu üretimden sonra kritik seviyeye düşecek.\n` +
        `Yine de hazırlamaya almak istiyor musunuz?`
      );
      if(!devamEt) return;
    }
    // ──────────────────────────────────────────────────────────

    // ── Rezerve hareketleri hm_sh'a yaz ───────────────────────
    const bom = getBomlar().find(b => b.mamulUrunId === u.urunId && b.aktif !== false);
    const shList = ldS('sh');
    const bugun  = new Date().toISOString().slice(0,10);
    const malzDepo = u.malzemeDepoId || (ldS('depo').find(d=>d.aktif!==false)?.id) || 1;

    if(bom && bom.satirlar){
      bom.satirlar.forEach(s => {
        const miktar = Math.ceil((s.miktar||1)*(1+(s.fireOrani||0))*(u.adet||1));
        shList.push({
          id: nid(shList), urunId: s.urunId, depoId: malzDepo,
          yon: 'cikis', tip: 'rezerve',
          miktar, tar: bugun,
          ack: `REZERVE — Üretim #${u.no}`,
          refNo: u.no||'', birimFiyat:0, par:'TRY',
          onay:'onaylandi', sil:false, cat:ts()
        });
      });
    }
    svS('sh', shList);
    // ──────────────────────────────────────────────────────────

    list[idx].durum = 'hazirlaniyor';
    list[idx].rezerveTarihi = new Date().toISOString();
    saveUretim(list);
    logEkle('uretim_rezerve', null, {
      no: u.no, urunId: u.urunId, adet: u.adet,
      acik: `Üretim #${u.no} — malzemeler rezerve edildi`
    });
    renderAll();
    closeModal('uretim-modal');
    toast('Hazırlamaya alındı — malzemeler rezerve edildi', '2400', 'success');
  }

  function uretimOnayla(id){ uretimHazirla(id); } // geriye dönük uyumluluk

  function uretimBaslat(id){
    const list = getUretimler();
    const idx  = list.findIndex(u => u.id === id);
    if(idx < 0) return;
    list[idx].durum = 'uretimde';
    list[idx].basTarih = list[idx].basTarih || new Date().toISOString().slice(0,10);
    saveUretim(list);
    logEkle('uretim_baslat', null, { no: list[idx].no, urunId: list[idx].urunId });
    renderAll();
    closeModal('uretim-modal');
    toast('Üretime alındı', '2000', 'success');
  }

  function uretimKaliteKontrol(id){
    const list = getUretimler();
    const idx  = list.findIndex(u => u.id === id);
    if(idx < 0) return;
    list[idx].durum = 'kalite_kontrol';
    saveUretim(list);
    logEkle('uretim_kalite', null, { no: list[idx].no });
    // v4.0 — KK kaydı oluştur
    if(typeof kkKaydet === 'function'){
      const u = list[idx];
      kkKaydet({
        tip: 'uretim', ilgiliTip:'uretim', ilgiliId:id, ilgiliNo:u.no,
        urunId: u.urunId, urunAd: getUrunler().find(x=>x.id===u.urunId)?.ad||'',
        miktar: u.adet||1, kontrol_eden: u.kalite||u.sorumlu||'',
        not: `Üretim KK: ${u.no}`
      });
    }
    renderAll();
    closeModal('uretim-modal');
    toast('Kalite kontrole alındı', '2000', 'success');
  }

  function uretimTamamla(id){
    seriNoAta(id, getUretimler().find(u=>u.id===id)?.adet || 1);
  }

  function uretimIptal(){
    if(!activeUretimId || !confirm('Bu üretim emrini iptal etmek istiyor musunuz?')) return;
    const list = getUretimler();
    const idx  = list.findIndex(u => u.id === activeUretimId);
    if(idx < 0) return;

    const u = list[idx];
    const rezerveliydi = ['hazirlaniyor','uretimde','kalite_kontrol'].includes(u.durum);

    list[idx].durum = 'iptal';
    list[idx].iptalTarihi = ts();
    saveUretim(list);

    if(rezerveliydi){
      // Rezerve hareketlerini geri al — her rezerve kaydı için iptal girişi ekle
      const shList  = ldS('sh');
      const bugun   = new Date().toISOString().slice(0,10);
      const malzDepo = u.malzemeDepoId || (ldS('depo').find(d=>d.aktif!==false)?.id) || 1;
      const bom = getBomlar().find(b => b.mamulUrunId === u.urunId && b.aktif !== false);

      if(bom && bom.satirlar){
        bom.satirlar.forEach(s => {
          const miktar = Math.ceil((s.miktar||1)*(1+(s.fireOrani||0))*(u.adet||1));
          shList.push({
            id: nid(shList), urunId: s.urunId, depoId: malzDepo,
            yon: 'giris', tip: 'rezerve_iptal',
            miktar, tar: bugun,
            ack: `REZERVE İPTAL — Üretim #${u.no}`,
            refNo: u.no||'', birimFiyat:0, par:'TRY',
            onay:'onaylandi', sil:false, cat:ts()
          });
        });
      }
      svS('sh', shList);

      logEkle('uretim_rezerve_iptal', null, {
        no: u.no, urunId: u.urunId, adet: u.adet,
        acik: `Üretim #${u.no} iptal — malzeme rezervasyonu çözüldü`
      });
      toast('İptal edildi — malzeme rezervasyonu serbest bırakıldı', '2400', 'info');
    } else {
      toast('İptal edildi', '2000', 'info');
    }

    closeModal('uretim-modal');
    renderAll();
  }

  // ── Seri No ──
  function seriNoAta(uretimId, adet){
    activeUretimId = uretimId;
    const u = getUretimler().find(x => x.id === uretimId);
    const mamul = getUrunler().find(x => x.id === u?.urunId);

    document.getElementById('seri-info').textContent =
      `${mamul?.ad||'?'} — ${adet} adet için seri numarası girin (opsiyonel)`;

    // Otomatik seri no öner
    const prefix = (mamul?.kod || 'SN') + '-' + new Date().getFullYear() + '-';
    const inputs = Array.from({length: adet}, (_,i) =>
      `<input style="width:100%;padding:5px 8px;border:1px solid var(--bd);border-radius:var(--Rs);background:var(--bg);color:var(--t);font:12px var(--mn);margin-bottom:4px;box-sizing:border-box"
        id="seri-inp-${i}" placeholder="${prefix}${String(i+1).padStart(4,'0')}">`
    ).join('');

    document.getElementById('seri-giris-alani').innerHTML = inputs;
    openModal('seri-modal');
  }

  async function seriKaydet(){
    const u = getUretimler().find(x => x.id === activeUretimId);
    if(!u) return;

    // Seri noları topla
    const seriNolar = [];
    let i = 0;
    while(true){
      const inp = document.getElementById('seri-inp-' + i);
      if(!inp) break;
      const val = inp.value.trim();
      if(val) seriNolar.push(val);
      i++;
    }

    const list  = getUretimler();
    const idx   = list.findIndex(x => x.id === activeUretimId);
    if(idx < 0) return;

    // BOM'dan malzemeleri stok hareketleriyle düş ve mamulü stoka ekle
    const bom = getBomlar().find(b => b.mamulUrunId === u.urunId);
    const shList = ldS('sh');
    const bugun = new Date().toISOString().slice(0,10);
    // Malzeme deposu: emirden oku, yoksa ilk aktif depo
    const malzemeDepoId = u.malzemeDepoId || (ldS('depo').find(d=>d.aktif!==false)?.id) || 1;
    // Hedef depo: emirden oku, yoksa ilk aktif depo
    const hedefDepoId   = u.hedefDepoId   || (ldS('depo').find(d=>d.aktif!==false)?.id) || 1;

    if(bom && bom.satirlar){
      bom.satirlar.forEach(s => {
        const fireOrani = s.fireOrani || 0;
        shList.push({
          id: nid(shList), urunId: s.urunId, depoId: malzemeDepoId,
          yon: 'cikis', tip: 'uretim',
          miktar: Math.ceil((s.miktar||1) * (1 + fireOrani) * u.adet),
          tar: bugun,
          ack: 'Üretim #' + (u.no||activeUretimId) + ' malzeme tüketimi' + (fireOrani > 0 ? ' (fire dahil)' : ''),
          refNo: u.no||'', birimFiyat:0, par:'TRY',
          onay:'onaylandi', sil:false, cat:ts()
        });
      });
    }
    // Mamulü stoka ekle
    shList.push({
      id: nid(shList), urunId: u.urunId, depoId: hedefDepoId,
      yon: 'giris', tip: 'uretim',
      miktar: u.adet,
      tar: bugun,
      ack: 'Üretim #' + (u.no||activeUretimId) + ' mamul girişi',
      refNo: u.no||'', birimFiyat: u.maliyet ? Math.round(u.maliyet/u.adet*100)/100 : 0, par:'TRY',
      onay:'onaylandi', sil:false, cat:ts()
    });
    svS('sh', shList);

    list[idx].durum = 'tamamlandi';
    list[idx].seriNolar = seriNolar;
    list[idx].tamamlanmaTarihi = ts();
    saveUretim(list);

    // ── Tamamlama logu — tam detay ────────────────────────────
    const mamulAd = getUrunler().find(x=>x.id===u.urunId)?.ad || '?';
    const bomForLog = getBomlar().find(b=>b.mamulUrunId===u.urunId);
    const malzemeDetay = bomForLog
      ? bomForLog.satirlar.map(s=>{
          const p = getUrunler().find(x=>x.id===s.urunId);
          const mik = Math.ceil((s.miktar||1)*(1+(s.fireOrani||0))*u.adet);
          return `${p?.ad||'?'} ×${mik}`;
        }).join(', ')
      : '—';

    logEkle('uretim_tamamlandi', null, {
      no: u.no,
      urunId: u.urunId,
      adet: u.adet,
      mamulAd,
      malzemeDetay,
      seriNolar: seriNolar.length ? seriNolar.join(', ') : null,
      acik: `Üretim #${u.no} tamamlandı — ${u.adet}× ${mamulAd} stoka girdi | Tüketilen: ${malzemeDetay}`
    });
    // ──────────────────────────────────────────────────────────

    closeModal('seri-modal');
    renderAll();
    toast(`✅ Üretim tamamlandı! ${u.adet} adet stoka eklendi.`,'3000','success');
  }

  // v4.0 — Global AI
  window.addEventListener('DOMContentLoaded', () => {
    if(typeof buildGlobalAI === 'function') buildGlobalAI('uretim');
    if(typeof seedMasrafTurleri === 'function') seedMasrafTurleri();
  });
</script>
</body>
